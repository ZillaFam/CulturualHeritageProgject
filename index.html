<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Festival Quest</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body {
    background:#0c0a14;
    display:flex; align-items:center; justify-content:center;
    font-family:"Courier New", monospace;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
  }
  #wrap { position:relative; }
  canvas {
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#0c0a14;
    cursor:pointer;
  }
  /* touch controls */
  #touch { position:fixed; inset:0; pointer-events:none; display:none; z-index:5; }
  body.touchmode #touch { display:block; }
  .tbtn {
    position:absolute; pointer-events:auto;
    background:rgba(244,232,208,0.10);
    border:2px solid rgba(244,232,208,0.35);
    border-radius:12px;
    color:rgba(244,232,208,0.8);
    font-family:"Courier New",monospace; font-weight:bold; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .tbtn:active { background:rgba(242,182,50,0.35); }
  #t-up    { left:74px;  bottom:118px; width:56px; height:52px; }
  #t-down  { left:74px;  bottom:14px;  width:56px; height:52px; }
  #t-left  { left:14px;  bottom:62px;  width:56px; height:52px; }
  #t-right { left:134px; bottom:62px;  width:56px; height:52px; }
  #t-a { right:20px; bottom:64px; width:72px; height:72px; border-radius:50%; font-size:26px;
         background:rgba(224,60,40,0.25); border-color:rgba(224,60,40,0.6); }
  #t-b { right:104px; bottom:20px; width:58px; height:58px; border-radius:50%;
         background:rgba(74,144,194,0.2); border-color:rgba(74,144,194,0.55); }
  #t-j { right:20px; top:16px; width:52px; height:44px; font-size:22px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="touch">
  <div class="tbtn" id="t-up">▲</div>
  <div class="tbtn" id="t-down">▼</div>
  <div class="tbtn" id="t-left">◀</div>
  <div class="tbtn" id="t-right">▶</div>
  <div class="tbtn" id="t-a">✓</div>
  <div class="tbtn" id="t-b">✕</div>
  <div class="tbtn" id="t-j">📜</div>
</div>
<script>
'use strict';
/* ============================================================
   FESTIVAL QUEST — a Family Heritage Project game
   A journey through three traditional Chinese festivals:
   Lunar New Year, the Dragon Boat Festival, and Mid-Autumn.
   ============================================================ */

/* ---------- core constants ---------- */
const LW = 320, LH = 180;         // logical resolution
const P  = 3;                     // pixel scale (canvas is 960x540)
const cv = document.getElementById('game');
const cx = cv.getContext('2d');
cx.imageSmoothingEnabled = false;

/* fit canvas to window, preserving 16:9 */
function fitCanvas(){
  const aw = window.innerWidth, ah = window.innerHeight;
  let w = aw, h = aw * (LH/LW);
  if (h > ah){ h = ah; w = ah * (LW/LH); }
  cv.style.width  = Math.floor(w) + 'px';
  cv.style.height = Math.floor(h) + 'px';
}
window.addEventListener('resize', fitCanvas); fitCanvas();

/* ---------- tiny utils ---------- */
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const lerp  = (a,b,t)=> a+(b-a)*t;
const dist  = (x1,y1,x2,y2)=> Math.hypot(x2-x1, y2-y1);
const rnd   = (a=1,b)=> b===undefined ? Math.random()*a : a+Math.random()*(b-a);
const irnd  = (a,b)=> Math.floor(rnd(a,b+1));
const pick  = arr => arr[Math.floor(Math.random()*arr.length)];

/* ---------- game state ---------- */
const G = {
  name: 'You',
  ch: 0,          // 0 = intro-home, 1..3 festivals, 4 = done
  step: 0,        // quest step within chapter
  scrolls: [],    // ids of collected wisdom scrolls
  flags: {},
  muted: false,
  time: 0,        // global animation clock (seconds)
  night: 0,       // 0 day .. 1 night (world tint)
};

function saveGame(){
  try{
    localStorage.setItem('festivalquest_save', JSON.stringify({
      name:G.name, ch:G.ch, step:G.step, scrolls:G.scrolls, muted:G.muted, look:G.look||null
    }));
  }catch(e){}
}
function loadGame(){
  try{
    const d = JSON.parse(localStorage.getItem('festivalquest_save'));
    if (d && typeof d.ch === 'number'){ return d; }
  }catch(e){}
  return null;
}
function clearSave(){ try{ localStorage.removeItem('festivalquest_save'); }catch(e){} }

/* ---------- input ---------- */
const keys = {};       // held
const just = {};       // pressed this frame
const KEYMAP = {
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  KeyZ:'a', Space:'a', Enter:'a',
  KeyX:'b', Escape:'b',
  KeyJ:'journal', KeyM:'mute'
};
window.addEventListener('keydown', e=>{
  const k = KEYMAP[e.code];
  audioUnlock();
  if (typingMode){ handleTyping(e); e.preventDefault(); return; }
  if (k){ if(!keys[k]) just[k]=true; keys[k]=true; e.preventDefault(); }
});
window.addEventListener('keyup', e=>{
  const k = KEYMAP[e.code];
  if (k){ keys[k]=false; e.preventDefault(); }
});
/* touch buttons */
function bindBtn(id, name){
  const el = document.getElementById(id);
  const on  = e=>{ e.preventDefault(); audioUnlock(); if(!keys[name]) just[name]=true; keys[name]=true; };
  const off = e=>{ e.preventDefault(); keys[name]=false; };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}
bindBtn('t-up','up'); bindBtn('t-down','down'); bindBtn('t-left','left');
bindBtn('t-right','right'); bindBtn('t-a','a'); bindBtn('t-b','b'); bindBtn('t-j','journal');
window.addEventListener('touchstart', ()=> document.body.classList.add('touchmode'), {passive:true});

/* taps on the canvas act as "A" and report a logical position */
let tapPos = null;
cv.addEventListener('pointerdown', e=>{
  audioUnlock();
  const r = cv.getBoundingClientRect();
  tapPos = { x:(e.clientX-r.left)/r.width*LW, y:(e.clientY-r.top)/r.height*LH };
  just.a = true;
});

/* ---------- text helpers ---------- */
const FONT = '"Courier New", monospace';
function T(str, x, y, size=7, color='#f4e8d0', align='left', bold=true){
  cx.font = (bold?'bold ':'') + (size*P) + 'px ' + FONT;
  cx.textAlign = align; cx.textBaseline = 'top';
  cx.fillStyle = color;
  cx.fillText(str, x*P, y*P);
}
function Tsh(str, x, y, size=7, color='#f4e8d0', align='left', shadow='rgba(0,0,0,0.55)'){
  cx.font = 'bold ' + (size*P) + 'px ' + FONT;
  cx.textAlign = align; cx.textBaseline = 'top';
  cx.fillStyle = shadow; cx.fillText(str, x*P+P, y*P+P);
  cx.fillStyle = color;  cx.fillText(str, x*P, y*P);
}
function textW(str, size=7){
  cx.font = 'bold ' + (size*P) + 'px ' + FONT;
  return cx.measureText(str).width / P;
}
function wrap(str, maxW, size=7){
  const words = String(str).split(' ');
  const lines = []; let line = '';
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (textW(test, size) > maxW && line){ lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

/* ---------- rectangles & boxes ---------- */
/* every rect snaps to the LOGICAL pixel grid so everything reads as true pixel art */
function R(x,y,w,h,color){
  const rx = Math.round(x), ry = Math.round(y);
  let rw = Math.round(x+w) - rx, rh = Math.round(y+h) - ry;
  if (rw===0) rw = w>=0 ? 1 : -1;
  if (rh===0) rh = h>=0 ? 1 : -1;
  cx.fillStyle = color;
  cx.fillRect(rx*P, ry*P, rw*P, rh*P);
}
function box(x,y,w,h, opts={}){
  const bg = opts.bg || 'rgba(20,12,16,0.94)';
  const border = opts.border || '#f2b632';
  R(x-1,y-1,w+2,h+2, border);
  R(x,y,w,h, bg);
  // corner studs
  const c = opts.stud || '#e03c28';
  R(x-1,y-1,2,2,c); R(x+w-1,y-1,2,2,c); R(x-1,y+h-1,2,2,c); R(x+w-1,y+h-1,2,2,c);
}

/* ---------- particles ---------- */
let parts = [];
function spawnPart(p){ parts.push(p); if (parts.length>400) parts.splice(0, parts.length-400); }
function burst(x,y,colors,n=26,spd=60){
  for(let i=0;i<n;i++){
    const a = rnd(Math.PI*2), s = rnd(spd*0.3, spd);
    spawnPart({x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rnd(0.5,1.1), t:0,
      c:pick(colors), g:34, sz:rnd(1,2.4)});
  }
}
function updateParts(dt){
  for (const p of parts){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.g||0)*dt; }
  parts = parts.filter(p=> p.t < p.life);
}
function drawParts(camx=0, camy=0){
  for (const p of parts){
    cx.globalAlpha = clamp(1 - p.t/p.life, 0, 1);
    R(p.x-camx, p.y-camy, p.sz, p.sz, p.c);
  }
  cx.globalAlpha = 1;
}

/* ---------- audio (WebAudio, all generated) ---------- */
let AC = null, masterGain = null, musicGain = null, musicTimer = null, musicChapter = -1;
function audioUnlock(){
  if (!AC){
    try{
      AC = new (window.AudioContext||window.webkitAudioContext)();
      masterGain = AC.createGain(); masterGain.gain.value = G.muted?0:0.5; masterGain.connect(AC.destination);
      musicGain = AC.createGain(); musicGain.gain.value = 0.42; musicGain.connect(masterGain);
    }catch(e){}
  }
  if (AC && AC.state==='suspended') AC.resume();
}
function setMuted(m){ G.muted=m; if (masterGain) masterGain.gain.value = m?0:0.5; saveGame(); }
function tone(freq, dur=0.12, type='triangle', vol=0.5, when=0, dest){
  if (!AC) return;
  const t0 = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  o.connect(g); g.connect(dest||masterGain);
  o.start(t0); o.stop(t0+dur+0.02);
}
function noiseHit(dur=0.2, vol=0.5, low=false){
  if (!AC) return;
  const n = AC.sampleRate*dur, buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
  const s = AC.createBufferSource(); s.buffer = buf;
  const g = AC.createGain(); g.gain.value = vol;
  if (low){ const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=300; s.connect(f); f.connect(g); }
  else s.connect(g);
  g.connect(masterGain); s.start();
}
const SFX = {
  blip(){ tone(660,0.05,'square',0.12); },
  select(){ tone(523,0.07,'square',0.2); tone(784,0.09,'square',0.2,0.06); },
  back(){ tone(392,0.08,'square',0.15); },
  scroll(){ [523,659,784,1047].forEach((f,i)=> tone(f,0.14,'triangle',0.3,i*0.09)); },
  good(){ tone(659,0.09,'triangle',0.35); tone(988,0.14,'triangle',0.35,0.08); },
  bad(){ tone(196,0.2,'sawtooth',0.2); },
  boom(){ noiseHit(0.35,0.6); tone(80,0.3,'sine',0.5); },
  drum(){ noiseHit(0.12,0.35,true); tone(70,0.18,'sine',0.7); },
  gong(){ tone(196,1.6,'sine',0.5); tone(294,1.2,'sine',0.25,0.02); noiseHit(0.4,0.12); },
  sparkle(){ [1319,1568,2093].forEach((f,i)=> tone(f,0.1,'sine',0.2,i*0.05)); },
  win(){ [523,659,784,1047,1319].forEach((f,i)=> tone(f,0.22,'triangle',0.35,i*0.11)); },
};

/* looping pentatonic music — one melody per chapter, guzheng-ish plucks */
const MELODIES = [
  // intro/home & title: gentle D pentatonic
  { bpm:96,  bass:[147,110,131,110], notes:[587,659,880,784,659,587,440,523, 587,659,784,880,1047,880,784,659] },
  // ch1 New Year: festive
  { bpm:132, bass:[196,147,175,147], notes:[784,880,1047,880,784,659,587,659, 784,1047,1175,1047,880,784,659,587] },
  // ch2 Dragon Boat: driving
  { bpm:120, bass:[110,110,131,131], notes:[440,523,587,523,440,392,330,392, 440,587,659,587,523,440,392,330] },
  // ch3 Mid-Autumn: moonlit lullaby
  { bpm:76,  bass:[131,98,110,98],  notes:[523,587,659,784,659,587,523,440, 523,659,587,523,440,392,440,523] },
];
function playMusic(idx){
  if (musicChapter === idx) return;
  musicChapter = idx;
  if (musicTimer){ clearInterval(musicTimer); musicTimer = null; }
  if (idx < 0) return;
  let step = 0;
  const play = ()=>{
    if (!AC) return;
    const m = MELODIES[idx];
    const n = m.notes[step % m.notes.length];
    if (n) { tone(n, 0.34, 'triangle', 0.16, 0, musicGain); tone(n*2, 0.18, 'sine', 0.05, 0, musicGain); }
    if (step % 4 === 0){ tone(m.bass[(step/4) % m.bass.length], 0.5, 'sine', 0.1, 0, musicGain); }
    if (idx===2 && step%2===0){ tone(65,0.1,'sine',0.12,0,musicGain); } // boat drums
    step++;
  };
  const m = MELODIES[idx];
  musicTimer = setInterval(play, Math.round(60000 / m.bpm / 2));
}

/* ---------- scene manager ---------- */
const stack = [];
function pushScene(s){ stack.push(s); if (s.enter) s.enter(); }
function popScene(){ const s = stack.pop(); if (s && s.exit) s.exit(); }
function swapScene(s){ while(stack.length) popScene(); pushScene(s); }
function topScene(){ return stack[stack.length-1]; }

/* ---------- main loop ---------- */
let lastT = performance.now(), acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - lastT)/1000; lastT = now;
  if (dt > 0.25) dt = 0.25;
  G.time += dt;
  const s = topScene();
  if (s){
    if (s.update) s.update(dt);
    // render from the lowest opaque scene upward (overlays draw on top)
    let start = stack.length-1;
    while (start>0 && stack[start].overlay) start--;
    for (let i=start;i<stack.length;i++) if (stack[i].render) stack[i].render();
  }
  for (const k in just) just[k] = false;
  tapPos = null;
  if (just.mute) {}
}
/* global mute key */
window.addEventListener('keydown', e=>{ if (e.code==='KeyM' && !typingMode) setMuted(!G.muted); });

/* fade transition helper */
let fade = { a:0, target:0, speed:2.5, cb:null };
function fadeOut(cb, speed=2.5){ fade.target = 1; fade.speed = speed; fade.cb = cb; }
function fadeIn(speed=2.5){ fade.target = 0; fade.speed = speed; fade.cb = null; }
function updateFade(dt){
  if (fade.a < fade.target){ fade.a = Math.min(fade.target, fade.a + fade.speed*dt);
    if (fade.a>=1 && fade.cb){ const c=fade.cb; fade.cb=null; c(); } }
  else if (fade.a > fade.target){ fade.a = Math.max(fade.target, fade.a - fade.speed*dt); }
}
function drawFade(){
  if (fade.a>0){ cx.globalAlpha = fade.a; R(0,0,LW,LH,'#0c0a14'); cx.globalAlpha = 1; }
}

/* typing mode (name entry) */
let typingMode = false;
let typedName = '';
function handleTyping(e){
  if (e.code === 'Backspace'){ typedName = typedName.slice(0,-1); SFX.blip(); return; }
  if (e.code === 'Enter'){ finishTyping(); return; }
  if (/^[a-zA-Z0-9]$/.test(e.key) && typedName.length < 8){ typedName += e.key; SFX.blip(); }
}
let finishTyping = ()=>{};
/* ============================================================
   ART — everything is drawn in code, pixel-style
   ============================================================ */

const CJK = '"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Microsoft YaHei","SimSun",serif';
function hanzi(str, x, y, size, color, align='center'){
  cx.font = (size*P)+'px '+CJK;
  cx.textAlign = align; cx.textBaseline = 'middle';
  cx.fillStyle = color; cx.fillText(str, x*P, y*P);
}

function glow(x,y,r,color,alpha=0.35){
  const gx = x*P, gy = y*P, gr = r*P;
  const g = cx.createRadialGradient(gx,gy,1,gx,gy,gr);
  g.addColorStop(0,color); g.addColorStop(1,'rgba(0,0,0,0)');
  cx.globalAlpha = alpha; cx.fillStyle = g;
  cx.fillRect(gx-gr,gy-gr,gr*2,gr*2);
  cx.globalAlpha = 1;
}
/* pixel-perfect circle: integer scanline runs, no anti-aliasing */
function circle(x,y,r,color){
  cx.fillStyle = color;
  const cxi = Math.round(x), cyi = Math.round(y), rr = Math.max(r, 0.5);
  const RY = Math.round(rr);
  for (let dy=-RY; dy<=RY; dy++){
    const t = rr*rr - dy*dy;
    if (t < 0) continue;
    const half = Math.round(Math.sqrt(t));
    cx.fillRect((cxi-half)*P, (cyi+dy)*P, (half*2+1)*P, P);
  }
}
/* pixel ellipse + upper-half dome */
function ell(x,y,rx,ry,color){
  cx.fillStyle = color;
  const cxi = Math.round(x), cyi = Math.round(y), RY = Math.max(1, Math.round(ry));
  for (let dy=-RY; dy<=RY; dy++){
    const f = 1 - (dy*dy)/(ry*ry || 1);
    if (f < 0) continue;
    const half = Math.round(rx*Math.sqrt(f));
    cx.fillRect((cxi-half)*P, (cyi+dy)*P, (half*2+1)*P, P);
  }
}
function dome(x,y,rx,ry,color){
  cx.fillStyle = color;
  const cxi = Math.round(x), cyi = Math.round(y), RY = Math.max(1, Math.round(ry));
  for (let dy=-RY; dy<=0; dy++){
    const f = 1 - (dy*dy)/(ry*ry || 1);
    if (f < 0) continue;
    const half = Math.round(rx*Math.sqrt(f));
    cx.fillRect((cxi-half)*P, (cyi+dy)*P, (half*2+1)*P, P);
  }
}

/* deterministic per-tile hash for texture specks */
function thash(a,b){ let h = (a*73856093) ^ (b*19349663); h = (h ^ (h>>13)) * 1274126177; return Math.abs(h % 1000)/1000; }

/* ---------- people (procedural pixel folk) ---------- */
/* anchor: x = center of feet, y = ground line */
function drawPerson(x, y, o, t=0){
  x = Math.round(x); y = Math.round(y);
  const walking = o.walk;
  const fr = walking ? Math.floor(t*9)%2 : 0;
  const child = o.child, elder = o.elder;
  const legH = child?3:4, torsoH = child?6:7, headH = child?8:7, headW = child?9:8;
  const bob = (walking && fr===1) ? 1 : 0;
  const top = o.top||'#c02c20', pants = o.pants||'#3a3a55',
        skin = o.skin||'#eac086', hair = o.hair||'#181418';
  // shadow
  cx.fillStyle='rgba(0,0,0,0.22)';
  cx.fillRect((x-5)*P,(y-1)*P,10*P,2*P);
  // legs
  const lys = y-legH, ll = fr===1?1:0, rl = fr===1?0:1;
  R(x-4, lys-(walking?ll:0), 3, legH+(walking?ll:0), pants);
  R(x+1, lys-(walking?rl:0), 3, legH+(walking?rl:0), pants);
  // torso
  const ty = y-legH-torsoH-bob;
  R(x-5, ty, 10, torsoH, top);
  // simple robe trim for elders
  if (elder) R(x-5, ty+torsoH-2, 10, 1, '#f2b632');
  // arms
  R(x-7, ty+1, 2, torsoH-2, top);
  R(x+5, ty+1, 2, torsoH-2, top);
  R(x-7, ty+torsoH-2, 2, 2, skin);
  R(x+5, ty+torsoH-2, 2, 2, skin);
  // head
  const hy = ty-headH+(elder?1:0);
  R(x-headW/2, hy, headW, headH, skin);
  // hair
  if (o.dir==='up'){
    R(x-headW/2, hy-1, headW, headH-2, hair);
  } else {
    R(x-headW/2, hy-1, headW, 3, hair);
    R(x-headW/2, hy+1, 2, 2, hair);
    R(x+headW/2-2, hy+1, 2, 2, hair);
    if (o.buns){ R(x-headW/2-2, hy-1, 3, 3, hair); R(x+headW/2-1, hy-1, 3, 3, hair); }
    if (o.bun){ R(x-1, hy-3, 3, 3, hair); }
    // eyes
    const eyeY = hy+3;
    if (o.dir==='left'){ R(x-3, eyeY, 2, 2, '#241a14'); }
    else if (o.dir==='right'){ R(x+1, eyeY, 2, 2, '#241a14'); }
    else { R(x-3, eyeY, 2, 2, '#241a14'); R(x+1, eyeY, 2, 2, '#241a14'); }
    if (o.beard){ R(x-2, hy+headH-1, 4, 2, '#e8e4dc'); }  // beard
    if (o.blush) { R(x-headW/2+1, eyeY+2, 1, 1, '#e8927c'); R(x+headW/2-2, eyeY+2, 1, 1, '#e8927c'); }
  }
  if (o.hat){ // straw hat
    R(x-headW/2-2, hy-1, headW+4, 2, '#c8a860');
    R(x-2, hy-3, 5, 2, '#c8a860');
  }
}

/* ---------- Lóng the paper dragon (follows the player) ---------- */
function drawLong(x, y, t, flip=false){
  const dirM = flip?-1:1;
  // body segments trail behind the head in a sine wave
  for (let i=5;i>=1;i--){
    const sx = x - dirM*i*5;
    const sy = y + Math.sin(t*3 + i*0.9)*2.5;
    circle(sx, sy, i===5?2:3.2, i%2? '#e03c28' : '#f2b632');
    if (i%2===0) circle(sx, sy-1, 1.2, '#f8e0a0');
  }
  const hy = y + Math.sin(t*3)*2.5;
  // head
  R(x-6, hy-4, 12, 8, '#f2b632');
  R(x-6+(flip?0:8), hy-2, 4, 4, '#f8e0a0');       // snout
  R(x-2, hy-6, 4, 2, '#e03c28');                   // brow
  R(x-6, hy-6, 2, 3, '#e03c28'); R(x+4, hy-6, 2, 3, '#e03c28'); // horns
  R(x+(flip?-4:2), hy-3, 2, 2, '#241a14');         // eye
  // whiskers
  R(x+(flip?-9:7), hy+1, 3, 1, '#e03c28');
  R(x+(flip?-8:6), hy+3, 2, 1, '#e03c28');
  glow(x, hy, 10, '#f2b632', 0.12);
}

function ovFor(spec, dir){
  if (!spec) return null;
  if (Array.isArray(spec)) return spec;
  const d = (dir==='up') ? 'up' : (dir==='down') ? 'down' : 'side';
  return spec[d] || null;
}

/* shade helper: darken/lighten a hex color */
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  r = clamp(Math.round(r*f), 0, 255); g = clamp(Math.round(g*f), 0, 255); b = clamp(Math.round(b*f), 0, 255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function chibiPalette(look){
  const skin = look.skin||'#f2c896', hair = look.hair||'#241a1e',
        top  = look.top ||'#e03c28', legs = look.pants||'#3a4a8a';
  return {
    o:'#2b1a26',
    H:hair, h:shade(hair,1.6),
    S:skin, s:shade(skin,0.82),
    W:'#ffffff', E:'#241a20',
    T:top, t:shade(top,0.72),
    L:legs, F:shade(legs,0.55),
    G:'#e8b028', R:'#d43424', Y:'#d8b869', D:'#ece8e0', P:'#f2a08c',
  };
}
function composeRows(dir, frame, robe){
  const head = dir==='up'? HEAD_UP : dir==='down'? HEAD_DOWN : HEAD_SIDE;
  let body;
  if (robe) body = (dir==='up'||dir==='down') ? ROBE_DOWN : ROBE_SIDE;
  else if (dir==='up'||dir==='down') body = frame===1 ? BODY_DOWN_1 : BODY_DOWN_0;
  else body = frame===1 ? BODY_SIDE_1 : BODY_SIDE_0;
  return [PAD, ...head, ...body];
}
function paintRows(ctx2, rows, pal){
  for (let y=0;y<rows.length;y++){
    const row = rows[y];
    if (row.length !== 16) { console.error('BAD SPRITE ROW len '+row.length+': "'+row+'"'); }
    for (let x=0;x<row.length;x++){
      const ch = row[x];
      if (ch==='.') continue;
      const c = pal[ch];
      if (!c){ console.error('BAD SPRITE CHAR "'+ch+'" in "'+row+'"'); continue; }
      ctx2.fillStyle = c;
      ctx2.fillRect(x*P, y*P, P, P);
    }
  }
}
const chibiCache = {};
function chibiSprite(look, dir, frame){
  const key = [look.skin,look.hair,look.top,look.pants,look.hairstyle||'',look.elder?1:0,look.buns?1:0,
               look.bun?1:0,look.hat?1:0,look.beard?1:0,look.glasses?1:0,look.blush?1:0,look.band?1:0,
               dir,frame].join('|');
  if (chibiCache[key]) return chibiCache[key];
  const mirror = dir==='right';
  const d = mirror ? 'left' : dir;
  const c = document.createElement('canvas');
  c.width = 16*P; c.height = 20*P;
  const ctx2 = c.getContext('2d');
  const pal = chibiPalette(look);
  paintRows(ctx2, composeRows(d, frame, !!look.elder), pal);
  const applyOv = spec => { const m = ovFor(spec, d); if (m) paintRows(ctx2, m, pal); };
  if (look.hairstyle==='long') applyOv(OV_LONG);
  if (look.hairstyle==='pony') applyOv(OV_PONY);
  if (look.buns || look.hairstyle==='buns') applyOv(OV_BUNS);
  if (look.bun) applyOv(OV_BUN);
  if (look.hat) applyOv(OV_HAT);
  if (look.band) applyOv(OV_BAND);
  if (look.beard) applyOv(OV_BEARD);
  if (look.glasses) applyOv(OV_GLASSES);
  if (look.blush || look.buns) applyOv(OV_BLUSH);
  if (mirror){
    const m = document.createElement('canvas');
    m.width = c.width; m.height = c.height;
    const mc = m.getContext('2d');
    mc.translate(c.width, 0); mc.scale(-1,1); mc.drawImage(c, 0, 0);
    chibiCache[key] = m; return m;
  }
  chibiCache[key] = c;
  return c;
}

/* replaces the old rectangle people */
function drawPerson(x, y, o, t=0){
  x = Math.round(x); y = Math.round(y);
  const dir = o.dir || 'down';
  let frame = 0, bob = 0;
  if (o.walk){
    const ph = Math.floor(t*8)%4;
    if (dir==='left'||dir==='right'){ frame = (ph%2===0)?1:0; }
    else { frame = ph===1?1: ph===3?2:0; }
    bob = (ph%2===1)?-1:0;
  }
  cx.fillStyle='rgba(20,8,16,0.25)';
  cx.fillRect((x-5)*P,(y-2)*P,10*P,3*P);
  if (frame===2){   // mirrored step for down/up
    const spr = chibiSprite(o, dir, 1);
    cx.save();
    cx.translate(x*P, 0); cx.scale(-1,1);
    cx.drawImage(spr, -8*P, (y-20+bob)*P);
    cx.restore();
    return;
  }
  const spr = chibiSprite(o, dir, frame);
  cx.drawImage(spr, (x-8)*P, (y-20+bob)*P);
}

/* pixel-perfect triangle: integer scanline runs, no anti-aliasing */
function tri(x1,y1,x2,y2,x3,y3,c){
  cx.fillStyle = c;
  const pts = [[Math.round(x1),Math.round(y1)],[Math.round(x2),Math.round(y2)],[Math.round(x3),Math.round(y3)]]
    .sort((a,b)=>a[1]-b[1]);
  const A = pts[0], B = pts[1], C = pts[2];
  const xAt = (p,q,y)=> p[1]===q[1] ? p[0] : p[0] + (q[0]-p[0])*(y-p[1])/(q[1]-p[1]);
  for (let y=A[1]; y<=C[1]; y++){
    const xa = xAt(A, C, y);
    const xb = y < B[1] ? xAt(A, B, y) : xAt(B, C, y);
    const lo = Math.round(Math.min(xa,xb)), hi = Math.round(Math.max(xa,xb));
    cx.fillRect(lo*P, y*P, (hi-lo+1)*P, P);
  }
}
const INK = '#1a1016';

/* gold-shaded blob (dragon) */
function gblob(x, y, r){
  circle(x, y, r+0.9, INK);
  circle(x, y, r, '#c07c1c');
  circle(x-r*0.12, y-r*0.22, r*0.82, '#f2b632');
  circle(x-r*0.32, y-r*0.42, r*0.42, '#ffe27a');
}
/* green-shaded blob (nian) */
function nblob(x, y, r, hi){
  circle(x, y, r+0.9, INK);
  circle(x, y, r, '#2a6620');
  circle(x-r*0.12, y-r*0.22, r*0.82, '#48962c');
  if (hi!==false) circle(x-r*0.32, y-r*0.42, r*0.42, '#7cc93e');
}

/* ---------- LÓNG the dragon ---------- */
function drawLong(hx, hy, t, flip=false, sc=1){
  cx.save();
  cx.imageSmoothingEnabled = false;
  cx.translate(hx*P, hy*P); cx.scale(sc, sc); cx.translate(-hx*P, -hy*P);
  const D = flip ? -1 : 1;
  const N = 11, SP = 5.2, RR = 5;
  const bx = i => hx - D*(8 + i*SP);
  const by = i => hy + 5.5 + Math.sin(t*2.6 + i*0.55)*3.4;
  // tail fan (behind everything)
  const tx2 = bx(N+0.6), ty2 = by(N+0.6);
  tri(tx2+D*3, ty2, tx2-D*7, ty2-7, tx2-D*9, ty2, INK);
  tri(tx2+D*3, ty2, tx2-D*9, ty2, tx2-D*7, ty2+7, INK);
  tri(tx2+D*2, ty2-0.4, tx2-D*6, ty2-5.6, tx2-D*7.6, ty2-0.4, '#d43424');
  tri(tx2+D*2, ty2+0.4, tx2-D*7.6, ty2+0.4, tx2-D*6, ty2+5.6, '#8a1c14');
  tri(tx2+D*1.4, ty2-0.6, tx2-D*4, ty2-3.4, tx2-D*5, ty2-0.6, '#ff8656');
  // dorsal fins (every other segment, drawn before the tube so they poke out the top)
  for (let i=N;i>=0;i-=2){
    const sx = bx(i), sy = by(i);
    tri(sx-3.6, sy-2.6, sx-D*1, sy-9.8, sx+3.6, sy-2.6, INK);
    tri(sx-2.6, sy-3, sx-D*1, sy-8.6, sx+2.6, sy-3, '#d43424');
    tri(sx-1.8, sy-3.2, sx-D*1.2, sy-7.6, sx+0.2, sy-3.2, '#ff8656');
  }
  // continuous tube body: outline pass, base pass, light pass
  for (let i=N;i>=0;i--) circle(bx(i), by(i), RR+0.9, INK);
  for (let i=N;i>=0;i--) circle(bx(i), by(i), RR, '#c07c1c');
  for (let i=N;i>=0;i--) circle(bx(i)-0.6, by(i)-1.2, RR*0.78, '#f2b632');
  for (let i=N;i>=0;i--) circle(bx(i)-1.4, by(i)-2, RR*0.4, '#ffe27a');
  // belly plates
  for (let i=N;i>=0;i--){
    const sx = bx(i), sy = by(i);
    R(sx-2.8, sy+1.6, 5.6, 2, '#f0d898');
    R(sx-2, sy+3.6, 4, 1, '#f0d898');
    R(sx-2, sy+2.6, 4, 1, '#c8a05c');
  }
  // scale ticks
  for (let i=N-1;i>=1;i-=2){
    R(bx(i)+D*2.6, by(i)-2.4, 1, 3, '#9c6114');
    R(bx(i)+D*3.4, by(i)-1, 1, 2, '#9c6114');
  }
  // little clawed legs
  for (const i of [3, 8]){
    const sx = bx(i), sy = by(i);
    R(sx-1.4, sy+3.8, 3, 4.8, INK); R(sx-0.8, sy+4.2, 1.8, 3.8, '#c07c1c'); R(sx-0.8, sy+4.2, 1, 2, '#f2b632');
    R(sx-3, sy+8, 6, 2.2, INK);
    R(sx-2.5, sy+8.3, 1.5, 1.5, '#e8d8b8'); R(sx-0.3, sy+8.3, 1.5, 1.5, '#e8d8b8'); R(sx+1.6, sy+8.3, 1.2, 1.5, '#e8d8b8');
  }
  /* ----- head (chunky, facing D) ----- */
  // mane: layered spikes anchored to the back of the skull
  const MSP = [[-2,-6,-11,-10],[-3,-3,-13,-4],[-3,1,-13,3],[-2,4,-11,8]];
  for (const [ax1, ay1, ax2, ay2] of MSP){
    tri(hx+D*ax1, hy+ay1-2, hx+D*ax2, hy+ay2, hx+D*ax1, hy+ay1+2.6, INK);
  }
  MSP.forEach(([ax1, ay1, ax2, ay2], k)=>{
    tri(hx+D*(ax1+0.6), hy+ay1-1.4, hx+D*(ax2+1.6), hy+ay2, hx+D*(ax1+0.6), hy+ay1+2, k%2 ? '#d43424' : '#8a1c14');
    if (k%2===0) tri(hx+D*(ax1+0.6), hy+ay1-0.8, hx+D*((ax1+ax2)/2), hy+(ay1+ay2)/2, hx+D*(ax1+0.6), hy+ay1+1, '#ff8656');
  });
  // whiskers: dotted pixel strands trailing back
  for (const [y0, amp, ph] of [[3, 1.6, 0], [5, 2, 1.3]]){
    for (let k=0;k<9;k++){
      const wx = hx + D*(8 - k*2.3);
      const wy = hy + y0 + k*0.55 + Math.sin(t*2.6 + ph + k*0.5)*amp*(k/9);
      R(wx, wy, 1, 1, k<2 ? '#f2b632' : '#e8b028');
    }
  }
  // antlers: stepped beams sweeping up and BACK, deer-style, with a fork
  for (const ox of [1, 4.6]){
    const ax = hx + D*ox;
    for (let k=0;k<4;k++) R(ax - D*(k*1.5+1.3), hy-6.6-k*2, D*3, 3, INK);
    R(ax - D*9.2, hy-14.6, D*3.2, 2.8, INK);
    for (let k=0;k<4;k++) R(ax - D*(k*1.5+0.9), hy-6.2-k*2, D*2, 2.2, k<2 ? '#b08c5c' : '#e8d8b8');
    R(ax - D*8.8, hy-14.2, D*2.4, 1.8, '#e8d8b8');
  }
  // ear fin
  tri(hx-D*4, hy-4.5, hx-D*8.5, hy-7.5, hx-D*4, hy-1, INK);
  tri(hx-D*4, hy-4, hx-D*7.4, hy-6.4, hx-D*4, hy-1.4, '#d43424');
  // skull
  gblob(hx, hy-1, 6.6);
  // snout: broad, stepped
  R(hx+D*3, hy-3.4, D*10.6, 7, INK);
  R(hx+D*3, hy-2.6, D*9.8, 5.4, '#f2b632');
  R(hx+D*3, hy-2.6, D*9, 1.6, '#ffe27a');
  circle(hx+D*12.6, hy+0.2, 2.6, INK); circle(hx+D*12.2, hy, 2.1, '#f2b632');
  // nostril + bump
  R(hx+D*11.2, hy-2.2, D*1.6, 1.4, INK);
  R(hx+D*9.6, hy-3.6, D*2.6, 1.2, '#ffe27a');
  // brow ridge
  R(hx+D*0.6, hy-5.6, D*7, 2.4, INK);
  R(hx+D*1.2, hy-5, D*5.6, 1.4, '#c07c1c');
  // eye: big, glinty
  R(hx+D*1.6, hy-3.4, D*4, 3.6, INK);
  R(hx+D*2, hy-3, D*3.2, 2.8, '#ffffff');
  R(hx+D*3.6, hy-2.8, D*1.6, 2.4, '#18100e');
  R(hx+D*3.8, hy-2.6, D*0.8, 0.8, '#ffffff');
  // mouth: open with teeth + red inside
  R(hx+D*4, hy+3.2, D*9, 1.6, '#8a1c14');
  tri(hx+D*5, hy+3.2, hx+D*5.8, hy+4.6, hx+D*6.6, hy+3.2, '#fff3d0');
  tri(hx+D*8, hy+3.2, hx+D*8.8, hy+4.6, hx+D*9.6, hy+3.2, '#fff3d0');
  // lower jaw
  R(hx+D*3.6, hy+4.6, D*8.6, 2.6, INK);
  R(hx+D*4, hy+4.8, D*7.6, 1.8, '#c07c1c');
  tri(hx+D*11, hy+4.8, hx+D*11.8, hy+3.4, hx+D*12.6, hy+4.8, '#fff3d0');
  // chin barbel
  circle(hx+D*4.6, hy+8, 1.4, INK); circle(hx+D*4.4, hy+7.8, 0.9, '#f2b632');
  glow(hx, hy, 13, '#f2b632', 0.13);
  cx.restore();
}

/* ---------- NIAN the beast ---------- */
function drawNian(x, y, t){
  const stomp = Math.round(Math.abs(Math.sin(t*3.2))*1.6);
  const by = y - stomp;
  ell(x+2, y-1, 29, 2.6, 'rgba(0,0,0,0.32)');
  // tail
  nblob(x-25, by-14, 3.6);
  nblob(x-28, by-19, 3, false);
  tri(x-28, by-25, x-32, by-17, x-25, by-20, INK);
  tri(x-28, by-24, x-31, by-18, x-26, by-20, '#d43424');
  // back leg
  nblob(x-15, by-8, 6);
  R(x-18, by-5, 6, 5, INK); R(x-17, by-4.4, 4, 4, '#2a6620');
  R(x-18.6, by-1.4, 7, 1.8, INK);
  R(x-18, by-1.2, 1.6, 1.4, '#ede0bc'); R(x-15.6, by-1.2, 1.6, 1.4, '#ede0bc'); R(x-13.4, by-1.2, 1.4, 1.4, '#ede0bc');
  // body: muscle cluster
  nblob(x-16, by-17, 8.4);
  nblob(x-6, by-20, 9.6);
  nblob(x+3, by-18, 9);
  nblob(x-6, by-12, 8, false);
  nblob(x+4, by-10.5, 7.4, false);
  // spiky ridge along the back
  for (let i=0;i<6;i++){
    const sx = x-22+i*5.2, sh = 6 + (i%3)*2;
    tri(sx-2.6, by-24, sx, by-24-sh, sx+2.6, by-24, INK);
    tri(sx-1.8, by-24.4, sx, by-24-sh+1, sx+1.8, by-24.4, i%2 ? '#2a6620' : '#48962c');
    tri(sx-1.2, by-24.4, sx-0.4, by-24-sh+2.2, sx+0.2, by-24.4, '#7cc93e');
  }
  // belly shag
  for (let i=0;i<6;i++){
    const sx = x-18+i*5;
    tri(sx-2.2, by-7, sx, by-2.6+(i%2)*1.4, sx+2.2, by-7, INK);

/* ---------- dialogue system ---------- */
const DLG = { active:false, queue:[], line:null, chars:0, onDone:null, choice:null, sel:0 };
function say(entries, onDone){
  DLG.queue = entries.slice(); DLG.onDone = onDone || null;
  DLG.active = true; DLG.choice = null;
  dlgNext();
}
function dlgNext(){
  const e = DLG.queue.shift();
  if (!e){
    DLG.active = false; DLG.line = null;
    const cb = DLG.onDone; DLG.onDone = null;
    if (cb) cb();
    return;
  }
  if (e.choice){ DLG.choice = e; DLG.sel = 0; DLG.line = null; SFX.blip(); return; }
  DLG.line = e; DLG.chars = 0;
}
function dlgUpdate(dt){
  if (DLG.choice){
    const n = DLG.choice.choice.length;
    if (just.up)   { DLG.sel = (DLG.sel+n-1)%n; SFX.blip(); }
    if (just.down) { DLG.sel = (DLG.sel+1)%n; SFX.blip(); }
    if (just.a){
      const c = DLG.choice; DLG.choice = null;
      SFX.select();
      if (c.cb) c.cb(DLG.sel);
      else dlgNext();
      return;
    }
    return;
  }
  if (!DLG.line) return;
  DLG.chars += dt*50;
  if (just.a){
    if (DLG.chars < DLG.line.text.length){ DLG.chars = DLG.line.text.length; }
    else { SFX.blip(); dlgNext(); }
  }
}
function dlgRender(){
  if (DLG.choice){
    const c = DLG.choice;
    const lines = wrap(c.q || '', 270, 6.4);
    const optH = c.choice.length*11;
    const h = lines.length*8 + optH + 12;
    box(20, 168-h, 280, h);
    let yy = 172-h;
    for (const ln of lines){ T(ln, 28, yy, 6.4, '#f4e8d0'); yy += 8; }
    yy += 3;
    c.choice.forEach((opt,i)=>{
      if (i===DLG.sel){ R(26, yy-1, 268, 10, 'rgba(242,182,50,0.22)'); T('▶', 29, yy, 6.4, '#f2b632'); }
      T(opt, 40, yy, 6.4, i===DLG.sel?'#ffd964':'#cfc0a8');
      yy += 11;
    });
    return;
  }
  if (!DLG.line) return;
  const e = DLG.line;
  const hasPort = !!e.port;
  const tx = hasPort ? 66 : 36;
  const twMax = hasPort ? 240 : 268;
  box(8, 130, 304, 44);
  if (hasPort) drawPortrait(14, 136, e.port);
  if (e.who){
    R(hasPort?42:12, 124, textW(e.who,6)+8, 11, '#a03428');
    T(e.who, (hasPort?46:16), 126, 6, '#ffe9b0');
  }
  const shown = e.text.slice(0, Math.floor(DLG.chars));
  const lines = wrap(shown, twMax, 6.4);
  let yy = 138;
  for (let i=0;i<Math.min(lines.length,4);i++){ T(lines[i], tx, yy, 6.4, '#f4e8d0'); yy += 9; }
  if (DLG.chars >= e.text.length && Math.sin(G.time*6)>0){
    T('▼', 300, 164, 6, '#f2b632');
  }
}

const PALS = {

      water1:'#4a7ab2', water2:'#5c8cc4', hill:'#c2ba92', reed:'#b8ae86' },
  2:{ ground:'#6fae4e', speck:'#5f9c42', snow:null,      path:'#c8a878', pstone:'#a8a49a',

  3:{ ground:'#b08a52', speck:'#9c7844', snow:null,      path:'#c09c6a', pstone:'#a89a88',
      water1:'#2a4a7a', water2:'#3a5e94', hill:'#bc9660', reed:'#9c7844' },
};
function drawTiles(cam, camY){
  const pal = PALS[clamp(G.ch,1,3)] || PALS[1];
  const x0 = Math.floor(cam/TILE), x1 = Math.min(MAPW-1, Math.ceil((cam+LW)/TILE));
  const y0 = Math.floor(camY/TILE), y1 = Math.min(MAPH-1, Math.ceil((camY+LH)/TILE));
  for (let ty=y0; ty<=y1; ty++){
    for (let tx=x0; tx<=x1; tx++){
      const c = map[ty][tx];
      const sx = tx*TILE-cam, sy = ty*TILE-camY;
      const h = thash(tx,ty);
      if (c==='G' || c==='R'){
        R(sx,sy,TILE,TILE, pal.ground);
        if (h<0.35) R(sx+((h*40)%12), sy+((h*90)%12), 2, 2, pal.speck);
        if (G.ch===1 && h>0.62) R(sx+((h*70)%10), sy+((h*50)%10), 4, 3, pal.snow);
        if (c==='R'){
          R(sx+3, sy+6, 1.4, 10, '#7a9a4e'); R(sx+9, sy+4, 1.4, 12, '#8aa85a');
          R(sx+13, sy+8, 1.4, 8, '#7a9a4e');
        }
      } else if (c==='P'){
        R(sx,sy,TILE,TILE, pal.path);
        if (h<0.3) R(sx+((h*40)%12), sy+((h*90)%12), 2.4, 2, 'rgba(0,0,0,0.08)');
      } else if (c==='S'){
        R(sx,sy,TILE,TILE, pal.pstone);
        R(sx,sy,TILE,1,'rgba(0,0,0,0.12)'); R(sx,sy,1,TILE,'rgba(0,0,0,0.12)');
        R(sx+8,sy+8,1,8,'rgba(0,0,0,0.08)'); R(sx+8,sy+8,8,1,'rgba(0,0,0,0.08)');
      } else if (c==='W'){
        R(sx,sy,TILE,TILE, pal.water1);
        const wv = Math.sin(G.time*1.4 + tx*0.9 + ty*1.7);
        if (wv>0.2) R(sx+2, sy+5+wv*2, 9, 1.4, pal.water2);
        if (h<0.12 && Math.sin(G.time*2.5+h*40)>0.6) R(sx+7, sy+9, 2, 1.4, '#cfe4f4');
      } else if (c==='D'){
        R(sx,sy,TILE,TILE, '#8a6844');
        R(sx,sy,TILE,1.4,'#6a4c30'); R(sx,sy+8,TILE,1.4,'#6a4c30');
        R(sx+((tx%2)*8), sy, 1.4, TILE, '#6a4c30');
      } else if (c==='H'){
        R(sx,sy,TILE,TILE, pal.hill);
        if (h<0.3) R(sx+((h*40)%12), sy+((h*90)%12), 2, 2, pal.speck);
        if (map[ty][tx-1] && map[ty][tx-1]!=='H') R(sx,sy,2,TILE,'rgba(90,70,40,0.35)');
        if (map[ty+1] && map[ty+1][tx]!=='H') R(sx,sy+TILE-2,TILE,2,'rgba(90,70,40,0.35)');
      }
    }
  }
}

/* ---------- collision ---------- */
function tileAt(x,y){
  const tx = Math.floor(x/TILE), ty = Math.floor(y/TILE);
  if (tx<0||tx>=MAPW||ty<0||ty>=MAPH) return 'X';
  return map[ty][tx];
}
function blockedAt(x,y){
  // feet box
  for (const [ox,oy] of [[-4,-1],[4,-1],[-4,-4],[4,-4]]){
    const t = tileAt(x+ox, y+oy);
    if (t==='X' || t==='W') return true;
  }
  for (const r of SOLIDS){
    if (x+4>r[0] && x-4<r[0]+r[2] && y>r[1] && y-5<r[1]+r[3]) return true;
  }
  return false;
}

/* ---------- world scene ---------- */
const world = {
  px:470, py:150, dir:'down', walking:false,
  lx:450, ly:140,             // Lóng position
  cam:0, camY:0,
  ambT:0,
  enter(){
    playMusic(clamp(G.ch,0,3));
  },
  update(dt){
    updateFade(dt);
    updateParts(dt);
    if (toast) {} // toast timing handled in render
    if (DLG.active){ dlgUpdate(dt); this.followLong(dt); return; }
    if (just.journal){ pushScene(makeJournal()); return; }
    // movement
    let vx=0, vy=0;
    if (keys.left) vx=-1; else if (keys.right) vx=1;
    if (keys.up) vy=-1; else if (keys.down) vy=1;
    this.walking = !!(vx||vy);
    if (vx&&vy){ vx*=0.707; vy*=0.707; }
    if (vx<0) this.dir='left'; else if (vx>0) this.dir='right';
    else if (vy<0) this.dir='up'; else if (vy>0) this.dir='down';
    const sp = 62;
    const nx = clamp(this.px + vx*sp*dt, 8, MAPW*TILE-8);
    const ny = clamp(this.py + vy*sp*dt, 26, MAPH*TILE-4);
    if (!blockedAt(nx, this.py)) this.px = nx;
    if (!blockedAt(this.px, ny)) this.py = ny;
    this.followLong(dt);
    // ambience
    this.ambT -= dt;
    if (this.ambT<=0){
      this.ambT = G.ch===1?0.09 : G.ch===3?0.25 : 0.2;
      if (G.ch===1) spawnPart({x:this.cam+rnd(LW), y:this.camY-4, vx:rnd(-6,6), vy:rnd(14,26), g:0, life:rnd(4,7), t:0, c:'#f4f6f4', sz:rnd(1,2)});
      if (G.ch===2) spawnPart({x:this.cam+rnd(LW), y:this.camY-4, vx:rnd(-14,4), vy:rnd(10,20), g:0, life:rnd(4,7), t:0, c:pick(['#8fd47a','#f2c2d0']), sz:rnd(1,1.8)});
      if (G.ch===3) spawnPart({x:this.cam+rnd(LW), y:this.camY+rnd(LH), vx:rnd(-4,4), vy:rnd(-6,2), g:0, life:rnd(1.5,3), t:0, c:'#ffe98a', sz:1.4});
    }
    // interact
    const it = this.nearInteract();
    if (it && just.a){ SFX.select(); it.talk(); }
    chapterTick(dt);
  },
  followLong(dt){
    let tx2, ty2;
    if (typeof longWaiting==='function' && longWaiting()){
      tx2 = 480; ty2 = 186;   // waits by the treasure pedestal
    } else {
      const behind = this.dir==='left'? 24 : this.dir==='right'? -24 : (this.px>this.lx?-24:24);
      tx2 = this.px + behind; ty2 = this.py - 18;
    }
    this.lx = lerp(this.lx, tx2, clamp(dt*3,0,1));
    this.ly = lerp(this.ly, ty2, clamp(dt*3,0,1));
  },
  nearInteract(){
    let best=null, bd=1e9;
    for (const it of getInteractables()){
      const d = dist(this.px, this.py, it.x, it.y);
      if (d > (it.r||26)) continue;
      const ad = d + (it.depri||0);   // Lóng yields to villagers standing nearby
      if (ad < bd){ bd=ad; best=it; }
    }
    return best;
  },
  render(){
    const ch = clamp(G.ch,1,3);
    this.cam  = clamp(this.px - LW/2, 0, MAPW*TILE-LW);
    this.camY = clamp(this.py - LH/2, 0, MAPH*TILE-LH);
    const cam=this.cam, camY=this.camY;
    drawTiles(cam, camY);
    const lights = [];
    // drawable list sorted by baseline y
    const items = [];
    for (const h of HOUSES) items.push({y:h.y+h.ht, f:()=>{
      const dec = houseDecor(h);
      drawHouse({...h, x:h.x-cam, y:h.y-camY}, dec);
      if (dec.lanterns && dec.lit){ lights.push({x:h.x+4-cam, y:h.y+8-camY, r:14}); lights.push({x:h.x+h.w-4-cam, y:h.y+8-camY, r:14}); }
    }});
    for (const t of TREES) items.push({y:t[1], f:()=> drawTree(t[0]-cam, t[1]-camY, t[2], ch)});
    items.push({y:WELL.y, f:()=> drawWell(WELL.x-cam, WELL.y-camY)});
    items.push({y:SHRINE.y, f:()=> drawShrine(SHRINE.x-cam, SHRINE.y-camY)});
    items.push({y:PAVILION.y, f:()=> drawPavilion(PAVILION.x-cam, PAVILION.y-camY)});
    // treasure pedestal in the plaza
    items.push({y:206, f:()=> drawPedestal(480-cam, 206-camY)});
    // chapter extras
    chapterScenery(items, cam, camY, lights);
    // NPCs
    for (const id in NPCS){
      const n = NPCS[id], p = npcPos(id);
      if (!p) continue;
      items.push({y:p[1], f:()=>{
        const look = {...n.look, dir:p[2]||'down', walk:false};
        drawPerson(p[0]-cam, p[1]-camY, look, G.time);
      }});
    }
    // player
    items.push({y:this.py, f:()=>{
      drawPerson(this.px-cam, this.py-camY, {...playerLook(), dir:this.dir, walk:this.walking}, G.time);
    }});
    // Lóng
    items.push({y:this.ly+30, f:()=> drawLong(this.lx-cam, this.ly-camY, G.time, this.lx>this.px, 1)});
    items.sort((a,b)=>a.y-b.y);
    for (const it of items) it.f();
    drawParts(cam, camY);

function drawArrow(x, y, dir, s, color){
  cx.fillStyle = color; cx.beginPath();
  const a = {up:[[0,-1],[0.9,0.5],[-0.9,0.5]], down:[[0,1],[0.9,-0.5],[-0.9,-0.5]],
             left:[[-1,0],[0.5,0.9],[0.5,-0.9]], right:[[1,0],[-0.5,0.9],[-0.5,-0.9]]}[dir];
  cx.moveTo((x+a[0][0]*s)*P, (y+a[0][1]*s)*P);
  cx.lineTo((x+a[1][0]*s)*P, (y+a[1][1]*s)*P);
  cx.lineTo((x+a[2][0]*s)*P, (y+a[2][1]*s)*P);
  cx.closePath(); cx.fill();
}

/* ---------- SEQUENCE (dumplings, zongzi) ---------- */
function makeSequence(cfg, onDone){
  const dirs = ['up','down','left','right'];
  let round = 0, seq = [], idx = 0, flash = 0, doneT = 0, state = 'play';
  function roll(){ seq = []; for(let i=0;i<cfg.lens[round];i++) seq.push(pick(dirs)); idx = 0; }
  roll();
  return {
    update(dt){
      flash = Math.max(0, flash-dt);
      updateParts(dt);
      if (state==='alldone'){
        doneT += dt;
        if (just.a && doneT>0.6){ popScene(); onDone(); }
        return;
      }
      if (state==='rounddone'){
        doneT += dt;
        if (doneT > 0.9){ state='play'; roll(); }
        return;
      }
      for (const d of dirs){
        if (just[d]){
          if (d === seq[idx]){ idx++; SFX.blip();
            if (idx >= seq.length){
              round++;
              SFX.good();
              burst(160, 84, ['#f2b632','#ffe98a','#f6ecd8'], 18, 40);
              if (round >= cfg.lens.length){ state='alldone'; doneT=0; SFX.win(); }
              else { state='rounddone'; doneT=0; }
            }
          } else { flash = 0.35; idx = 0; SFX.bad(); }
          break;
        }
      }
    },
    render(){
      kitchenBG();
      drawParts(0,0);
      mgHeader(cfg.title, cfg.flavor);
      if (flash>0){ cx.globalAlpha=flash; R(0,0,LW,LH,'#a02818'); cx.globalAlpha=1; }
      // the food takes shape
      const cxx=160, cyy=88;
      if (cfg.icon==='dumpling'){
        if (round===0) circle(cxx,cyy,10,'#f6ecd8');
        else if (round===1){ circle(cxx,cyy,10,'#f6ecd8'); circle(cxx,cyy-2,4,'#c88a5a'); }
        else drawDumpling(cxx,cyy,2.2);
      } else {
        if (round===0){ R(cxx-12,cyy-8,24,16,'#3e8b4e'); }
        else if (round===1){ R(cxx-12,cyy-8,24,16,'#3e8b4e'); R(cxx-6,cyy-4,12,8,'#f6ecd8'); }
        else drawZongzi(cxx,cyy,2.2);
      }
      if (state==='alldone'){
        box(40,60,240,46);
        T('PERFECT!', LW/2, 68, 9, '#f2b632','center');
        T(cfg.doneLine, LW/2, 82, 6, '#f4e8d0','center');
        T('✓ to continue', LW/2, 94, 5.4, '#cfc0a8','center');
        return;
      }
      T('Batch '+(round+1)+' of '+cfg.lens.length+' — '+cfg.steps[round], LW/2, 34, 6, '#ffe9b0', 'center');
      // arrow row
      const n = seq.length, w = n*26, x0 = LW/2 - w/2 + 13;
      for (let i=0;i<n;i++){
        const ax = x0 + i*26;
        R(ax-11, 119, 22, 22, i<idx ? 'rgba(242,182,50,0.25)' : 'rgba(20,12,16,0.7)');
        R(ax-11, 119, 22, 1.4, '#c8a860'); R(ax-11, 140, 22, 1.4, '#c8a860');
        R(ax-11, 119, 1.4, 22, '#c8a860'); R(ax+9.6, 119, 1.4, 22, '#c8a860');
        drawArrow(ax, 130, seq[i], 7, i<idx ? '#f2b632' : i===idx ? '#ffffff' : '#8a7a68');
        if (i===idx && Math.sin(G.time*7)>0) drawArrow(ax, 130, seq[i], 7, '#ffe98a');
      }
      T('Press the arrows in order!', LW/2, 152, 5.4, '#cfc0a8', 'center');
      T('(wrong press just restarts the batch)', LW/2, 161, 4.8, '#9a8c78', 'center');
    }
  };
}

/* ---------- TIMING (firecrackers vs Nian, mooncake press) ---------- */
function makeTiming(cfg, onDone){
  let round = 0, t = 0, state = 'play', msg = '', msgT = 0, doneT = 0;
  const speeds = cfg.speeds || [2.2, 2.8, 3.4];
  const zones  = cfg.zones  || [30, 24, 18];
  return {
    update(dt){
      t += dt; msgT = Math.max(0, msgT-dt);
      updateParts(dt);
      if (state==='done'){
        doneT += dt;
        if (just.a && doneT>0.6){ popScene(); onDone(); }
        return;
      }
      if (just.a){
        const pos = Math.sin(t*speeds[round])*100;   // -100..100
        if (Math.abs(pos) < zones[round]/2){
          round++;
          if (cfg.onHit) cfg.onHit(round);
          burst(160+pos*0.9, 118, ['#ff5838','#f2b632','#ffe98a'], 24, 60);
          if (round >= speeds.length){ state='done'; doneT=0; SFX.win(); }
          else { msg = pick(['GREAT!','NICE!','PERFECT!']); msgT = 0.8; }

          msg = 'Missed! again…'; msgT = 0.8; SFX.bad();
        }
      }
    },
    render(){
      cfg.drawScene(round, t, state==='done');
      drawParts(0,0);
      mgHeader(cfg.title, cfg.flavor);
      if (state==='done'){
        box(40,58,240,46);
        T(cfg.doneTitle||'DONE!', LW/2, 66, 9, '#f2b632','center');

        return;
      }
      T(cfg.roundLabels[round], LW/2, 34, 6, '#ffe9b0','center');
      // the bar
      const pos = Math.sin(t*speeds[round])*100;
      R(52, 112, 216, 12, 'rgba(20,12,16,0.8)');

      R(160-zw/2, 112, 1.4, 12, '#ffe98a'); R(160+zw/2, 112, 1.4, 12, '#ffe98a');
      R(160 + pos*1.08 - 1.5, 108, 3, 20, '#ffffff');
      T('Press ✓ when the slider is in the RED zone!', LW/2, 130, 5.4, '#cfc0a8','center');

      T('Round '+(round+1)+' / '+speeds.length, LW/2, 141, 5, '#9a8c78','center');
    }
  };
}

/* ---------- RHYTHM (dragon boat race) ---------- */
function makeRhythm(onDone){
  const GOAL = 100, BPM = 104, BEAT = 60/BPM;
  let me = 0, rival = 0, t = 0, lastSide = 'right', beatT = 0, beatN = 0;
  let msg='', msgT=0, state='race', doneT=0, scroll=0;
  function stroke(side){
    if (state!=='race') return;
    const near = Math.min(beatT, BEAT-beatT);
    if (side === lastSide){ msg='Alternate ◀ ▶!'; msgT=0.6; me += 0.15; SFX.bad(); return; }
    lastSide = side;
    if (near < BEAT*0.3){ me += 2.6; msg=pick(['STROKE!','GO GO!','ON BEAT!']); msgT=0.4; SFX.drum(); }
    else { me += 1.1; msg='off-beat… feel the drum'; msgT=0.5; noiseHit(0.06,0.15); }
    burst(70+me*1.7, 128, ['#cfe4f4','#ffffff'], 6, 30);
  }
  return {
    update(dt){
      t += dt; msgT = Math.max(0,msgT-dt);
      updateParts(dt);
      if (state!=='race'){
        doneT += dt;
        if (just.a && doneT>0.6){
          if (state==='win'){ popScene(); onDone(); }
          else { me=0; rival=0; state='race'; msg=''; lastSide='right'; }
        }
        return;
      }
      beatT += dt;
      if (beatT >= BEAT){ beatT -= BEAT; beatN++; SFX.drum(); }
      rival += dt * 6.2;
      if (just.left) stroke('left');
      if (just.right) stroke('right');
      scroll += dt * (14 + me*0.1);
      if (me >= GOAL){ state='win'; doneT=0; SFX.win(); burst(240,80,['#f2b632','#ff5838','#7ce87c','#cfe4f4'],40,80); }
      else if (rival >= GOAL){ state='lose'; doneT=0; SFX.bad(); }
    },
    render(){
      // river scene
      R(0,0,LW,52,'#bfe0f0');
      R(0,30,LW,8,'#a8d0e4');
      // far bank
      R(0,44,LW,14,'#6fae4e');
      for(let i=0;i<7;i++){ const bx=(i*60 - (scroll*0.5)%60); drawTree(bx, 56, i%2?'round':'pine', 2); }
      R(0,58,LW,122,'#3a7ab2');
      for(let i=0;i<40;i++){
        const wx = (i*23 - (scroll*1.4)%23), wy = 66 + (i%7)*16;
        cx.globalAlpha=0.5; R(wx, wy + Math.sin(G.time*2+i)*1.5, 12, 1.6, '#5c94c8'); cx.globalAlpha=1;
      }
      // crowd on near bank
      R(0,168,LW,12,'#6fae4e');
      // rival boat (top lane) & player boat
      drawBoat(40 + rival*2.2, 92, G.time, {crew:true, seed:3, fast:false});
      drawBoat(40 + me*2.2, 132, G.time, {crew:true, seed:1, fast:true});
      T('YOU', 40+me*2.2-30, 124, 5.4, '#ffe9b0');
      // finish line
      const fx = 40 + GOAL*2.2 + 14;
      for(let i=0;i<14;i++) R(fx, 62+i*8, 3, 5, i%2?'#f2b632':'#e03c28');
      drawParts(0,0);
      mgHeader('DRAGON BOAT RACE', 'Paddle ◀ ▶ alternating — on the DRUM beat!');
      // drum pulse
      const pu = 1 - clamp(beatT/BEAT,0,1);
      drawDrum(24, 174, 1 + pu*0.35);
      glow(24, 168, 10+pu*8, '#f2b632', 0.25*pu);
      if (msgT>0) T(msg, LW/2, 40, 6.6, msg[0]==='S'||msg[0]==='G'||msg[0]==='O'?'#7ce87c':'#ffd0a0', 'center');
      if (state==='win'){
        box(46,58,228,50);
        T('YOU WIN THE RACE!', LW/2, 66, 8.4, '#f2b632','center');
        T('The drums thunder like they did for Qu Yuan.', LW/2, 80, 5.6, '#f4e8d0','center');
        T('✓ to continue', LW/2, 94, 5.4, '#cfc0a8','center');
      } else if (state==='lose'){
        box(46,58,228,50);
        T('SO CLOSE!', LW/2, 66, 8.4, '#ff8a70','center');
        T('Stay with the drumbeat — alternate ◀ ▶.', LW/2, 80, 5.6, '#f4e8d0','center');
        T('✓ to race again', LW/2, 94, 5.4, '#cfc0a8','center');
      }
    }
  };
}

/* ---------- QUIZ / RIDDLES ---------- */
function makeQuiz(questions, opts, onDone){
  let idx = 0, sel = 0, state = 'ask', msgT = 0, lanternsUp = [];
  return {
    update(dt){
      msgT += dt;
      if (state==='ask'){
        const n = questions[idx].a.length;
        if (just.up){ sel=(sel+n-1)%n; SFX.blip(); }
        if (just.down){ sel=(sel+1)%n; SFX.blip(); }
        if (just.a){
          if (sel === questions[idx].correct){
            state='right'; msgT=0; SFX.good();
            if (opts.lanterns) lanternsUp.push({x:rnd(40,280), y:190, s:rnd(0.7,1.1)});
          } else { state='wrong'; msgT=0; SFX.bad(); }
        }
      } else if (just.a && msgT>0.4){
        if (state==='right'){
          idx++; sel=0;
          if (idx >= questions.length){ popScene(); onDone(); return; }
          state='ask';
        } else state='ask';
      }
      for (const L of lanternsUp){ L.y -= dt*9; }
    },
    render(){
      // night sky
      R(0,0,LW,LH,'#141830');
      for(let i=0;i<40;i++){ const h=thash(i,7); if (Math.sin(G.time*2+i)>-0.4) R(h*LW, (thash(i,13))*100, 1.4, 1.4, '#e8e4f4'); }
      if (opts.moon) drawMoon(276, 34, 16, 0);
      for (const L of lanternsUp){ drawLantern(L.x, L.y + Math.sin(G.time+L.x)*2, L.s, true, G.time); }
      R(0,164,LW,16,'#1c2618');
      mgHeader(opts.title, opts.sub);
      const q = questions[idx];
      const ql = wrap(q.q, 264, 6.4);
      box(24, 38, 272, ql.length*9+8);
      let yy=42; for (const ln of ql){ T(ln, LW/2, yy, 6.4, '#f4e8d0','center'); yy+=9; }
      yy += 8;
      q.a.forEach((opt,i)=>{
        const w = textW(opt,6.4)+26;
        const bx = LW/2-w/2;
        box(bx, yy, w, 13, {border: i===sel?'#f2b632':'#6a5a48', bg: i===sel?'rgba(60,36,20,0.95)':'rgba(20,12,16,0.85)'});
        if (i===sel) T('▶', bx+6, yy+2.6, 6, '#f2b632');
        T(opt, LW/2+6, yy+2.6, 6.4, i===sel?'#ffe9b0':'#cfc0a8','center');
        yy += 17;
      });
      if (state==='right'){
        box(30, 128, 260, 26, {border:'#7ce87c'});
        const yl = wrap(q.yay, 246, 5.8);
        let y2=132; for (const ln of yl){ T(ln, LW/2, y2, 5.8, '#c8f4c0','center'); y2+=8; }
        T('✓', 282, 146, 5.4, '#7ce87c');
      } else if (state==='wrong'){
        box(60, 128, 200, 18, {border:'#ff8a70'});
        T('Hmm, not quite — try again!', LW/2, 133, 6, '#ffd0c0','center');
      } else {
        T('▲▼ choose · ✓ answer', LW/2, 156, 5, '#9a8c78','center');
      }
      T((idx+1)+' / '+questions.length, 300, 168, 5.4, '#9a8c78','center');
    }
  };
}

/* ---------- journal & sources ---------- */
function makeJournal(){
  let sel=0, mode='list', page=0;
  const entries = SCROLL_ORDER.map(id=>({id, got:G.scrolls.includes(id)}));
  return {
    overlay:true,
    update(dt){
      if (mode==='read'){
        if (just.a || just.b){ mode='list'; SFX.back(); }
        return;
      }
      if (mode==='sources'){
        if (just.a || just.b){ mode='list'; SFX.back(); }
        return;
      }
      const n = entries.length+1;
      if (just.up){ sel=(sel+n-1)%n; SFX.blip(); }
      if (just.down){ sel=(sel+1)%n; SFX.blip(); }
      if (just.a){
        if (sel===entries.length){ mode='sources'; SFX.select(); }
        else if (entries[sel].got){ mode='read'; SFX.select(); }
        else SFX.bad();
      }
      if (just.b || just.journal){ popScene(); SFX.back(); }
    },
    render(){
      cx.fillStyle='rgba(8,6,12,0.88)'; cx.fillRect(0,0,LW*P,LH*P);
      if (mode==='read'){
        const s = SCROLLS[entries[sel].id];
        box(30, 20, 260, 140, {border:'#c8a860', bg:'#f0e4c8'});
        drawScrollItem(50, 42, G.time);
        T(s.title, 64, 28, 7.4, '#7a2418');
        R(40, 44, 240, 1, '#a03428');
        const lines = wrap(s.text, 236, 6);
        let yy=52; for (const ln of lines){ T(ln, 42, yy, 6, '#3a2418'); yy+=9; }
        T('✓ back', 276, 150, 5, '#8a6a48','right');
        return;
      }
      if (mode==='sources'){
        box(20, 14, 280, 152, {border:'#c8a860'});
        T('RESEARCH SOURCES', LW/2, 20, 8, '#f2b632','center');
        T('Every fact in this game came from real research:', LW/2, 33, 5.4, '#cfc0a8','center');
        let yy=46;
        SOURCES_LIST.forEach(s=>{
          T('• '+s[0], 30, yy, 5.4, '#f4e8d0'); yy+=8;
          T('   '+s[1]+' — '+s[2], 30, yy, 5, '#b8a88e'); yy+=11;
        });
        T('Full citations: see the Works Cited page', LW/2, 148, 5.2, '#cfc0a8','center');
        T('✓ back', 288, 158, 5, '#8a6a48','right');
        return;
      }
      box(16, 10, 288, 160, {border:'#c8a860'});
      T('WISDOM SCROLL JOURNAL', LW/2, 15, 8, '#f2b632','center');
      T(G.scrolls.length+' of '+SCROLL_ORDER.length+' collected', LW/2, 27, 5.4, '#cfc0a8','center');
      const perCol = 9, colW = 140;
      const visible = entries.length+1;
      for (let i=0;i<visible;i++){
        const col = Math.floor(i/perCol), row = i%perCol;
        const x = 26+col*colW, y = 40+row*13;
        const isSrc = i===entries.length;
        const label = isSrc ? '★ RESEARCH SOURCES' : (entries[i].got ? SCROLLS[entries[i].id].title : '? ? ?');
        if (i===sel){ R(x-3, y-1.5, colW-8, 12, 'rgba(242,182,50,0.2)'); T('▶', x-1, y, 5.4, '#f2b632'); }
        T(label, x+8, y, 5.4, isSrc ? '#ffd964' : entries[i].got ? '#f4e8d0' : '#6a5c50');
      }
      T('▲▼ pick · ✓ read · ✕ close', LW/2, 162, 5, '#8a7c6a','center');
    }
  };
}

const CC_PANTS = { '#e03c28':'#3a4a8a', '#3a5ab0':'#2a2a3a', '#e8b028':'#3a4a8a', '#3e8b4e':'#3a3a2a', '#8a4a9a':'#3a2a45' };
const CC_ROWS = ['hairstyle','hair','skin','top','extra','start'];

const creatorScene = {
  sel:0, idx:{hairstyle:0, hair:0, skin:0, top:0, extra:0}, t:0,
  enter(){ this.t=0; },
  look(){
    const v = k => CC_OPTS[k].vals[this.idx[k]];
    const extra = v('extra');
    return {
      skin:v('skin'), hair:v('hair'), top:v('top'), pants:CC_PANTS[v('top')],
      hairstyle:v('hairstyle'),
      band: extra==='band', blush: extra==='blush', glasses: extra==='glasses',
    };
  },
  cycle(key, delta){
    const n = CC_OPTS[key].vals.length;
    this.idx[key] = (this.idx[key] + delta + n) % n;
    SFX.blip();
  },
  finish(){
    G.look = this.look();
    SFX.win();
    burst(56, 90, ['#f2b632','#ffe98a','#e03c28'], 30, 60);
    fadeOut(()=>{ swapScene(homeScene); homeScene.mode='intro'; fadeIn(); });
  },
  update(dt){
    this.t += dt; updateFade(dt); updateParts(dt);
    if (just.up){ this.sel = (this.sel+CC_ROWS.length-1)%CC_ROWS.length; SFX.blip(); }
    if (just.down){ this.sel = (this.sel+1)%CC_ROWS.length; SFX.blip(); }
    const row = CC_ROWS[this.sel];
    if (row!=='start'){
      if (just.left) this.cycle(row,-1);
      if (just.right) this.cycle(row,1);
      if (just.a && !tapPos) this.cycle(row,1);
    } else if (just.a && !tapPos){ this.finish(); return; }
    // touch: tap a row to cycle it, tap START to go
    if (tapPos){
      for (let i=0;i<CC_ROWS.length;i++){
        const y = 34+i*22;
        if (tapPos.y>y-4 && tapPos.y<y+16 && tapPos.x>100){
          this.sel = i;
          if (CC_ROWS[i]==='start') this.finish();
          else this.cycle(CC_ROWS[i], 1);
          break;
        }
      }
    }
  },
  render(){
    R(0,0,LW,LH,'#141026');
    for(let i=0;i<50;i++){ R(thash(i,5)*LW, thash(i,11)*LH, 1, 1, 'rgba(232,228,244,0.45)'); }
    R(0,0,LW,18,'rgba(20,12,16,0.9)'); R(0,17,LW,1,'#f2b632');
    T('CREATE YOUR HERO', LW/2, 4, 8, '#f2b632','center');
    // preview card — the hero turns and walks in place
    box(14, 28, 84, 128, {bg:'rgba(28,20,40,0.85)'});
    const dirs = ['down','left','up','right'];
    const dir = dirs[Math.floor(this.t/1.3)%4];
    const lk = {...this.look(), dir, walk:true};
    drawPersonZoomed(56, 132, lk, this.t, 4);
    T(G.name, 56, 142, 6.4, '#ffe9b0','center');
    drawParts(0,0);
    // option rows
    for (let i=0;i<CC_ROWS.length;i++){
      const key = CC_ROWS[i], y = 34+i*22, on = i===this.sel;
      if (key==='start'){
        const w = 96;
        box(180-w/2+26, y-2, w, 15, {border: on?'#f2b632':'#6a5a48', bg: on?'rgba(90,40,20,0.9)':'rgba(20,12,16,0.85)'});
        T('✦ START! ✦', 206, y+1, 7, on?'#ffe9b0':'#b8a88e','center');
        continue;
      }
      const o = CC_OPTS[key];
      T(o.label, 106, y, 5.2, on?'#f2b632':'#8a7c6a');
      if (on){ T('◀', 158, y+1, 6, '#f2b632'); T('▶', 298, y+1, 6, '#f2b632','right'); }
      if (o.swatch){
        const v = o.vals[this.idx[key]];
        R(170, y-1, 11, 11, '#2b1a26'); R(171, y, 9, 9, v);
        T(o.names[this.idx[key]], 188, y+1, 6, on?'#ffe9b0':'#cfc0a8');
      } else {
        T(o.names[this.idx[key]], 170, y+1, 6.4, on?'#ffe9b0':'#cfc0a8');
      }
    }
    T('▲▼ pick a row · ◀▶ change it · then START!', LW/2, 166, 5.2, '#9a8c78','center');
    drawFade();
  }
};
/* draw a chibi at an integer zoom, anchored at feet center */
function drawPersonZoomed(x, y, o, t, z){
  const dir = o.dir||'down';
  let frame = 0;
  if (o.walk){ const ph = Math.floor(t*6)%2; frame = ph; }
  const spr = chibiSprite(o, dir, frame);
  cx.fillStyle='rgba(20,8,16,0.3)';
  cx.fillRect((x-6*z)*P, (y-2)*P, 12*z*P, 3*P);
  cx.imageSmoothingEnabled = false;
  cx.drawImage(spr, (x-8*z)*P, (y-20*z)*P, 16*z*P, 20*z*P);
}

  }

  if (G.ch===1 && G.step===0 && !G.flags.ch1intro){
    G.flags.ch1intro = true;

    G.flags.ch2intro = true;
    say([
      {who:'Lóng', port:LONG_PORTRAIT, text:"Feel that heat? The seasons spin fast here. It's the FIFTH day of the FIFTH month — the DRAGON BOAT FESTIVAL!"},
      {who:'Lóng', port:LONG_PORTRAIT, text:"…But listen. No drums. A race with no thunder is just rowing. Find Captain Yu at the dock, south side."},

  if (G.ch===3 && G.step===0 && !G.flags.ch3intro){
    G.flags.ch3intro = true;
    say([
      {who:'Lóng', port:LONG_PORTRAIT, text:"Autumn dusk already. Eighth month, fifteenth day — MID-AUTUMN. The moon should be blinding tonight…"},
      {who:'Lóng', port:LONG_PORTRAIT, text:"…but look at her. Veiled and gray. Mei is waiting for you on the dock. Go — she shouldn't wait alone."},
    ]);
  }
  if (G.ch===3 && G.step===3 && !G.flags.feastGo){
    let all = true;
    for (let i=0;i<POLES.length;i++) if (!G.flags['pole'+i]) all = false;

        const spots = [[468,198],[448,232],[500,198],[524,232],[438,216],[540,216],[488,236],[452,216]];

      ], ()=> setStep(4));

/* ---------- the Nian battle (timing minigame with a big scene) ---------- */
function makeNianBattle(){
  let fledT = -1;
  const cfg = {
    title:'NIAN AT THE GATES', flavor:'Red! Light! Noise!',
    roundLabels:['Unfurl the RED banners!','Light EVERY lantern!','FIRECRACKERS! NOW!'],
    speeds:[2.0,2.6,3.2], zones:[34,26,20],
    doneTitle:'GUO NIAN!', doneLine:'The beast flees! You have "passed over" the year!',
    onHit(r){ SFX.boom(); if (r>=3) SFX.win(); },
    drawScene(progress, t, done){
      R(0,0,LW,LH,'#10102a');
      for(let i=0;i<30;i++){ const h=thash(i,5); R(h*LW, thash(i,11)*60, 1.2, 1.2, '#8a8ab4'); }
      R(0,150,LW,30,'#1c1830');
      // tea house backdrop (kept high so the timing bar stays clear)
      drawHouse({x:110,y:58,w:78,ht:34,door:32,sign:'TEA HOUSE'},
        {couplets:progress>=1, fu:progress>=1, lanterns:true, lit:progress>=2});
      if (progress>=1){ R(98,62,6,28,'#d43424'); R(216,62,6,28,'#d43424'); }
      if (progress>=2){ drawLantern(56,52,1.2,true,t); drawLantern(264,52,1.2,true,t+1);
        glow(56,62,16,'#ffaa50',0.3); glow(264,62,16,'#ffaa50',0.3); }
      // villagers huddle right
      drawPerson(268,148,{...port('elder'), dir:'left'},t);
      drawPerson(288,152,{...port('mei'), dir:'left'},t);
      drawPerson(300,146,{...port('hua'), dir:'left'},t);
      // you, standing your ground
      drawPerson(240,152,{...playerLook(), dir:'left'},t);
      // NIAN
      if (done){
        if (fledT<0) fledT = t;
        const fx = 60 - (t-fledT)*90;
        if (fx > -80) drawNian(fx, 150, t*3);
        if (Math.random()<0.1) burst(rnd(60,260), rnd(40,100), ['#ff5838','#f2b632','#7ce87c','#cfe4f4'], 16, 60);
      } else {
        const shake = progress>0 ? Math.sin(t*30)*progress : 0;
        drawNian(64 - progress*16 + shake, 150, t);
        T('GRRRRRAAAAAH!', 70, 96, 6, '#ff5030');
      }
      drawParts(0,0);
    }
  };
  const scene = makeTiming(cfg, ()=>{
    say([
      {who:'Elder Shan', port:port('elder'), text:"GUO NIAN! WE HAVE PASSED THE YEAR! Ha-HA! Did you SEE it run?!"},
      {who:'Lóng', port:LONG_PORTRAIT, text:"It won't dare come back for a whole year. And when it does — we'll be ready. We always are. THAT is why the New Year is loud and red."},
      {who:'Elder Shan', port:port('elder'), text:"Find me at the tea house, child. Dawn brings one more tradition — the sweetest one of all."},
    ], ()=> setStep(6));
  });
  return scene;
}

    if (G.ch===1 && G.step===3){
      say([
        {who:'Uncle Bo', port:B, text:"Perfect timing! Help me paste the chūnlián — spring couplets. Little poems of good wishes, one for each side of the door."},
        {who:'Uncle Bo', port:B, text:"And now the important one. The square with 福 — fú, 'good fortune.' Tell me, which way does it go?"},
        { choice:['Right side up, obviously','Upside down!'], q:'Which way should the fú go?', cb:(sel)=>{
          const first = sel===0
            ? {who:'Uncle Bo', port:B, text:"HA! That's what everyone says. Watch this—"}
            : {who:'Uncle Bo', port:B, text:"Ohhh, someone knows the secret already!"};
          say([ first,
            {who:'Uncle Bo', port:B, text:"We paste it UPSIDE DOWN — on purpose! In Chinese, 'upside down' (dào) sounds exactly like 'to arrive' (dào)."},
            {who:'Uncle Bo', port:B, text:"So an upside-down fú shouts to the whole street: GOOD FORTUNE HAS ARRIVED! Word-play, kid. Five thousand years of dad jokes."},
          ], ()=>{ giveScroll('fu'); setStep(4); });
        }},
      ]);
    }
    else say([{who:'Uncle Bo', port:B, text: G.ch===1 ? "Look at that door. LOOK at it. Best couplets on the street." : G.ch===2 ? "My money's on Captain Yu's crew. Don't tell the other boat." : "The moon's coming back. I can feel it in my couplets."}]);
  },

  mei(){
    const M = port('mei');
    if (G.ch===1){
      if (G.step===4) say([
        {who:'Mei', port:M, text:G.name+"! You're just in time — tonight is the REUNION DINNER. The whole family cooks together. It's the best part of the whole year."},
        {who:'Mei', port:M, text:"We're making jiǎozi — dumplings! I'll teach you my grandmother's fold. Ready?"},
      ], ()=> pushScene(makeSequence(MG_DUMPLING, ()=>{
        say([
          {who:'Mei', port:M, text:"LOOK at them! Fat and golden — folded like the old gold ingots. That's the wish: a year of plenty."},
          {who:'Mei', port:M, text:"And see the whole fish on the table? 'Nián nián yǒu yú' — 'fish' sounds like 'extra,' so it means may EVERY year have extra. Food that talks!"},
        ], ()=>{ giveScroll('luckyfood'); setStep(5); });
      })));
      else say([{who:'Mei', port:M, text:"My little brother tried to eat a RAW dumpling once. Don't be my little brother."}]);
    }
    else if (G.ch===2) say([{who:'Mei', port:M, text:"I braided a five-color bracelet for the festival. Granny Zhu says the colors guard against the five poisons!"}]);
    else { // ch3
      if (G.step===0) say([
        {who:'Mei', port:M, text:"Hi, "+G.name+". …She's supposed to be beautiful tonight. Round and gold, so bright you can read by her."},
        {who:'Mei', port:M, text:"Every Mid-Autumn my whole family sits right here — mooncakes, lanterns, and the same story every year. Sit with me? I'll tell it to you."},
      ], ()=>{ setStep(1); pushScene(makeStory(changePages, ()=>{
        say([
          {who:'Mei', port:M, text:"…so when a family shares mooncakes under the full moon, Chang'e isn't lonely anymore. She sees the lights and knows we remember."},
          {who:'Mei', port:M, text:"Help me relight the night? Baker Fang first — there's no feast without mooncakes!"},
        ], ()=>{ giveScroll('change'); setStep(2); });
      })); });
      else say([{who:'Mei', port:M, text: G.step<5 ? "Moon first. Feelings later. GO!" : "Best. Mid-Autumn. EVER."}]);
    }
  },

  yu(){
    const Y = port('yu');
    if (G.ch===2){
      if (G.step===0) say([
        {who:'Captain Yu', port:Y, text:"Hmph. See my beautiful boats? Fast as dragons, carved by my own father. And today of ALL days… silent."},
        {who:'Captain Yu', port:Y, text:"My crews forgot WHY we race, so their paddles have no heart, and the great drum won't sing for us."},
        {who:'Captain Yu', port:Y, text:"Old Wen keeps the true story at the west shrine. Bring it back to me, traveler. A race without its story is just splashing."},
      ], ()=> setStep(1));
      else if (G.step===5) say([
        {who:'Captain Yu', port:Y, text:"The story's back in their eyes. The zongzi are wrapped. The herbs are hung. CREW! TO THE BOATS!"},
        {who:'Captain Yu', port:Y, text:"You — lead boat, drum position. Paddle with the beat and make it THUNDER, like the villagers did for Qu Yuan!"},
      ], ()=> pushScene(makeRhythm(()=>{
        say([
          {who:'Captain Yu', port:Y, text:"HAAAA! THAT is how you honor a poet! Twenty-three hundred years and the river still remembers his name!"},
        ], ()=> setStep(6));
      })));
      else say([{who:'Captain Yu', port:Y, text: G.step<5 ? "Story first. Race after. Captain's orders." : "Fastest crossing I've seen since my father's day."}]);
    }
    else say([{who:'Captain Yu', port:Y, text: G.ch===1 ? "Even the fish celebrate tonight. ESPECIALLY the fish — nobody's allowed to catch them on New Year's!" : "On a moonlit night you can see every ripple for a mile."}]);
  },

  wen(){
    const Wn = port('wen');
    if (G.ch===2 && G.step===1){
      say([
        {who:'Old Wen', port:Wn, text:"Sit, child. This shrine keeps the memory of a man who loved his country more than his own life."},
      ], ()=> pushScene(makeStory(quYuanPages, ()=>{
        say([
          {who:'Old Wen', port:Wn, text:"His great poem 'Li Sao' is still recited, twenty-three centuries later. 'Long, long is the road,' he wrote, 'and I will search high and low.'"},
          {who:'Old Wen', port:Wn, text:"Now the story is in YOU. Take it to the village: Granny Zhu wraps the rice, the captain races the boats. Go."},
        ], ()=>{ giveScroll('quyuan'); giveScroll('race'); setStep(2); });
      })));
    }
    else say([{who:'Old Wen', port:Wn, text: G.ch===2 ? "A poem outlives a palace. Remember that at school." : G.ch===1 ? "Even in winter I sweep this shrine. Respect keeps better than firewood." : "The moon has heard every poem ever written. Tonight she gets a new one."}]);
  },

  zhu(){
    const Z = port('zhu');
    if (G.ch===2){
      if (G.step===2) say([
        {who:'Granny Zhu', port:Z, text:"Racing is hungry work! Come, help me wrap zòngzi — sticky rice bundled in bamboo leaves. Rice armor!"},
        {who:'Granny Zhu', port:Z, text:"Just like the rice the villagers threw to keep the fish away from Qu Yuan. Fold, pack, tie. Show me your hands. Hm. They'll do."},
      ], ()=> pushScene(makeSequence(MG_ZONGZI, ()=>{
        say([
          {who:'Granny Zhu', port:Z, text:"Not bad, not bad! In the NORTH they fill them sweet, with dates. Here in the south? Pork and salted egg yolk."},
          {who:'Granny Zhu', port:Z, text:"Every family swears theirs is the true zongzi. The arguing is HALF the tradition. Now — I need mugwort from the riverbank. Three good sprigs!"},
        ], ()=>{ giveScroll('zongzi'); setStep(3); });
      })));
      else if (G.step===4) say([
        {who:'Granny Zhu', port:Z, text:"Fresh and sharp — perfect. Mugwort and calamus go over every door today."},
        {who:'Granny Zhu', port:Z, text:"The fifth month brings heat, bugs, and sickness — the 'five poisons.' These herbs stand guard, and this little sachet is for YOU. Sniff it when your homework smells worse."},
      ], ()=>{ giveScroll('herbs'); setStep(5); });
      else say([{who:'Granny Zhu', port:Z, text: G.step===3 ? "Three sprigs of mugwort, riverbank, feathery leaves. My knees don't do riverbanks anymore." : "Eat. You're too skinny to fight rivers."}]);
    }
    else say([{who:'Granny Zhu', port:Z, text: G.ch===1 ? "I hid a lucky coin in one dumpling. Whoever finds it gets the luckiest year — and maybe a chipped tooth." : "I taught Baker Fang everything. He adds too much sugar anyway."}]);
  },

  fang(){
    const F = port('fang');
    if (G.ch===3 && G.step===2){
      say([
        {who:'Baker Fang', port:F, text:"The moon may be shy tonight, but MY ovens are not! We bake mooncakes — golden, round, and packed with meaning."},
        {who:'Baker Fang', port:F, text:"Lotus paste, a salted egg yolk hidden inside like a little full moon, and the mold pressed at JUST the right moment. Ready? The dough waits for no one!"},
      ], ()=> pushScene(makeTiming({
        title:'MOONCAKE BAKERY', flavor:'Press at the perfect moment!',
        roundLabels:['Press the dough into the mold…','Tuck in the salted egg yolk…','STAMP the pattern — now!'],
        speeds:[2.0,2.6,3.2], zones:[32,25,19],
        doneTitle:'GOLDEN!', doneLine:'A tray of perfect mooncakes, stamped and shining!',
        onHit(r){ SFX.sparkle(); },
        drawScene(progress,t,done){
          R(0,0,LW,LH,'#4a3424');
          for(let i=0;i<LW;i+=24) R(i,0,1,LH,'rgba(0,0,0,0.12)');
          R(0,104,LW,76,'#8a6844'); R(0,104,LW,4,'#a88054');
          // oven
          R(240,60,54,44,'#5a4438'); R(248,74,38,22,'#2a1a12');
          glow(267,85,14,'#ff7030',0.4+Math.sin(t*6)*0.1);
          R(250,76,34,4,'#ff9040');
          // tray of mooncakes appears
          R(60,96,80,6,'#6a4c30');
          for(let i=0;i<progress;i++) drawMooncake(74+i*26, 92, 1.1);
          if (done) for(let i=0;i<3;i++) glow(74+i*26, 92, 10, '#ffd964', 0.25);
          drawPerson(180,140,{...port('fang'), dir:'left'},t);
          drawPerson(140,146,{...playerLook(), dir:'right'},t);
        }
      }, ()=>{
        say([
          {who:'Baker Fang', port:F, text:"BEAUTIFUL. Round cakes for a 'round' family — tuányuán, reunion. One cake, cut in slices, so every single person shares it."},
          {who:'Baker Fang', port:F, text:"Now light the five lantern poles around the village! A feast needs light — and the moon could use the encouragement."},
        ], ()=>{ giveScroll('mooncake'); setStep(3); });
      })));
    }
    else say([{who:'Baker Fang', port:F, text: G.ch===3 ? (G.step<3?"Ovens preheating!":"Save room for seconds!") : G.ch===1 ? "New Year's means niángāo — sticky rice cake! 'Gāo' sounds like 'taller': a HIGHER year, every year." : "Zongzi are Granny Zhu's turf. I know better than to compete."}]);
  },
};

/* is Lóng the current objective? then he waits at the pedestal */
function longWaiting(){
  return (G.ch===1&&G.step===7)||(G.ch===2&&G.step===6)||(G.ch===3&&(G.step===5||G.step===6));
}

/* ---------- interactables ---------- */
function getInteractables(){
  const list = [];
  // Lóng (hovers near you; stand still to talk to him)
  list.push({x:world.lx, y:world.ly+10, r:28, depri:14, label:'Lóng', talk:talks.long});
  for (const id in NPCS){
    const p = npcPos(id);
    if (!p) continue;
    list.push({x:p[0], y:p[1], r:24, label:NPCS[id].name, talk:talks[id]});
  }
  // pedestal
  list.push({x:480, y:210, r:24, label:'Festival Treasure', talk(){
    const which = G.ch===1?['Red Lantern','t1']:G.ch===2?['Dragon Drum','t2']:['Moon Mirror','t3'];
    say([{who:'', text: G.flags[which[1]]
      ? 'The '+which[0]+' blazes with light. The story is safe.'
      : 'The '+which[0]+' sits dim and gray, waiting for its story to be remembered.'}]);
  }});
  // well & shrine & pavilion flavor
  list.push({x:WELL.x, y:WELL.y+6, r:22, label:'Make a wish', talk(){
    say([{who:'', text:pick([
      'You toss a wish into the well. Somewhere below: plip.',
      'The well water is very cold and very honest. Your wish stands a fair chance.',
      'You wish for '+(G.ch===3?'mooncakes':'dumplings')+'. Statistically, this one always comes true.'])}]);
  }});
  list.push({x:SHRINE.x, y:SHRINE.y+6, r:26, label:'Read the shrine', talk(){
    say([{who:'', text:"Carved into the shrine: 'Long, long is the road, and I will search high and low.' — Qu Yuan, from the poem 'Li Sao.'"}]);
  }});
  list.push({x:PAVILION.x, y:PAVILION.y+8, r:28, label:'Moon pavilion', talk(){
    say([{who:'', text: G.ch===3 ? 'The whole village comes here to watch the moon rise. Best seat in the house.' : 'A quiet pavilion on the hill, built for watching the moon. It waits patiently for autumn.'}]);
  }});
  // chapter items
  if (G.ch===2 && G.step===3){
    MUGWORT.forEach((m,i)=>{
      if (!G.flags['mug'+i]) list.push({x:m[0], y:m[1], r:18, label:'Pick mugwort', talk(){
        G.flags['mug'+i]=true; SFX.sparkle();
        burst(m[0], m[1]-6, ['#78d878','#57a862'], 12, 30);
        const got = MUGWORT.filter((_,j)=>G.flags['mug'+j]).length;
        if (got>=3) say([{who:'', text:'(Three fresh sprigs! Their sharp green smell clears your head. Back to Granny Zhu.)'}], ()=> setStep(4));
        else say([{who:'', text:'(You pick a sprig of mugwort. '+got+' of 3.)'}]);
      }});
    });
  }
  if (G.ch===3 && G.step===3){
    POLES.forEach((p,i)=>{
      if (!G.flags['pole'+i]) list.push({x:p[0], y:p[1], r:20, label:'Light lantern', talk(){
        G.flags['pole'+i]=true; SFX.sparkle();
        burst(p[0]+7, p[1]-20, ['#ffb050','#ffe98a'], 14, 30);
      }});
    });
  }
  return list;
}
/* ============================================================
   BOOT
   ============================================================ */
window.addEventListener('contextmenu', e=> e.preventDefault());
pushScene(titleScene);
requestAnimationFrame(frame);
</script>
