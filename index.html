  /* pale belly plate with segment lines and a little spider mark */
  ell(x, y-9+bob, 14.5, 8, INKp);
  ell(x, y-9+bob, 13.5, 7, '#e8e4c0');
  for (let i=0;i<3;i++) R(x-11+i*1.4, y-11+bob+i*3.4, 22-i*3, 1, '#c8c49a');
  circle(x, y-8.4+bob, 1.7, '#6a3a7a');
  for (const [lx2,ly2] of [[-2.6,-1.4],[2.6,-1.4],[-2.9,0.6],[2.9,0.6]])
    R(x+lx2-0.5, y-8.4+bob+ly2, 1, 1, '#6a3a7a');
  /* throat sac, pulsing */
  const puff = 2.2 + Math.sin(t*4.6)*1.6;
  ell(x, y-3+bob, 6.5+puff*0.7, 2.6+puff*0.5, INKp);
  ell(x, y-3+bob, 6+puff*0.7, 2.2+puff*0.5, '#d8e0a0');

  /* front feet planted wide */
  for (const sgn of [-1, 1]){
    const fx2 = x + sgn*9;
    R(fx2-2.6, y-6+bob, 5.2, 6.4, INKp); R(fx2-2, y-5.4+bob, 4, 5.6, G0);
    R(fx2-3.6, y-0.8, 7.4, 2.6, INKp);
    for (let k2=0;k2<3;k2++) R(fx2-2.8+k2*2.4, y-0.4, 1.6, 1.8, '#d8e0a0');
  }

  /* head: wide and heavy, grown out of the body — not a lollipop */
  ell(x, y-27+bob, 16.5, 9.5, INKp);
  ell(x, y-27+bob, 15.5, 8.5, G1);
  ell(x-3, y-30+bob, 9, 4, G2);
  /* heavy brow */
  R(x-14, y-32+bob, 28, 2.6, INKp);
  R(x-13, y-31.6+bob, 26, 1.6, G0);
  /* big gold eyes with slit pupils, up on the corners */
  for (const sgn of [-1, 1]){
    const ex2 = x + sgn*9.5, ey2 = y - 33 + bob;
    circle(ex2, ey2, 5.4, INKp);
    circle(ex2, ey2, 4.4, rage ? '#ff5030' : '#ffd23a');
    circle(ex2 - sgn*1, ey2-1.2, 1.6, rage ? '#ffd0c0' : '#fff2c0');
    R(ex2-0.9, ey2-3.2, 1.8, 6.4, INKp);
  }
  /* nostrils + a wide grim mouth with up-fangs */
  R(x-2.8, y-29+bob, 1.4, 1.4, INKp); R(x+1.6, y-29+bob, 1.4, 1.4, INKp);
  R(x-11.5, y-23.4+bob, 23, 1.8, INKp);
  R(x-13, y-24.4+bob, 3, 2.6, INKp); R(x+10, y-24.4+bob, 3, 2.6, INKp);
  tri(x-6.4, y-23+bob, x-4.8, y-27.6+bob, x-3.2, y-23+bob, INKp);
  tri(x-5.8, y-23.4+bob, x-4.8, y-26.6+bob, x-3.8, y-23.4+bob, '#f6f2e6');
  tri(x+3.2, y-23+bob, x+4.8, y-27.6+bob, x+6.4, y-23+bob, INKp);
  tri(x+3.8, y-23.4+bob, x+4.8, y-26.6+bob, x+5.8, y-23.4+bob, '#f6f2e6');

  /* the crown — he IS the king */
  const cy2 = y - 40 + bob;
  R(x-6.4, cy2, 12.8, 3.6, INKp);
  R(x-5.6, cy2+0.6, 11.2, 2.4, '#f2b632');
  for (const [px3, ph3] of [[-4.6, 4.6], [0, 6], [4.6, 4.6]]){
    tri(x+px3-2.2, cy2+0.8, x+px3, cy2-ph3, x+px3+2.2, cy2+0.8, INKp);
    tri(x+px3-1.3, cy2+0.6, x+px3, cy2-ph3+1.4, x+px3+1.3, cy2+0.6, '#f2b632');
  }
  R(x-1, cy2-6.8, 2, 2, INKp); R(x-0.6, cy2-6.4, 1.2, 1.2, '#e0403c');

  if (hurt>0) glow(x, y-20, 34, '#ffffff', 0.4*hurt);
  if (rage) glow(x, y-30, 30, '#ff3820', 0.2);
}
function drawMugwort(x, y, aim, k){
  const a = aim + lerp(-0.95, 0.95, k);
  const hx = x+Math.cos(a)*6, hy = y+Math.sin(a)*6;
  const tx = x+Math.cos(a)*18, ty = y+Math.sin(a)*18;
  cx.strokeStyle='#7a5a38'; cx.lineWidth=P*1.6;
  cx.beginPath(); cx.moveTo(hx*P,hy*P); cx.lineTo(tx*P,ty*P); cx.stroke();
  for (let i=-3;i<=3;i++){
    const lx = tx+Math.cos(a+Math.PI/2)*i*2, ly = ty+Math.sin(a+Math.PI/2)*i*2;
    circle(lx, ly, 2.2, '#2e7a3e'); circle(lx-0.6, ly-0.6, 1.2, '#6ab04c');
  }
  cx.globalAlpha = 0.3*(1-Math.abs(k-0.5)*2);
  circle(tx, ty, 11, '#a8e08a');
  cx.globalAlpha = 1;
}

/* ---------------- the fight ---------------- */
function makePoisonBattle(onDone){
  const st = {
    usesDash:true,
    mode:'intro', t:0, evT:0, fightT:0, wave:0,
    px:250, py:120, dir:'left', moving:false,
    dashT:0, dashCd:0, inv:0, swingT:0, swingCd:0, swingDir:'right',
    hearts:5, maxHearts:5, charge:0, ghosts:[], deaths:0, sprigs:[],
    foes:[], venom:[], rings:[], webs:[], king:null,
    msg:'', msgT:0, msgC:'#ffe9b0', shake:0, danger:false, fledT:-1,
  };
  window.POISON = st;
  function say2(m,c){ st.msg=m; st.msgT=1.3; st.msgC=c||'#ffe9b0'; }
  function hurtPlayer(){
    if (st.inv>0 || (st.mode!=='fight' && st.mode!=='king')) return;
    st.hearts--; st.inv=2.1; st.shake=0.5;
    SFX.bad(); noiseHit(0.3,0.4,true);
    burst(st.px, st.py-8, ['#8a3a72','#ffffff'], 16, 55);
    for (const f of st.foes){                       // shove everything off you
      const d = dist(f.x,f.y,st.px,st.py-8);
      if (d < 46){ const a = Math.atan2(f.y-(st.py-8), f.x-st.px);
        f.vx += Math.cos(a)*230; f.vy += Math.sin(a)*230;
        if (f.state) { f.state='idle'; f.stT=0; } }
    }
    if (st.hearts<=0){ st.mode='lose'; st.evT=0; st.deaths=(st.deaths||0)+1; }
  }
  function spawn(kind, x, y){
    const base = { kind, x, y, vx:0, vy:0, hurtT:0, t:rnd(3), state:'idle', stT:0 };
    if (kind==='scorpion') Object.assign(base, { hp:5, r:11 });
    if (kind==='snake')    Object.assign(base, { hp:4, r:7, shootT:rnd(1.4,2.6) });
    if (kind==='toad')     Object.assign(base, { hp:8, r:13 });
    if (kind==='spider')   Object.assign(base, { hp:4, r:7, webT:rnd(1.4,2.6) });
    if (kind==='centipede')Object.assign(base, { hp:8, r:7, tail:[], ang:rnd(6.28) });
    st.foes.push(base);
  }
  const WAVES = [
    ()=>{ spawn('scorpion', 60, 80); spawn('snake', 60, 140); say2('WAVE 1 — scorpion & snake', '#ff8a70'); },
    ()=>{ spawn('centipede', 50, 100); spawn('spider', 280, 80); spawn('spider', 280, 148); say2('WAVE 2 — centipede & spiders', '#ff8a70'); },
    ()=>{ spawn('toad', 160, 70); spawn('snake', 280, 130); spawn('scorpion', 46, 140); say2('WAVE 3 — the great toad!', '#ff8a70'); },
  ];
  function startKing(){
    if (st.hearts < 3){ st.hearts = 3; say2('Granny refills your sachet — 3 sprigs for the King!', '#7ce87c'); }
    st.king = { x:160, y:120, vx:0, vy:0, hp:36, maxHp:36, hurtT:0, atk:null, atkCd:1.9, ang:0 };
    st.mode='king'; hissSfx(); SFX.gong(); st.shake=0.9;
    say2('WǓ DÚ — THE FIVE-POISON KING!', '#ff3820');
  }
  function nextWave(){
    if (st.wave < WAVES.length){ WAVES[st.wave](); st.wave++; }
    else startKing();
  }

  return {
    usesDash:true, aim:true,
    enter(){ playMusic(4); },
    update(dt){
      st.t+=dt; st.evT+=dt;
      st.msgT=Math.max(0,st.msgT-dt); st.shake=Math.max(0,st.shake-dt);
      st.inv=Math.max(0,st.inv-dt); st.dashT=Math.max(0,st.dashT-dt);
      st.dashCd=Math.max(0,st.dashCd-dt); st.swingT=Math.max(0,st.swingT-dt);
      st.swingCd=Math.max(0,st.swingCd-dt);
      st.ghosts = st.ghosts.filter(g=>(g.t+=dt)<0.25);
      updateParts(dt);

      if (st.mode==='intro'){ if (st.evT>2.2 || just.a){ st.mode='fight'; nextWave(); } return; }
      if (st.mode==='lose'){
        if ((just.a || just.click) && st.evT>0.9){
          st.hearts=st.maxHearts; st.wave=0; st.foes=[]; st.venom=[]; st.rings=[]; st.webs=[]; st.sprigs=[];
          st.king=null; st.px=250; st.py=120; st.charge=0; st.mode='fight'; st.evT=0; st.fightT=0;
          nextWave();
        }
        if (just.b && st.evT>0.9){                    // retreat to the village, come back any time
          popScene();
          say([{who:'Lóng', port:LONG_PORTRAIT, text:"Catch your breath, little keeper. The mugwort still waits at the river's edge — we finish this when YOU say."}]);
        }
        return;
      }
      if (st.mode==='win'){
        if (st.fledT<0) st.fledT=st.t;
        if (Math.random()<0.14) burst(rnd(40,280), rnd(60,140), ['#6ab04c','#f2b632','#a8e08a'], 14, 60);
        if (st.evT>2.6){ popScene(); onDone(); }
        return;
      }
      st.fightT += dt;
      st.charge = Math.min(100, st.charge + 32*dt);

      /* ---- player ---- */
      let vx=0, vy=0;
      if (keys.left) vx=-1; else if (keys.right) vx=1;
      if (keys.up) vy=-1; else if (keys.down) vy=1;
      st.moving=!!(vx||vy);
      if (vx&&vy){ vx*=0.707; vy*=0.707; }
      if (vx<0) st.dir='left'; else if (vx>0) st.dir='right';
      else if (vy<0) st.dir='up'; else if (vy>0) st.dir='down';
      if (just.dash && st.dashCd<=0){ st.dashT=0.16; st.dashCd=0.6; st.inv=Math.max(st.inv,0.28); SFX.dash(); }
      let spd = st.dashT>0 ? 285 : 110;
      for (const w of st.webs) if (dist(w.x,w.y,st.px,st.py-8) < 16 && st.dashT<=0) spd *= 0.45;
      if (st.dashT>0 && !vx && !vy){
        vx = st.dir==='left'?-1: st.dir==='right'?1:0;
        vy = st.dir==='up'?-1: st.dir==='down'?1:0;
      }
      st.px = clamp(st.px+vx*spd*dt, PR.x0+8, PR.x1-8);
      st.py = clamp(st.py+vy*spd*dt, PR.y0+12, PR.y1-4);
      if (st.dashT>0) st.ghosts.push({x:st.px,y:st.py,t:0});

      /* ---- mugwort swing ---- */
      if ((just.a || just.click) && st.swingCd<=0){
        st.swingT=0.24; st.swingCd=0.3; swingSfx();
        st.aimA = mouse.over ? aimAngle(st.px, st.py-8)
                : (st.dir==='left'?Math.PI: st.dir==='right'?0: st.dir==='up'?-Math.PI/2:Math.PI/2);
        const ax = Math.cos(st.aimA), ay = Math.sin(st.aimA);
        if (Math.abs(ax) > Math.abs(ay)) st.dir = ax<0?'left':'right'; else st.dir = ay<0?'up':'down';
        const hx = st.px+ax*17, hy = st.py-8+ay*17;
        for (const f of st.foes){
          if (dist(f.x,f.y,hx,hy) < 27+f.r){
            f.hp--; f.hurtT=0.25;
            const a = Math.atan2(f.y-(st.py-8), f.x-st.px);
            f.vx += Math.cos(a)*230; f.vy += Math.sin(a)*230;
            burst(f.x,f.y,['#6ab04c','#a8e08a'],8,40);
          }
        }
        if (st.king && dist(st.king.x, st.king.y-20, hx, hy) < 38){
          st.king.hp -= 2; st.king.hurtT=0.25;
          burst(st.king.x, st.king.y-20, ['#6ab04c','#a8e08a'],10,45);
          if (st.king.hp<=0){ st.mode='win'; st.evT=0; st.fledT=-1; st.venom=[]; st.rings=[]; playMusic(2); SFX.win(); }
        }
        for (const v of st.venom) if (dist(v.x,v.y,hx,hy) < 20) v.gone = true;   // bat away venom
      }
      /* ---- sachet burst ---- */
      if ((just.b || (just.click && mouse.down && false)) && st.charge>=100){
        st.charge = 0; burstSfx(); st.shake=0.4;
        burst(st.px, st.py-8, ['#a8e08a','#6ab04c','#f2b632'], 40, 90);
        for (const v of st.venom) if (dist(v.x,v.y,st.px,st.py-8) < 52) v.gone=true;
        for (const f of st.foes) if (dist(f.x,f.y,st.px,st.py-8) < 52){
          f.hp -= 2; f.hurtT=0.3;
          const a = Math.atan2(f.y-(st.py-8), f.x-st.px);
          f.vx += Math.cos(a)*180; f.vy += Math.sin(a)*180;
        }
        if (st.king && dist(st.king.x, st.king.y-20, st.px, st.py-8) < 60){
          st.king.hp -= 3; st.king.hurtT=0.3;
          if (st.king.hp<=0){ st.mode='win'; st.evT=0; st.fledT=-1; st.venom=[]; st.rings=[]; playMusic(2); SFX.win(); }
        }
        st.webs = st.webs.filter(w=> dist(w.x,w.y,st.px,st.py-8) > 52);
      }

      /* ---- foes ---- */
      for (const f of st.foes){
        f.t += dt; f.stT += dt; f.hurtT = Math.max(0, f.hurtT-dt);
        const toP = Math.atan2(st.py-8-f.y, st.px-f.x);
        if (f.kind==='scorpion'){
          if (f.state==='idle'){
            f.vx += Math.cos(toP)*17*dt; f.vy += Math.sin(toP)*17*dt;
            if (f.stT > 2.0){ f.state='wind'; f.stT=0; f.aim=toP; }
          } else if (f.state==='wind'){
            f.aim = toP;
            if (f.stT > 0.75){ f.state='dash'; f.stT=0; f.vx=Math.cos(f.aim)*160; f.vy=Math.sin(f.aim)*160; hissSfx(); }
          } else if (f.state==='dash'){
            if (f.stT > 0.45){ f.state='idle'; f.stT=0; }
          }
        } else if (f.kind==='snake'){
          const perp = toP + Math.PI/2;
          f.vx += (Math.cos(toP)*22 + Math.cos(perp)*Math.sin(f.t*3)*32)*dt;
          f.vy += (Math.sin(toP)*22 + Math.sin(perp)*Math.sin(f.t*3)*32)*dt;
          f.shootT -= dt;
          if (f.shootT<=0){
            f.shootT = 2.8;
            st.venom.push({ x:f.x, y:f.y, vx:Math.cos(toP)*56, vy:Math.sin(toP)*56, t:0 });
            hissSfx();
          }
        } else if (f.kind==='spider'){
          if (f.stT > 0.9){
            f.stT = 0; f.vx = Math.cos(toP+rnd(-0.9,0.9))*98; f.vy = Math.sin(toP+rnd(-0.9,0.9))*98;
          }
          f.webT -= dt;
          if (f.webT<=0){ f.webT = 3.4; st.webs.push({x:f.x, y:f.y, t:0}); }
        } else if (f.kind==='toad'){
          if (f.state==='idle'){
            if (f.stT > 1.9){ f.state='crouch'; f.stT=0; f.tx=st.px; f.ty=st.py-8; }
          } else if (f.state==='crouch'){
            if (f.stT > 0.8){ f.state='leap'; f.stT=0; f.sx=f.x; f.sy=f.y; }
          } else if (f.state==='leap'){
            const k = Math.min(f.stT/0.55, 1);
            f.x = f.sx + (f.tx-f.sx)*k; f.y = f.sy + (f.ty-f.sy)*k;
            f.hop = Math.sin(k*Math.PI)*22;
            if (k>=1){
              f.state='idle'; f.stT=0; f.hop=0;
              st.rings.push({x:f.x, y:f.y, r:6});
              mdrum(0,0.5); st.shake=0.4;
            }
          }
        } else if (f.kind==='centipede'){
          f.ang += Math.sin(f.t*1.6)*dt*2.2;
          const desired = Math.atan2(st.py-8-f.y, st.px-f.x);
          let da = ((desired - f.ang + Math.PI*3) % (Math.PI*2)) - Math.PI;
          f.ang += clamp(da, -1.6*dt, 1.6*dt);
          f.vx = Math.cos(f.ang)*46; f.vy = Math.sin(f.ang)*46;
          f.tail.unshift({x:f.x, y:f.y});
          if (f.tail.length > 44) f.tail.pop();
        }
        if (f.kind!=='toad' || f.state!=='leap'){
          f.x += f.vx*dt; f.y += f.vy*dt;
          f.vx *= 0.9; f.vy *= 0.9;
        }
        f.x = clamp(f.x, PR.x0+10, PR.x1-10);
        f.y = clamp(f.y, PR.y0+10, PR.y1-6);
        // contact
        const cr = f.kind==='centipede' ? 9 : f.r;
        if (dist(f.x,f.y,st.px,st.py-8) < cr+1 && st.dashT<=0) hurtPlayer();
        if (f.kind==='centipede'){
          for (let i=10;i<f.tail.length;i+=12){
            const s = f.tail[i];
            if (dist(s.x,s.y,st.px,st.py-8) < 9 && st.dashT<=0) hurtPlayer();
          }
        }
        if (f.hp<=0){
          f.dead = true;
          burst(f.x,f.y,['#6ab04c','#a8e08a','#f2b632'],22,70);
          dustPoof(f.x,f.y,true);
          st.sprigs.push({ x:f.x, y:f.y, t:0 });          // it leaves a sprig behind
        }
      }
      const alive = st.foes.filter(f=>!f.dead);
      if (alive.length !== st.foes.length){
        st.foes = alive;
        if (!st.foes.length && st.mode==='fight'){
          if (st.wave < WAVES.length){
            if (st.hearts < st.maxHearts){
              st.hearts++;
              say2('Wave cleared — Granny hands you a fresh sprig! +1', '#7ce87c');
              burst(st.px, st.py-10, ['#7ce87c','#ffe9b0'], 18, 50);
            } else say2('Wave cleared!', '#7ce87c');
            SFX.sparkle();
          }
          nextWave();
        }
      }

      /* ---- the king ---- */
      if (st.king){
        const k = st.king;
        k.hurtT = Math.max(0, k.hurtT-dt);
        const toP = Math.atan2(st.py-8-(k.y-20), st.px-k.x);
        const gap = dist(k.x, k.y-20, st.px, st.py-8);
        if (!k.atk){
          const push = gap > 92 ? 1 : gap < 56 ? -1.1 : 0;
          k.vx += Math.cos(toP)*36*push*dt; k.vy += Math.sin(toP)*26*push*dt;
          k.atkCd -= dt;
          if (k.atkCd<=0){
            const rage = k.hp <= k.maxHp/2;
            k.atk = { kind: pick(rage ? ['fan','ring','charge','summon','fan','ring'] : ['fan','ring','charge','summon']),
                      ph:'warn', t:0, warn: rage?0.55:0.75 };
            if (k.atk.kind==='charge'){ k.atk.tx=st.px; k.atk.ty=st.py; }
          }
        } else {
          const A = k.atk; A.t += dt;
          const rage = k.hp <= k.maxHp/2;
          if (A.ph==='warn'){
            if (A.kind==='charge'){ A.tx=st.px; A.ty=st.py; }
            if (A.t>=A.warn){
              A.ph='go'; A.t=0;
              if (A.kind==='fan'){
                const n = rage?7:5;
                for (let i=0;i<n;i++)
                  st.venom.push({ x:k.x, y:k.y-20, vx:Math.cos(toP+(i-(n-1)/2)*0.24)*74,
                                  vy:Math.sin(toP+(i-(n-1)/2)*0.24)*74, t:0 });
                hissSfx(); k.atk=null; k.atkCd = rage?1.5:2.0;
              } else if (A.kind==='ring'){
                st.rings.push({x:k.x, y:k.y-14, r:8});
                const n = rage?12:9, off=rnd(6.28);
                for (let i=0;i<n;i++)
                  st.venom.push({ x:k.x, y:k.y-20, vx:Math.cos(off+i/n*6.283)*46, vy:Math.sin(off+i/n*6.283)*46, t:0 });
                mdrum(0,0.6); st.shake=0.5; k.atk=null; k.atkCd = rage?1.7:2.2;
              } else if (A.kind==='summon'){
                spawn(pick(['snake','spider','scorpion']), k.x+rnd(-26,26), k.y+rnd(-20,20));
                if (rage) spawn(pick(['spider','snake']), k.x+rnd(-26,26), k.y+rnd(-20,20));
                hissSfx(); k.atk=null; k.atkCd = 2.2;
              }
            }
          } else if (A.kind==='charge'){
            if (A.ph==='go'){
              const a = Math.atan2(A.ty-8-(k.y-20), A.tx-k.x);
              k.vx = Math.cos(a)*230; k.vy = Math.sin(a)*230;
              if (A.t>0.55 || k.x<=PR.x0+26 || k.x>=PR.x1-26 || k.y<=PR.y0+34 || k.y>=PR.y1-6){
                A.ph='recover'; A.t=0; k.vx*=0.2; k.vy*=0.2; st.shake=0.4; mdrum(0,0.5);
              }
            } else if (A.t>0.85){ k.atk=null; k.atkCd = rage?1.5:1.9; }
          }
        }
        k.x += k.vx*dt; k.y += k.vy*dt;
        k.vx *= 0.94; k.vy *= 0.94;
        k.x = clamp(k.x, PR.x0+26, PR.x1-26);
        k.y = clamp(k.y, PR.y0+34, PR.y1-4);
        if (gap < 24 && st.dashT<=0) hurtPlayer();
      }

      /* ---- projectiles ---- */
      for (const v of st.venom){
        v.t += dt; v.x += v.vx*dt; v.y += v.vy*dt;
        if (dist(v.x,v.y,st.px,st.py-8) < 8 && st.dashT<=0){ v.gone=true; hurtPlayer(); }
        if (v.x<PR.x0-6||v.x>PR.x1+6||v.y<PR.y0-6||v.y>PR.y1+6||v.t>7) v.gone=true;
      }
      st.venom = st.venom.filter(v=>!v.gone);
      for (const r of st.rings){
        r.r += 112*dt;
        if (Math.abs(dist(st.px,st.py-8,r.x,r.y)-r.r) < 8 && st.dashT<=0) hurtPlayer();
        if (r.r>320) r.gone = true;
      }
      st.rings = st.rings.filter(r=>!r.gone);
      for (const w of st.webs) w.t += dt;
      for (const sp2 of st.sprigs){
        sp2.t += dt;
        if (!sp2.got && dist(sp2.x, sp2.y, st.px, st.py-8) < 13){
          sp2.got = true; SFX.sparkle();
          if (st.hearts < st.maxHearts){ st.hearts++; say2('a fresh sprig! +1', '#7ce87c'); }
          else { st.charge = Math.min(100, st.charge + 30); say2('sachet charged!', '#ffe9b0'); }
          burst(sp2.x, sp2.y, ['#7ce87c','#a8e08a'], 12, 40);
        }
      }
      st.sprigs = st.sprigs.filter(sp2 => !sp2.got && sp2.t < 9);
      st.webs = st.webs.filter(w=> w.t < 9);

      st.danger = st.venom.some(v=>dist(v.x,v.y,st.px,st.py-8)<34)
        || st.rings.some(r=>Math.abs(dist(st.px,st.py-8,r.x,r.y)-r.r)<26)
        || st.foes.some(f=> dist(f.x,f.y,st.px,st.py-8)<34 || (f.kind==='scorpion'&&f.state==='dash'))
        || (st.king && dist(st.king.x,st.king.y-20,st.px,st.py-8)<46);
    },

    render(){
      const shx = st.shake>0 ? Math.round(Math.sin(st.t*70)*st.shake*4) : 0;
      cx.save(); cx.translate(shx*P,0);
      /* summer riverbank */
      R(0,0,LW,LH,'#2a4a2e');
      for (let y=PR.y0-10; y<PR.y1+10; y+=16)
        for (let x=PR.x0-8; x<PR.x1+8; x+=16) grassTile(x, y, x/16, y/16, PALS[2], '#4e8c3c');
      R(0, PR.y1+4, LW, LH-PR.y1-4, '#2a5a86');
      for (let i=0;i<LW;i+=18) R(i+((st.t*8)%18), PR.y1+8, 10, 1.4, '#3f78a8');
      for (let i=0;i<LW;i+=11) R(i, PR.y1+1, 1.4, 5, '#6ab04c');
      // hung mugwort along the top fence
      R(PR.x0-8, PR.y0-12, PR.x1-PR.x0+16, 4, '#6a4a34');
      for (let i=0;i<11;i++){
        const bx = PR.x0+6+i*26;
        R(bx-0.8, PR.y0-8, 1.6, 7, '#7a5a38');
        circle(bx, PR.y0-1, 2.6, '#2e7a3e'); circle(bx-0.8, PR.y0-1.8, 1.4, '#6ab04c');
      }
      // webs — pixel spokes and rings
      for (const w of st.webs){
        const a = clamp(1 - w.t/9, 0, 1);
        cx.globalAlpha = a*0.8;
        for (let i=0;i<8;i++){
          const an = i/8*6.283 + 0.39;
          pixLine(w.x, w.y, w.x+Math.cos(an)*13, w.y+Math.sin(an)*13, 1, '#d8dce8');
        }
        for (let r=5;r<=12;r+=3.5){
          for (let i=0;i<8;i++){
            const an1 = i/8*6.283 + 0.39, an2 = (i+1)/8*6.283 + 0.39;
            pixLine(w.x+Math.cos(an1)*r, w.y+Math.sin(an1)*r,
                    w.x+Math.cos(an2)*r, w.y+Math.sin(an2)*r, 1, '#b8c0d4');
          }
        }
        R(w.x-1, w.y-1, 2, 2, '#eef2f8');
        cx.globalAlpha = 1;
      }
      // shock rings
      for (const r of st.rings){
        for (let i=0;i<24;i++){
          const a=i/24*6.283;
          R(r.x+Math.cos(a)*r.r, r.y+Math.sin(a)*r.r*0.72, 2.4, 2.4, i%2?'#8fae4e':'#d8d09a');
        }
      }
      // actors, depth sorted
      const items = [];
      for (const f of st.foes){
        if (f.kind==='centipede'){
          items.push({y:f.y, f:()=>{
            for (let i=f.tail.length-1;i>=4;i-=4){
              const s2=f.tail[i]; drawCentipedeSeg(s2.x, s2.y, st.t, i, false, 0);
            }
            drawCentipedeSeg(f.x, f.y, st.t, 0, true, f.hurtT);
          }});
        } else if (f.kind==='scorpion') items.push({y:f.y, f:()=> drawScorpion(f.x,f.y,st.t,f.hurtT)});
        else if (f.kind==='snake')      items.push({y:f.y, f:()=> drawSnake(f.x,f.y,st.t,f.hurtT)});
        else if (f.kind==='spider')     items.push({y:f.y, f:()=> drawSpider(f.x,f.y,st.t,f.hurtT)});
        else if (f.kind==='toad')       items.push({y:f.y, f:()=> drawToad(f.x,f.y-(f.hop||0),st.t,f.hurtT,f.state==='crouch')});
        if (f.kind==='scorpion' && f.state==='wind'){
          items.push({y:f.y+1, f:()=>{
            cx.globalAlpha=0.5+Math.sin(st.t*18)*0.2;
            for (let i=1;i<10;i++) R(f.x+Math.cos(f.aim)*i*13, f.y+Math.sin(f.aim)*i*13, 3, 3, '#ff3820');
            cx.globalAlpha=1;
          }});
        }
        if (f.kind==='toad' && f.state==='crouch'){
          items.push({y:f.y+1, f:()=>{
            cx.globalAlpha=0.45+Math.sin(st.t*16)*0.2;
            ell(f.tx, f.ty, 18, 6, '#ff7030'); cx.globalAlpha=1;
          }});
        }
      }
      for (const sp2 of st.sprigs){
        const bob = Math.sin(st.t*4 + sp2.x)*1.4;
        const fade = sp2.t > 7 && Math.sin(st.t*12) > 0;
        if (!fade) items.push({y:sp2.y, f:()=>{ glow(sp2.x, sp2.y-4+bob, 7, '#7ce87c', 0.18);
                                                drawMugwortPip(sp2.x, sp2.y-6+bob, true, st.t); }});
      }
      if (st.king) items.push({y:st.king.y, f:()=>{
        const k = st.king;
        drawPoisonKing(k.x, k.y, st.t, k.hurtT, k.hp<=k.maxHp/2);
        if (k.atk && k.atk.ph==='warn'){
          const bl = Math.sin(st.t*16) > 0;
          // the tell: a flashing mark over his head
          T('!', k.x, k.y-56, 10, bl ? '#ffe98a' : '#ff3820', 'center');
          cx.globalAlpha = 0.55 + (bl ? 0.2 : 0);
          if (k.atk.kind==='charge'){
            for (let i2=2;i2<12;i2++){
              const fx = k.x + (k.atk.tx-k.x)*i2/12, fy = (k.y-20) + (k.atk.ty-8-(k.y-20))*i2/12;
              R(fx-1.5, fy-1.5, 3, 3, '#ff3820');
            }
          } else if (k.atk.kind==='fan'){
            const fa = Math.atan2(st.py-8-(k.y-20), st.px-k.x);
            for (const off2 of [-0.3, 0, 0.3])
              pixLine(k.x+Math.cos(fa+off2)*14, k.y-20+Math.sin(fa+off2)*14,
                      k.x+Math.cos(fa+off2)*34, k.y-20+Math.sin(fa+off2)*34, 1.4, '#ff7030');
          } else if (k.atk.kind==='ring'){
            const rr = 16 + Math.sin(st.t*10)*3;
            for (let i2=0;i2<14;i2++){ const an2 = i2/14*6.283;
              R(k.x+Math.cos(an2)*rr-1, k.y-20+Math.sin(an2)*rr-1, 2, 2, '#ff7030'); }
          } else if (k.atk.kind==='summon'){
            for (let i2=0;i2<3;i2++){ const an2 = st.t*4 + i2*2.1;
              R(k.x+Math.cos(an2)*18-1, k.y-20+Math.sin(an2)*10-1, 2, 2, '#7ad24a'); }
          }
          cx.globalAlpha = 1;
        }
      }});
      items.push({y:st.py, f:()=>{
        for (const g of st.ghosts){
          cx.globalAlpha=0.3*(1-g.t/0.25);
          R(g.x-6,g.y-20,12,20, playerLook().top||'#e8b028'); cx.globalAlpha=1;
        }
        if (!(st.inv>0.3 && Math.sin(st.t*40)>0))
          drawPerson(st.px, st.py, {...playerLook(), dir:st.dir, walk:st.moving||st.dashT>0}, st.t);
        if (st.swingT>0) drawMugwort(st.px, st.py-9, st.aimA||0, 1-st.swingT/0.24);
        else {
          const ax = st.dir==='left'?-1:1;
          R(st.px+ax*7, st.py-17, 1.6, 14, '#7a5a38');
          circle(st.px+ax*7.8, st.py-19, 2.6, '#2e7a3e');
        }
      }});
      items.sort((a,b)=>a.y-b.y);
      for (const it of items) it.f();
      // venom
      for (const v of st.venom){
        circle(v.x, v.y, 3.4, '#7ad24a'); circle(v.x-0.8, v.y-0.8, 1.6, '#d8f08a');
        glow(v.x, v.y, 8, '#7ad24a', 0.25);
      }
      drawParts(0,0);
      cx.restore();

      /* HUD */
      mgHeader('THE FIVE POISONS', 'the fifth day of the fifth month');
      for (let i=0;i<st.maxHearts;i++) drawMugwortPip(12+i*11, 32, i < st.hearts, st.t);
      // sachet charge
      T('SACHET', 232, 30, 5, st.charge>=100 ? '#7ce87c' : '#8a7c6a');
      R(268, 30, 44, 6, 'rgba(20,12,16,0.85)');
      R(268, 30, 44*(st.charge/100), 6, st.charge>=100 ? '#7ce87c' : '#c8a860');
      if (st.charge>=100) T('✕ !', 250, 38, 5, Math.sin(st.t*7)>0?'#7ce87c':'#8a7c6a');
      if (st.king){
        T('WǓ DÚ', 96, 30, 5.4, '#ff8a70');
        R(130, 30, 92, 7, 'rgba(20,12,16,0.85)');
        R(131, 31, 90*clamp(st.king.hp/st.king.maxHp,0,1), 5, '#8a3a72');
      } else {
        T('WAVE '+Math.min(st.wave,3)+' / 3', 160, 30, 5.4, '#cfc0a8', 'center');
      }
      R(276, 42, 38, 4, 'rgba(20,12,16,0.85)');
      R(276, 42, 38*(1-st.dashCd/0.6), 4, st.dashCd<=0?'#7ce87c':'#8a7c6a');
      T('DASH', 254, 41, 4.6, '#8a7c6a');

      if (st.mode==='intro'){
        box(24, 62, 272, 56);
        T('THE FIVE POISONS RISE!', LW/2, 68, 8, '#ff8a70','center');
        T('Snake, scorpion, centipede, toad and spider —', LW/2, 84, 5.4, '#f4e8d0','center');
        T('drive them off with mugwort!', LW/2, 93, 5.4, '#f4e8d0','center');
        T('ARROWS move · CLICK swings at the cursor · ✕ sachet · SPACE dash', LW/2, 105, 5.4, '#ffe9b0','center');
      } else if (st.mode==='win'){
        box(34, 62, 252, 50);
        T('THE POISONS FLEE!', LW/2, 68, 8.4, '#7ce87c','center');
        T('Hang the mugwort — summer can do its worst.', LW/2, 84, 5.6, '#f4e8d0','center');
        T('CLICK', LW/2, 96, 5.6, '#cfc0a8','center');
      } else if (st.mode==='lose'){
        box(36, 58, 248, 62);
        T('THE POISON TAKES HOLD…', LW/2, 66, 8, '#ff8a70','center');
        T('Granny Zhu presses fresh mugwort into your hand.', LW/2, 82, 5.4, '#f4e8d0','center');
        T('CLICK to try again  (or Z)', LW/2, 94, 6.6, Math.sin(st.t*5)>0?'#ffe9b0':'#8a7c6a','center');
        T('✕ retreat to the village', LW/2, 105, 5.4, '#cfc0a8','center');
      }
      if (st.msgT>0 && (st.mode==='fight'||st.mode==='king')) T(st.msg, LW/2, 122, 6.6, st.msgC, 'center');
    }
  };
}
function drawMugwortPip(x, y, alive, t){
  if (alive){
    R(x-0.8, y+2, 1.6, 7, '#7a5a38');
    circle(x, y+2, 3.4, '#2e7a3e'); circle(x-1, y+1, 1.8, '#6ab04c');
    circle(x-3, y+4, 1.8, '#3f9450'); circle(x+3, y+4, 1.8, '#3f9450');
  } else {
    R(x-0.8, y+2, 1.6, 7, '#4a3a2a');
    circle(x, y+2, 3, '#3a3a34');
  }
}
/* ============================================================
   BOOT
   ============================================================ */
window.addEventListener('contextmenu', e=> e.preventDefault());
(function(){ const sv = loadGame(); if (sv){ G.muted = !!sv.muted; } })();
pushScene(titleScene);
requestAnimationFrame(frame);
</script>
