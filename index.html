/* ============================================================
   QUIZ / LANTERN RIDDLES — clickable answers, a lantern timer,
   streaks, eliminated options and a score card at the end.
   ============================================================ */

/* a paper lantern that carries a correct answer up into the sky */
function riseLantern(L, t){
  const x = L.x + Math.sin(t*0.8 + L.seed)*3, y = L.y;
  const s = L.s;
  glow(x, y, 13*s, '#ffb050', 0.20);
  R(x-4*s, y+6*s, 8*s, 2*s, '#c8452c');
  ell(x, y, 6*s, 8*s, '#e04a30');
  ell(x, y, 4.6*s, 6.6*s, '#ff6a3a');
  ell(x, y-1*s, 2.6*s, 4*s, '#ffd964');
  R(x-6*s, y-1*s, 12*s, 1, 'rgba(120,20,10,0.45)');
  R(x-4*s, y-8*s, 8*s, 1.4*s, '#c8a860');
  R(x-3*s, y+8*s, 6*s, 3*s, '#f2b632');
}

function makeQuizGame(questions, opts, onDone){
  const st = {
    idx:0, sel:0, state:'ask', t:0, evT:0,
    n: questions[0].a.length, total: questions.length,
    time:0, limit:opts.limit || 22,
    dead:[],                    // options burned away by Lóng
    streak:0, best:0, clean:0, tries:0, firstTry:true,
    lanterns:[], shake:0, flash:0, hintT:0,
    hover:-1, done:false,
  };
  window.QUIZ = st;
  const q = ()=> questions[st.idx];

  function rowRect(i, n){
    const pitch = n >= 4 ? 13 : 15;
    const top = 138 - n*pitch;
    return { x: 40, y: top + i*pitch, w: 240, h: pitch - 2 };
  }
  function answer(i){
    if (st.dead.includes(i)) { SFX.bad(); st.shake = 0.15; return; }
    st.tries++;
    if (i === q().correct){
      st.state = 'right'; st.evT = 0; SFX.good();
      if (st.firstTry){ st.clean++; st.streak++; st.best = Math.max(st.best, st.streak); }
      else st.streak = 0;
      st.lanterns.push({ x: rnd(34,286), y: 176, s: rnd(0.75,1.15), seed: rnd(0,6), v: rnd(6,11) });
      st.flash = 0.28;
      burst(160, 60, ['#f2b632','#ffe98a','#7ce87c'], 24, 60);
    } else {
      st.state='wrong'; st.evT = 0; SFX.bad();
      st.shake = 0.32; st.streak = 0; st.firstTry = false;
      if (!st.dead.includes(i)) st.dead.push(i);
    }
  }
  function nextQ(){
    st.idx++;
    if (st.idx >= questions.length){ st.state = 'score'; st.evT = 0; SFX.win();
      burst(160, 90, ['#f2b632','#ff5838','#7ce87c','#cfe4f4'], 44, 80); return; }
    st.sel = 0; st.dead = []; st.state = 'ask'; st.time = 0; st.firstTry = true; st.hintT = 0;
  }

  return {
    aim:false,
    update(dt){
      st.t += dt; st.evT += dt;
      st.shake = Math.max(0, st.shake-dt);
      st.flash = Math.max(0, st.flash-dt);
      st.hintT = Math.max(0, st.hintT-dt);
      if (st.idx < questions.length) st.n = questions[st.idx].a.length;
      st.total = questions.length;
      updateParts(dt);
      for (const L of st.lanterns){ L.y -= dt*L.v; }
      if (st.lanterns.length > 24) st.lanterns.splice(0, st.lanterns.length-24);

      if (st.state === 'score'){
        if (st.evT > 0.7 && (just.a || just.click)){ popScene(); onDone(); }
        return;
      }

      if (st.state === 'ask'){
        const n = q().a.length;
        // hover / click
        st.hover = -1;
        for (let i=0;i<n;i++){
          const r = rowRect(i,n);
          if (hoverIn(r.x, r.y, r.w, r.h)) st.hover = i;
          if (clickIn(r.x, r.y, r.w, r.h)){ st.sel = i; answer(i); return; }
        }
        if (just.up){   do { st.sel=(st.sel+n-1)%n; } while (st.dead.includes(st.sel) && st.dead.length<n-1); SFX.blip(); }
        if (just.down){ do { st.sel=(st.sel+1)%n;   } while (st.dead.includes(st.sel) && st.dead.length<n-1); SFX.blip(); }
        if (just.a){ answer(st.sel); return; }
        // the lantern timer: when it burns down, Lóng burns away a wrong answer
        st.time += dt;
        if (st.time >= st.limit){
          st.time = 0; st.firstTry = false; st.streak = 0;
          const wrongLeft = [];
          for (let i=0;i<n;i++) if (i !== q().correct && !st.dead.includes(i)) wrongLeft.push(i);
          if (wrongLeft.length > 1){
            st.dead.push(pick(wrongLeft));
            st.hintT = 2.4; SFX.sparkle(); st.flash = 0.2;
            if (st.dead.includes(st.sel)) st.sel = q().correct;
          }
        }
        return;
      }

      // right / wrong panels
      if ((just.a || just.click) && st.evT > 0.45){
        if (st.state === 'right') nextQ();
        else { st.state = 'ask'; st.time = 0; }
      }
    },

    render(){
      const sh = st.shake>0 ? Math.sin(st.t*70)*2 : 0;
      cx.save(); cx.translate(sh*P, 0);

      /* ---- night sky ---- */
      R(0,0,LW,LH,'#141830');
      R(0,0,LW,64,'#101426');
      for (let i=0;i<54;i++){
        const hx = thash(i,7)*LW, hy = thash(i,13)*110;
        if (Math.sin(st.t*1.7+i*1.3) > -0.45) R(hx, hy, 1.4, 1.4, i%5 ? '#e8e4f4' : '#cfe4f4');
      }
      if (opts.moon) drawMoon(282, 50, 13, 0);
      for (const L of st.lanterns) riseLantern(L, st.t);
      // rooftops, kept below everything the player has to read
      for (let i=0;i<5;i++){
        const bx = i*68 - 8;
        R(bx, 162, 52, 8, '#2a2438'); R(bx-3, 159, 58, 4, '#3a3050');
        if (i%2===0) R(bx+14, 164, 6, 4, 'rgba(242,182,50,0.45)');
      }
      R(0,170,LW,10,'#1c2618');
      drawParts(0,0);

      mgHeader(opts.title, opts.sub);

      /* ---- score card ---- */
      if (st.state === 'score'){
        const pct = st.clean / questions.length;
        const [g,c] = pct >= 0.99 ? ['FLAWLESS!', '#7ce87c'] :
                      pct >= 0.5  ? ['WELL DONE', '#ffe9b0'] : ['YOU GOT THERE', '#f2b632'];
        box(52, 44, 216, 86);
        T(g, 160, 51, 9.4, c, 'center');
        T(st.clean + ' / ' + questions.length + ' on the first try', 160, 68, 6.6, '#f4e8d0','center');
        T('best streak: ' + st.best, 160, 79, 6, '#ffe9b0','center');
        const lit = Math.round(pct*10);
        for (let i=0;i<10;i++) R(96+i*13, 90, 9, 7, i<lit ? '#f2b632' : 'rgba(244,232,208,0.14)');
        T(opts.lanterns ? 'Every right answer sent a lantern up.'
                        : 'Lóng nods — the story is safe with you.', 160, 104, 5.6, '#cfc0a8','center');
        T('CLICK to continue', 160, 118, 5.4, '#9a8c78','center');
        cx.restore();
        return;
      }

      const Q = q(), n = Q.a.length;

      /* ---- question card ---- */
      const ql = wrap(Q.q, 258, 6.2);
      box(26, 40, 268, ql.length*9+10);
      let yy = 45; for (const ln of ql){ T(ln, 160, yy, 6.2, '#f4e8d0','center'); yy += 9; }

      /* ---- answers ---- */
      for (let i=0;i<n;i++){
        const r = rowRect(i,n);
        const gone = st.dead.includes(i);
        const on = (i===st.sel || i===st.hover) && !gone;
        box(r.x, r.y, r.w, r.h, {
          border: gone ? '#3a3040' : on ? '#f2b632' : '#6a5a48',
          bg:     gone ? 'rgba(14,10,18,0.75)' : on ? 'rgba(60,36,20,0.95)' : 'rgba(20,12,16,0.85)'
        });
        const letter = ['A','B','C','D'][i];
        R(r.x+3, r.y+2, 9, 9, gone ? '#2a2430' : on ? '#f2b632' : '#4a3a3e');
        T(letter, r.x+7.5, r.y+3.4, 5.4, gone ? '#6a5a68' : on ? '#2b1a26' : '#cfc0a8', 'center');
        T(Q.a[i], r.x+17, r.y+3.4, 6.2, gone ? '#5a4e58' : on ? '#ffe9b0' : '#cfc0a8');
        if (gone){
          for (let k=0;k<r.w;k+=4) R(r.x+k, r.y+r.h/2, 3, 1.4, 'rgba(255,138,112,0.45)');
          T('burned away', r.x+r.w-4, r.y+3.4, 5, '#8a5a58', 'right');
        }
      }

      /* ---- Lóng's lantern timer + streak ---- */
      /* timer + streak band, always in the same place */
      const left = clamp(1 - st.time/st.limit, 0, 1);
      T("Lóng's lantern", 40, 142, 5, '#9a8c78');
      R(40, 149, 168, 7, 'rgba(20,12,16,0.85)');
      R(40, 149, 168*left, 7, left > 0.45 ? '#7ce87c' : left > 0.2 ? '#f2b632' : '#ff8a70');
      R(40, 149, 168, 1, '#4a3a3e');
      if (st.state === 'ask' && left < 0.25) T('hint coming…', 212, 150, 5, '#ffd0a0');
      if (st.streak >= 2){
        R(220, 140, 62, 16, 'rgba(242,182,50,0.18)');
        R(220, 140, 62, 1, '#f2b632');
        T('STREAK ×'+st.streak, 251, 144, 5.6, '#ffe9b0','center');
      }
      T('CLICK an answer  ·  or ▲▼ and Z', 160, 172, 5.2, '#9a8c78','center');
      T((st.idx+1)+' / '+questions.length, 300, 172, 5.2, '#9a8c78','center');

      if (st.hintT > 0 && st.state === 'ask'){
        box(72, 122, 176, 15, {border:'#ffd964'});
        T('Lóng burned away a wrong answer!', 160, 126, 5.8, '#ffe98a','center');
      }

      /* the result reads as a panel laid over the board, so nothing collides */
      if (st.state === 'right' || st.state === 'wrong'){
        cx.globalAlpha = 0.62; R(0,0,LW,LH,'#0c0a14'); cx.globalAlpha = 1;
        if (st.state === 'right'){
          const yl = wrap(Q.yay, 236, 5.8);
          const h = yl.length*8 + 34;
          box(34, 90-h/2+20, 252, h, {border:'#7ce87c'});
          let y2 = 90-h/2+26;
          T('CORRECT', 160, y2, 8, '#7ce87c','center'); y2 += 14;
          for (const ln of yl){ T(ln, 160, y2, 5.8, '#c8f4c0','center'); y2 += 8; }
          T('CLICK to go on', 160, y2+4, 5, '#9a8c78','center');
        } else {
          box(48, 92, 224, 42, {border:'#ff8a70'});
          T('NOT THAT ONE', 160, 98, 8, '#ff8a70','center');
          T('think again — that answer is out now', 160, 112, 5.8, '#ffd0c0','center');
          T('CLICK to retry', 160, 122, 5.2, '#cfc0a8','center');
        }
      }

      if (st.flash>0){ cx.globalAlpha = st.flash*0.4; R(0,0,LW,LH,'#ffe98a'); cx.globalAlpha = 1; }
      cx.restore();
    }
  };
}
/* ============================================================
   UNCLE BO'S DOOR — three hands-on stages
     1. INK & BRUSH   write the character 福 stroke by stroke
     2. HANG THEM     paste the spring couplets straight
     3. THE FLIP      decide which way up 福 goes  (dào = arrives)
   ============================================================ */

function inkSfx(){ noiseHit(0.14, 0.16); tone(240, 0.1, 'triangle', 0.12); }
function pasteSfx(){ noiseHit(0.1, 0.2); tone(420, 0.08, 'sine', 0.16); tone(560, 0.09, 'sine', 0.12, 0.05); }

/* the six brush strokes that build 福 */
const FU_STROKES = [
  { dir:'right', x:126, y:56, w:68, h:13, label:'held ▶' },
  { dir:'down',  x:126, y:56, w:17, h:60, label:'held ▼' },
  { dir:'right', x:126, y:70, w:68, h:12, label:'held ▶' },
  { dir:'down',  x:176, y:56, w:18, h:60, label:'held ▼' },
  { dir:'right', x:126, y:83, w:68, h:13, label:'held ▶' },
  { dir:'right', x:126, y:97, w:68, h:19, label:'held ▶' },
];
const ARROW_OF = { right:'▶', left:'◀', up:'▲', down:'▼' };

function drawDoorPanel(t){
  // a doorway to decorate
  R(126, 50, 68, 96, '#2b1a26');
  R(128, 52, 64, 92, '#efe0c2');
  R(130, 54, 60, 88, '#4a2c1c');
  R(130, 54, 60, 2, '#2e1a10');
  R(159, 54, 2, 88, '#5a3828');
  R(136, 60, 20, 30, '#5a3828'); R(164, 60, 20, 30, '#5a3828');
  circle(154, 104, 2.4, '#c07c1c'); circle(166, 104, 2.4, '#c07c1c');
  R(120, 44, 80, 7, '#2b1a26');
  R(122, 45, 76, 5, '#7a5a40');
  drawRoof(126, 42, 68);
}

function makeDoorGame(onDone){
  const st = {
    stage:1, t:0, evT:0, msg:'', msgT:0, msgC:'#ffe9b0',
    // stage 1
    si:0, prog:0, wrongT:0, brushX:0, brushY:0,
    // stage 2
    papers:[
      { name:'left couplet',  tx:118, ty:100, w:13, h:60, x:60,  y:150, vertical:true,  chars:'春满乾坤' },
      { name:'right couplet', tx:202, ty:100, w:13, h:60, x:262, y:150, vertical:true,  chars:'福满门庭' },
      { name:'top banner',    tx:160, ty:37,  w:60, h:13, x:160, y:158, vertical:false, chars:'迎春接福' },
    ],
    pi:0, wob:0, placed:[],
    // stage 3
    rot:0, tries:0,
    done:false,
  };
  window.BODOOR = st;
  function say2(m,c){ st.msg=m; st.msgT=1.3; st.msgC=c||'#ffe9b0'; }

  return {
    update(dt){
      st.t += dt; st.evT += dt;
      st.msgT = Math.max(0, st.msgT-dt);
      st.wrongT = Math.max(0, st.wrongT-dt);
      st.wob += dt;
      updateParts(dt);

      /* ---------- stage 1: write 福 ---------- */
      if (st.stage===1){
        const s = FU_STROKES[st.si];
        if (!s) return;
        const held = keys[s.dir];
        const anyOther = ['up','down','left','right'].some(k=> k!==s.dir && keys[k]);
        // the mouse writes: hold and drag along the glowing stroke
        let dragging = false;
        if (mouse.down){
          const along = s.dir==='right' ? (mouse.x - s.x)/s.w : (mouse.y - s.y)/s.h;
          const lat   = s.dir==='right' ? Math.abs(mouse.y - (s.y+s.h/2)) : Math.abs(mouse.x - (s.x+s.w/2));
          if (lat < 17 && along > st.prog - 0.12){
            const target = clamp(along, 0, 1);
            if (target > st.prog){ st.prog = Math.min(target, st.prog + dt*3.2); dragging = true; }
          }
        }
        if (held || dragging){
          if (held) st.prog += dt * 1.55;
          if (Math.random()<0.5) spawnPart({ x:st.brushX+rnd(-2,2), y:st.brushY+rnd(-2,2), vx:0, vy:rnd(4,12),
                                             g:0, life:0.4, t:0, c:'#2b1a26', sz:1.4 });
          if (st.prog>=1){
            st.prog = 0; st.si++; inkSfx();
            burst(st.brushX, st.brushY, ['#2b1a26','#5a4048'], 8, 24);
            if (st.si >= FU_STROKES.length){
              st.stage = 2; st.evT = 0; SFX.good();
              say2('Beautiful! Now hang them.', '#7ce87c');
            } else say2(pick(['ink flows…','good hand!','keep going']), '#cfc0a8');
          }
        } else if (anyOther){ st.wrongT = 0.2; }
        return;
      }

      /* ---------- stage 2: hang the couplets ---------- */
      if (st.stage===2){
        const p = st.papers[st.pi];
        if (!p) return;
        const sp = 78;
        if (mouse.over && mouse.down){                 // hold the mouse: carry the paper
          p.x += (mouse.x - p.x)*Math.min(1, dt*12);
          p.y += (mouse.y - p.y)*Math.min(1, dt*12);
          p.wasHeld = true;
        } else if (!mouse.down) { if (p.wasHeld) p.justReleased = true; }
        if (keys.left)  p.x -= sp*dt;
        if (keys.right) p.x += sp*dt;
        if (keys.up)    p.y -= sp*dt;
        if (keys.down)  p.y += sp*dt;
        p.x = clamp(p.x, 20, 300); p.y = clamp(p.y, 26, 168);
        // paper sways a little in your hands
        const swx = Math.sin(st.wob*2.3)*1.6, swy = Math.cos(st.wob*1.9)*1.2;
        p.sx = p.x + swx; p.sy = p.y + swy;
        if (just.a || just.click || (p.wasHeld && !mouse.down && dist(p.sx,p.sy,p.tx,p.ty) < 9)){
          const off = dist(p.sx, p.sy, p.tx, p.ty);
          if (off < 9){
            pasteSfx(); SFX.good();
            st.placed.push({ ...p, x:p.tx, y:p.ty });
            burst(p.tx, p.ty, ['#f2b632','#ffe98a'], 14, 34);
            st.pi++;
            if (st.pi >= st.papers.length){ st.stage=3; st.evT=0; say2('Now the big one…', '#ffe9b0'); }
            else say2(pick(['Straight as a ruler!','Perfect!','That is the one.']), '#7ce87c');
          } else {
            SFX.bad(); st.wrongT = 0.3;
            say2(off < 22 ? 'Almost — line it up!' : 'CROOKED! Try again.', '#ff8a70');
          }
        }
        return;
      }

      /* ---------- stage 3: which way up? ---------- */
      if (st.stage===3){
        if (st.done){
          if (st.evT>2.6 || ((just.a || just.click) && st.evT>1.2)){ popScene(); onDone(); }
          return;
        }
        if (keys.left)  st.rot -= 150*dt;
        if (keys.right) st.rot += 150*dt;
        if (mouse.down && hoverIn(88, 82, 24, 28))  st.rot -= 150*dt;   // ⟲ button
        if (mouse.down && hoverIn(208, 82, 24, 28)) st.rot += 150*dt;   // ⟳ button
        st.rot = (st.rot % 360 + 360) % 360;
        const wantPaste = just.a || clickIn(112, 130, 96, 15);
        if (wantPaste){
          const upsideDown = Math.abs(st.rot - 180) < 32;
          if (upsideDown){
            st.done = true; st.evT = 0; st.rot = 180;
            SFX.gong(); SFX.win();
            burst(160, 96, ['#f2b632','#ff5838','#ffe98a','#7ce87c'], 50, 90);
          } else {
            st.tries++; SFX.bad(); st.wrongT = 0.35;
            say2(st.tries===1 ? 'Uncle Bo: "Wait wait wait — THINK."'
               : st.tries===2 ? '"dào = upside down. dào = ARRIVES."'
               : '"Spin it all the way over, kid!"', '#ff8a70');
          }
        }
      }
    },

    render(){
      const shx = st.wrongT>0 ? Math.round(Math.sin(st.t*60)*2) : 0;
      cx.save(); cx.translate(shx*P, 0);
      // street at night
      R(0,0,LW,LH,'#241a2c');
      R(0,146,LW,34,'#3a2a20');
      for (let i=0;i<LW;i+=16) cobbleTile(i, 146, i/16, 9, COB_P);
      R(0,44,LW,102,'#7a5a40');
      for (let i=0;i<LW;i+=24) R(i, 44, 1, 102, 'rgba(0,0,0,0.12)');
      drawLantern(66, 44, 1.1, true, st.t);
      drawLantern(254, 44, 1.1, true, st.t+1.4);
      drawDoorPanel(st.t);
      drawPerson(84, 150, {...NPCS.bo.look, dir:'right'}, st.t);
      drawPerson(232, 152, {...playerLook(), dir:'left'}, st.t);

      /* stage 1 — the paper on a table */
      if (st.stage===1){
        R(114, 44, 92, 84, '#2b1a26');
        R(116, 46, 88, 80, '#f7edd6');
        for(let i=0;i<12;i++){ const h=thash(i,17); R(118+(h*84)%84, 48+(h*61)%76, 1, 1, '#e6d9bb'); }
        hanzi('福', 160, 86, 46, 'rgba(120,100,90,0.20)');           // faint guide
        // revealed ink
        cx.save();
        cx.beginPath();
        for (let i=0;i<st.si;i++){ const b = FU_STROKES[i]; cx.rect(b.x*P, b.y*P, b.w*P, b.h*P); }
        const cur = FU_STROKES[st.si];
        if (cur){
          const grow = st.prog;
          if (cur.dir==='right') cx.rect(cur.x*P, cur.y*P, cur.w*grow*P, cur.h*P);
          else cx.rect(cur.x*P, cur.y*P, cur.w*P, cur.h*grow*P);
        }
        cx.clip();
        hanzi('福', 160, 86, 46, '#241a20');
        cx.restore();
        // the current stroke glows so you know where to drag
        if (cur){
          cx.globalAlpha = 0.22 + Math.sin(st.t*5)*0.08;
          R(cur.x-2, cur.y-2, cur.w+4, cur.h+4, '#f2b632');
          cx.globalAlpha = 1;
          // start dot at the stroke's beginning
          const sx0 = cur.x + (cur.dir==='right' ? 0 : cur.w/2);
          const sy0 = cur.y + (cur.dir==='right' ? cur.h/2 : 0);
          if (st.prog < 0.05) circle(sx0, sy0, 2.4, Math.sin(st.t*7)>0 ? '#7ce87c' : '#4a8a4a');
        }
        // brush
        if (cur){
          st.brushX = cur.dir==='right' ? cur.x + cur.w*st.prog : cur.x + cur.w/2;
          st.brushY = cur.dir==='right' ? cur.y + cur.h/2 : cur.y + cur.h*st.prog;
          R(st.brushX-1, st.brushY-22, 2.6, 17, '#8a6a48');
          R(st.brushX-1.6, st.brushY-6, 3.6, 7, '#2b1a26');
          circle(st.brushX, st.brushY, 2, '#2b1a26');
          // prompt
          const a = ARROW_OF[cur.dir];
          T('HOLD the mouse & DRAG along the glow', 160, 132, 6.2, mouse.down ? '#7ce87c' : (Math.sin(st.t*6)>0?'#ffe9b0':'#c8a860'), 'center');
          T('(or hold '+a+' on the keyboard)', 160, 142, 5, '#8a7c6a', 'center');
        }
        // ink progress pips
        for (let i=0;i<FU_STROKES.length;i++)
          R(134+i*8, 152, 6, 3, i < st.si ? '#f2b632' : '#5a4a3a');
      }

      /* stages 2 & 3 — the door */
      if (st.stage>=2){
        for (const p of st.placed) drawCouplet(p.x, p.y, p.w, p.h, p.vertical, p.chars);
        // ghost targets for the piece in hand
        if (st.stage===2){
          const p = st.papers[st.pi];
          if (p){
            cx.globalAlpha = 0.35 + Math.sin(st.t*4)*0.12;
            R(p.tx-p.w/2, p.ty-p.h/2, p.w, p.h, '#f2b632');
            cx.globalAlpha = 1;
            drawCouplet(p.sx, p.sy, p.w, p.h, p.vertical, p.chars);
            const off = dist(p.sx, p.sy, p.tx, p.ty);
            T(off<9 ? 'CLICK — PASTE IT!' : 'line it up…', 160, 160, 6.4, off<9 ? '#7ce87c' : '#cfc0a8', 'center');
          }
        }
        if (st.stage===3){
          const rad = st.rot*Math.PI/180;
          if (!st.done && Math.abs(((st.rot % 360) + 360) % 360 - 180) < 32) glow(160, 96, 22, '#7ce87c', 0.25);
          cx.save();
          cx.translate(160*P, 96*P); cx.rotate(rad);
          R(-13, -13, 26, 26, '#2b1a26');
          R(-12, -12, 24, 24, '#d43424');
          R(-11.5, -11.5, 23, 2, '#f06848');
          hanzi('福', 0, 0, 17, '#f2b632');
          cx.restore();
          if (!st.done){
            const off = Math.abs(((st.rot % 360) + 360) % 360 - 180);
            const lined = off < 32;
            // rotate buttons
            for (const [bx2, gdir] of [[88,'L'],[208,'R']]){
              const hov = hoverIn(bx2, 82, 24, 28);
              box(bx2, 82, 24, 28, {border: hov ? '#f2b632' : '#6a5a48', bg: hov ? 'rgba(60,36,20,0.95)' : 'rgba(20,12,16,0.8)'});
              arrowGlyph(bx2+8, 92, gdir, hov ? '#ffe9b0' : '#cfc0a8');
              T('hold', bx2+12, 102, 4.2, '#8a7c6a', 'center');
            }
            // paste button — lights up when the fú is the lucky way up
            const hp2 = hoverIn(112, 130, 96, 15);
            box(112, 130, 96, 15, {border: lined ? '#7ce87c' : hp2 ? '#f2b632' : '#6a5a48',
                                   bg: lined ? 'rgba(30,70,30,0.92)' : 'rgba(20,12,16,0.85)'});
            T(lined ? 'PASTE IT!' : 'paste…', 160, 134, 6.6, lined ? '#7ce87c' : '#cfc0a8', 'center');
            // the reason, right on screen
            R(0, 148, LW, 32, 'rgba(12,8,16,0.78)');
            R(0, 148, LW, 1, 'rgba(242,182,50,0.35)');
            T('TIP: “upside down” is dào 倒 — and “ARRIVES” is dào 到.', 160, 152, 5.2, '#ffe9b0', 'center');
            T('Same sound! Hang it so the fú SAYS fortune arrives…', 160, 161, 5.2, '#cfc0a8', 'center');
            T('turn with the buttons or ◀ ▶  ·  Z also pastes', 160, 171, 4.6, '#8a7c6a', 'center');
          }
        }
      }
      drawParts(0,0);
      cx.restore();

      /* HUD */
      const titles = {1:'INK & BRUSH', 2:'HANG THE COUPLETS', 3:'WHICH WAY UP?'};
      const subs = {1:'hold & DRAG the brush along the glowing stroke', 2:'drag each paper to its spot', 3:'hang it the LUCKY way — dào 倒 = dào 到'};
      mgHeader("UNCLE BO'S DOOR", subs[st.stage]);
      T(titles[st.stage], 10, 30, 6, '#f2b632');
      T('STAGE '+st.stage+' / 3', 312, 30, 5.4, '#8a7c6a', 'right');
      if (st.stage===3 && st.done){
        box(28, 54, 264, 52);
        T('FORTUNE HAS ARRIVED!', LW/2, 60, 8.4, '#f2b632','center');
        T('“Upside down” (dào) sounds just like “arrives” (dào) —', LW/2, 76, 5.4, '#f4e8d0','center');
        T('so an upside-down 福 shouts it to the whole street.', LW/2, 86, 5.4, '#f4e8d0','center');
        T('CLICK', LW/2, 96, 5.6, '#cfc0a8','center');
      }
      if (st.msgT>0 && !(st.stage===3&&st.done)) T(st.msg, LW/2, 120, 6.6, st.msgC, 'center');
    }
  };
}

function drawCouplet(x, y, w, h, vertical, chars){
  R(x-w/2-1, y-h/2-1, w+2, h+2, '#2b1a26');
  R(x-w/2, y-h/2, w, h, '#d43424');
  R(x-w/2, y-h/2, w, 1.4, '#f06848');
  const n = chars.length;
  for (let i=0;i<n;i++){
    if (vertical) hanzi(chars[i], x, y-h/2+ (h/n)*(i+0.5), 8, '#f2b632');
    else hanzi(chars[i], x-w/2 + (w/n)*(i+0.5), y, 8, '#f2b632');
  }
}
/* ============================================================
   BRIEFING CARDS — every game explains itself before it starts:
   what the tradition is, the numbered steps you will actually
   do, and the controls. Nothing starts until you press GOT IT.
   ============================================================ */
/* the font has no arrow glyphs, so draw them as real pixels: 7x7 box */
function arrowGlyph(x, y, dir, color){
  if (dir === 'U') for (let i=0;i<4;i++) R(x+3-i, y+1+i, 1+2*i, 1, color);
  if (dir === 'D') for (let i=0;i<4;i++) R(x+i,   y+1+i, 7-2*i, 1, color);
  if (dir === 'L') for (let i=0;i<4;i++) R(x+1+i, y+3-i, 1, 1+2*i, color);
  if (dir === 'R') for (let i=0;i<4;i++) R(x+1+i, y+i,   1, 7-2*i, color);
}
/* label may be plain text, or '#LRUD' to draw arrow keys */
function keyBadge(x, y, label, w){
  const glyphs = label[0] === '#' ? label.slice(1).split('') : null;
  const bw = w || (glyphs ? glyphs.length*8 + 4 : textW(label, 5.4) + 8);
  R(x-1, y-1, bw+2, 13, '#2b1a26');
  R(x, y, bw, 11, '#4a3a4e');
  R(x, y, bw, 2, '#6a5a6e');
  R(x, y+9, bw, 2, '#2b1a26');
  if (glyphs){
    let gx = x + (bw - (glyphs.length*8 - 1))/2;
    for (const g of glyphs){ arrowGlyph(gx, y+2, g, '#ffe9b0'); gx += 8; }
  } else T(label, x+bw/2, y+2.6, 5.4, '#ffe9b0', 'center');
  return bw;
}
/* a small numbered chip for the step list */
function stepChip(x, y, n, accent){
  R(x, y, 9, 9, accent);
  R(x, y, 9, 1, '#ffe9b0');
  T(String(n), x+4.5, y+1.6, 5.2, '#2b1a26', 'center');
}
/* cfg: { title, sub, what:[], steps:[], extra:[], keys:[[key,meaning]], art(t), color } */
const BTN = { x: 111, y: 150, w: 98, h: 16 };
function makeBriefing(cfg, makeScene){
  let t = 0;
  return {
    usesDash: true,
    enter(){ window.INBRIEF = true; },
    update(dt){
      t += dt; updateParts(dt);
      const hit = clickIn(BTN.x, BTN.y, BTN.w, BTN.h);
      if ((just.a || just.dash || hit) && t > 0.35){
        SFX.select(); window.INBRIEF = false; popScene(); pushScene(makeScene());
      }
    },
    render(){
      R(0,0,LW,LH,'#140f22');
      for (let i=0;i<40;i++){ const h=thash(i,5); R(h*LW, thash(i,11)*LH, 1, 1, 'rgba(232,228,244,0.35)'); }
      const accent = cfg.color || '#f2b632';
      box(12, 4, 296, 172, { border: accent, bg:'rgba(18,12,24,0.96)' });
      Tsh(cfg.title, LW/2, 8, 8.6, accent, 'center');
      if (cfg.sub) T(cfg.sub, LW/2, 18, 5, '#cfc0a8', 'center');
      R(20, 27, 280, 1, accent);

      /* ---------- left column: picture, then controls ---------- */
      R(20, 31, 80, 52, 'rgba(0,0,0,0.4)');
      R(20, 31, 80, 1, 'rgba(255,255,255,0.14)');
      cx.save();
      cx.beginPath(); cx.rect(20*P, 31*P, 80*P, 52*P); cx.clip();
      if (cfg.art) cfg.art(t);
      cx.restore();

      T('CONTROLS', 20, 88, 5, accent);
      R(20, 95, 80, 1, 'rgba(255,255,255,0.14)');
      let ky = 100;
      for (const [k, meaning] of (cfg.keys || [])){
        if (k){ keyBadge(20, ky-1, k, 34); T(meaning, 58, ky, 4.8, '#cfc0a8'); }
        else T(meaning, 24, ky, 4.6, '#8a7c6a');
        ky += 12;
      }

      /* ---------- right column: what it is, then the steps ---------- */
      const RX = 108;
      let yy = 32;
      for (const line of (cfg.what || [])){ T(line, RX, yy, 5.2, '#f4e8d0'); yy += 8.4; }

      if (cfg.steps && cfg.steps.length){
        yy += 3;
        T('HOW TO PLAY', RX, yy, 5, accent); yy += 7;
        R(RX, yy, 192, 1, 'rgba(255,255,255,0.14)'); yy += 4;
        cfg.steps.forEach((s, i)=>{
          stepChip(RX, yy-1, i+1, accent);
          T(s, RX+13, yy+0.6, 5.0, '#e8dcc4');
          yy += 10.4;
        });
      }

      /* ---------- the note (lives, pickups) — only if it fits ---------- */
      if (cfg.extra){
        const h = cfg.extra.length*7.6 + 6;
        if (yy + h <= 147){
          R(RX, yy, 192, h, 'rgba(242,182,50,0.12)');
          R(RX, yy, 192, 1, 'rgba(242,182,50,0.45)');
          let ey = yy + 4;
          for (const line of cfg.extra){ T(line, RX+3, ey, 4.6, '#ffe9b0'); ey += 7.6; }
        }
      }

      /* ---------- GOT IT ---------- */
      const hov = hoverIn(BTN.x, BTN.y, BTN.w, BTN.h);
      const pulse = hov || Math.sin(t*4) > 0;
      R(BTN.x-2, BTN.y-2, BTN.w+4, BTN.h+4, '#2b1a26');
      R(BTN.x, BTN.y, BTN.w, BTN.h, pulse ? accent : '#a8792a');
      R(BTN.x, BTN.y, BTN.w, 2, '#ffe9b0');
      R(BTN.x, BTN.y+BTN.h-2, BTN.w, 2, 'rgba(0,0,0,0.3)');
      T('GOT IT!', LW/2, BTN.y+4, 7.4, '#2b1a26', 'center');
      T('CLICK it  ·  or Z / SPACE', LW/2, BTN.y+18, 4.4, '#8a7c6a', 'center');
      drawParts(0,0);
    }
  };
}

/* ============================================================
   HOW TO PLAY — the controls card shown at the very start,
   and any time from the title menu.
   ============================================================ */
function makeHowToCard(onDone, btnLabel){
  let t = 0;
  const label = btnLabel || 'GOT IT!';
  const bw = Math.min(250, Math.round(textW(label, 7)) + 28);
  const btn = { x: 160 - bw/2, y: 149, w: bw, h: 16 };
  const ROWS = [
    ['#LRUD', 'walk around  (WASD works too)'],
    ['E',     'talk to people · use things'],
    ['CLICK', 'press buttons · attack toward the cursor'],
    ['Z',     '✓ confirm — same as E almost everywhere'],
    ['SPACE', 'dash! quick burst, dodges attacks'],
    ['X',     '✕ back  ·  special move in one fight'],
    ['J',     'your journal of Wisdom Scrolls'],
    ['M',     'mute or unmute the music'],
  ];
  return {
    usesDash: true,
    enter(){ window.INHOWTO = true; },
    exit(){ window.INHOWTO = false; },
    update(dt){
      t += dt; updateFade(dt); updateParts(dt);
      // mouse only — the game starts by proving the mouse works
      if (clickIn(btn.x, btn.y, btn.w, btn.h) && t > 0.35){
        SFX.select(); window.INHOWTO = false; onDone();
      }
    },
    render(){
      R(0,0,LW,LH,'#140f22');
      for (let i=0;i<40;i++){ const h=thash(i,5); R(h*LW, thash(i,11)*LH, 1, 1, 'rgba(232,228,244,0.35)'); }
      const accent = '#f2b632';
      box(12, 4, 296, 172, { border: accent, bg:'rgba(18,12,24,0.96)' });
      Tsh('HOW TO PLAY', LW/2, 8, 8.6, accent, 'center');
      T('everything you need — E does most of it', LW/2, 18, 5, '#cfc0a8', 'center');
      R(20, 27, 280, 1, accent);

      /* two columns of controls */
      let ky = 34;
      ROWS.forEach((row, i)=>{
        const col = i % 2, x0 = col ? 168 : 22;
        keyBadge(x0, ky-1, row[0], 34);
        const words = wrap(row[1], 100, 4.8);
        let wy = ky + (words.length>1 ? -2 : 1);
        for (const ln of words){ T(ln, x0+38, wy, 4.8, '#e8dcc4'); wy += 6.6; }
        if (col) ky += 15;
      });

      R(20, 96, 280, 1, 'rgba(255,255,255,0.14)');
      T('GOOD TO KNOW', 22, 100, 5, accent);
      T('· Every minigame and boss fight shows its own card', 22, 109, 5.0, '#cfc0a8');
      T('  first — read the steps, then press GOT IT.', 22, 116, 5.0, '#cfc0a8');
      T('· The game saves by itself. CONTINUE on the title', 22, 124, 5.0, '#cfc0a8');
      T('  screen picks up right where you left.', 22, 131, 5.0, '#cfc0a8');
      T('· Collect all 16 Wisdom Scrolls — press J to read them.', 22, 139, 5.0, '#cfc0a8');

      /* the ready button — mouse only */
      const hov = hoverIn(btn.x, btn.y, btn.w, btn.h);
      const pulse = hov || Math.sin(t*4) > 0;
      R(btn.x-2, btn.y-2, btn.w+4, btn.h+4, '#2b1a26');
      R(btn.x, btn.y, btn.w, btn.h, pulse ? accent : '#a8792a');
      R(btn.x, btn.y, btn.w, 2, '#ffe9b0');
      R(btn.x, btn.y+btn.h-2, btn.w, 2, 'rgba(0,0,0,0.3)');
      T(label, LW/2, btn.y+5, 7, '#2b1a26', 'center');
      T('click it with your mouse!', LW/2, btn.y+18, 4.4, '#8a7c6a', 'center');
      drawParts(0,0);
      drawFade();
    }
  };
}

function titleRow(i){ return { x: LW/2-62, y: 93+i*13, w: 124, h: 13 }; }
const titleScene = {
  sel:0,
  enter(){ playMusic(0); this.save = loadGame(); },
  update(dt){
    updateFade(dt); updateParts(dt);
    const opts = this.menu();
    if (just.up){ this.sel=(this.sel+opts.length-1)%opts.length; SFX.blip(); }
    if (just.down){ this.sel=(this.sel+1)%opts.length; SFX.blip(); }
    let picked = false;
    for (let i=0;i<opts.length;i++){
      const r = titleRow(i);
      if (hoverIn(r.x, r.y, r.w, r.h) && this.sel !== i){ this.sel = i; SFX.blip(); }
      if (clickIn(r.x, r.y, r.w, r.h)){ this.sel = i; picked = true; }
    }
    if (just.a || picked){
      SFX.select();
      const o = opts[this.sel];
      if (o==='NEW GAME'){
        clearSave(); G.ch=0; G.step=0; G.scrolls=[]; G.flags={};

        const s=this.save; G.name=s.name; G.ch=Math.max(1,s.ch); G.step=s.step; G.scrolls=s.scrolls||[];

/* ---------- home scene (intro + ending) ---------- */
const homeScene = {
  mode:'intro', px:160, py:140, dir:'up', walking:false, started:false,
  usesDash:true,
  dashT:0, dashCd:0, dashVX:0, dashVY:0,
  enter(){ playMusic(0); this.started=false; this.px=160; this.py=146; this.dashT=0; this.dashCd=0; },
  update(dt){
    updateFade(dt); updateParts(dt);
    if (DLG.active){ dlgUpdate(dt); return; }
    if (!this.started){
      this.started = true;
      if (this.mode==='intro') this.introTalk();
      else this.endingTalk();
      return;
    }
    // free walk
    let vx=0,vy=0;
    if (keys.left)vx=-1; else if(keys.right)vx=1;
    if (keys.up)vy=-1; else if(keys.down)vy=1;
    this.walking=!!(vx||vy);
    if (vx&&vy){vx*=.707;vy*=.707;}
    if (vx<0)this.dir='left'; else if(vx>0)this.dir='right'; else if(vy<0)this.dir='up'; else if(vy>0)this.dir='down';
    // dash, same feel as the village
    this.dashCd = Math.max(0, this.dashCd - dt);
    this.dashT  = Math.max(0, this.dashT - dt);
    if (just.dash && this.dashCd<=0){
      let dxv = vx, dyv = vy;
      if (!dxv && !dyv){

/* clickable band for journal row i */
function jRow(i){
  const perCol = 9, colW = 140;
  return { x: 23+Math.floor(i/perCol)*colW, y: 38.5+(i%perCol)*13, w: colW-8, h: 12 };
}
function makeJournal(){
  let sel=0, mode='list', page=0;
  const entries = SCROLL_ORDER.map(id=>({id, got:G.scrolls.includes(id)}));
  return {
    overlay:true,
    update(dt){
      if (mode==='read'){
        if (just.a || just.b || just.click){ mode='list'; SFX.back(); }
        return;
      }
      if (mode==='sources'){
        if (just.a || just.b || just.click){ mode='list'; SFX.back(); }
        return;
      }
      const n = entries.length+1;
      if (just.up){ sel=(sel+n-1)%n; SFX.blip(); }
      if (just.down){ sel=(sel+1)%n; SFX.blip(); }
      let hit = false;
      for (let i=0;i<n;i++){
        const r = jRow(i);
        if (hoverIn(r.x, r.y, r.w, r.h) && sel !== i){ sel = i; SFX.blip(); }
        if (clickIn(r.x, r.y, r.w, r.h)){ sel = i; hit = true; }
      }
      if (just.a || hit){
        if (sel===entries.length){ mode='sources'; SFX.select(); }
        else if (entries[sel].got){ mode='read'; SFX.select(); }
        else SFX.bad();
      }
      if (just.b || just.journal){ popScene(); SFX.back(); }
    },
    render(){
      cx.fillStyle='rgba(8,6,12,0.88)'; cx.fillRect(0,0,LW*P,LH*P);
      if (mode==='read'){
        const s = SCROLLS[entries[sel].id];
        box(30, 20, 260, 140, {border:'#c8a860', bg:'#f0e4c8'});
        drawScrollItem(50, 42, G.time);
        T(s.title, 64, 28, 7.4, '#7a2418');
        R(40, 44, 240, 1, '#a03428');
        const lines = wrap(s.text, 236, 6);
        let yy=52; for (const ln of lines){ T(ln, 42, yy, 6, '#3a2418'); yy+=9; }
        T('click to go back', 276, 150, 5, '#8a6a48','right');
        return;
      }
      if (mode==='sources'){
        box(20, 14, 280, 152, {border:'#c8a860'});
        T('RESEARCH SOURCES', LW/2, 20, 8, '#f2b632','center');
        T('Every fact in this game came from real research:', LW/2, 33, 5.4, '#cfc0a8','center');
        let yy=46;
        SOURCES_LIST.forEach(s=>{
          T('• '+s[0], 30, yy, 5.4, '#f4e8d0'); yy+=8;
          T('   '+s[1]+' — '+s[2], 30, yy, 5, '#b8a88e'); yy+=11;
        });
        T('Full citations: see the Works Cited page', LW/2, 148, 5.2, '#cfc0a8','center');
        T('click to go back', 288, 158, 5, '#8a6a48','right');
        return;
      }
      box(16, 10, 288, 160, {border:'#c8a860'});
      T('WISDOM SCROLL JOURNAL', LW/2, 15, 8, '#f2b632','center');
      T(G.scrolls.length+' of '+SCROLL_ORDER.length+' collected', LW/2, 27, 5.4, '#cfc0a8','center');
      const perCol = 9, colW = 140;
      const visible = entries.length+1;
      for (let i=0;i<visible;i++){
        const col = Math.floor(i/perCol), row = i%perCol;
        const x = 26+col*colW, y = 40+row*13;
        const isSrc = i===entries.length;
        const label = isSrc ? '★ RESEARCH SOURCES' : (entries[i].got ? SCROLLS[entries[i].id].title : '? ? ?');
        if (i===sel){ R(x-3, y-1.5, colW-8, 12, 'rgba(242,182,50,0.2)'); T('▶', x-1, y, 5.4, '#f2b632'); }

      }
      T('CLICK a scroll  ·  ✕ or X to close', LW/2, 162, 5, '#8a7c6a','center');
    }
  };
}

const CC_OPTS = {
  hairstyle: { label:'HAIRSTYLE', names:['Short','Long','Twin buns','Ponytail'], vals:['short','long','buns','pony'] },
  hair: { label:'HAIR', swatch:true, names:['Black','Brown','Auburn','Midnight'], vals:['#241a1e','#4a2c1a','#8a4a2c','#1a2438'] },
  skin: { label:'SKIN', swatch:true, names:['Light','Tan','Brown','Deep'], vals:['#f2c896','#e8b078','#c68a58','#8a5a38'] },
  eyes: { label:'EYES', names:['Round','Wide','Almond','Sharp','Happy'], vals:['round','wide','almond','sharp','smile'] },
  face: { label:'FACE', names:['Round','Oval','Square','Chubby'], vals:['round','oval','square','chubby'] },
  top:  { label:'OUTFIT', swatch:true, names:['Festival Red','River Blue','Lantern Gold','Bamboo Green','Plum Purple'],
          vals:['#e03c28','#3a5ab0','#e8b028','#3e8b4e','#8a4a9a'] },
  extra:{ label:'EXTRA', names:['None','Headband','Blush','Glasses'], vals:['none','band','blush','glasses'] },
};
const CC_PANTS = { '#e03c28':'#3a4a8a', '#3a5ab0':'#2a2a3a', '#e8b028':'#3a4a8a', '#3e8b4e':'#3a3a2a', '#8a4a9a':'#3a2a45' };
const CC_ROWS = ['hairstyle','hair','skin','eyes','face','top','extra','start'];

const creatorScene = {
  sel:0, idx:{hairstyle:0, hair:0, skin:0, eyes:0, face:0, top:0, extra:0}, t:0,
  enter(){ this.t=0; },
  look(){
    const v = k => CC_OPTS[k].vals[this.idx[k]];
    const extra = v('extra');
    return {
      skin:v('skin'), hair:v('hair'), top:v('top'), pants:CC_PANTS[v('top')],
      hairstyle:v('hairstyle'), eyes:v('eyes'), face:v('face'),
      band: extra==='band', blush: extra==='blush', glasses: extra==='glasses',
    };
  },
  cycle(key, delta){
    const n = CC_OPTS[key].vals.length;
    this.idx[key] = (this.idx[key] + delta + n) % n;
    SFX.blip();
  },
  finish(){
    G.look = this.look();
    SFX.win();
    burst(56, 90, ['#f2b632','#ffe98a','#e03c28'], 30, 60);
    fadeOut(()=>{
      swapScene(makeHowToCard(()=>{
        fadeOut(()=>{ swapScene(homeScene); homeScene.mode='intro'; fadeIn(); }, 3.2);
      }, "I'M READY TO START MY ADVENTURE!"));
      fadeIn();
    });
  },
  update(dt){
    this.t += dt; updateFade(dt); updateParts(dt);
    if (just.up){ this.sel = (this.sel+CC_ROWS.length-1)%CC_ROWS.length; SFX.blip(); }
    if (just.down){ this.sel = (this.sel+1)%CC_ROWS.length; SFX.blip(); }
    const row = CC_ROWS[this.sel];
    if (row!=='start'){
      if (just.left) this.cycle(row,-1);
      if (just.right) this.cycle(row,1);
      if (just.a && !tapPos) this.cycle(row,1);
    } else if (just.a && !tapPos){ this.finish(); return; }
    // mouse / touch: hover picks the row, the ◀ ▶ chips change it
    for (let i=0;i<CC_ROWS.length;i++){
      const y = 30+i*17, key = CC_ROWS[i];
      if (key==='start'){
        if (hoverIn(158, y-2, 96, 15) && this.sel!==i){ this.sel = i; SFX.blip(); }
        if (clickIn(158, y-2, 96, 15)){ this.sel = i; this.finish(); return; }
        continue;
      }
      if (hoverIn(104, y-3, 198, 15) && this.sel!==i){ this.sel = i; SFX.blip(); }
      if (clickIn(152, y-3, 16, 15)){ this.sel = i; this.cycle(key,-1); return; }
      if (clickIn(288, y-3, 16, 15)){ this.sel = i; this.cycle(key, 1); return; }
      if (clickIn(168, y-3, 120, 15)){ this.sel = i; this.cycle(key, 1); return; }
    }
  },
  render(){
    R(0,0,LW,LH,'#141026');
    for(let i=0;i<50;i++){ R(thash(i,5)*LW, thash(i,11)*LH, 1, 1, 'rgba(232,228,244,0.45)'); }
    R(0,0,LW,18,'rgba(20,12,16,0.9)'); R(0,17,LW,1,'#f2b632');
    T('CREATE YOUR HERO', LW/2, 4, 8, '#f2b632','center');
    // preview card — big portrait + the hero walking in place
    box(14, 28, 84, 128, {bg:'rgba(28,20,40,0.85)'});
    const dirs = ['down','left','up','right'];
    const dir = dirs[Math.floor(this.t/1.3)%4];
    const lk = {...this.look(), dir, walk:true};
    drawPortraitCard(33, 32, this.look());
    drawPersonZoomed(56, 134, lk, this.t, 2);
    T(G.name, 56, 142, 6.4, '#ffe9b0','center');
    drawParts(0,0);
    // option rows
    for (let i=0;i<CC_ROWS.length;i++){
      const key = CC_ROWS[i], y = 30+i*17, on = i===this.sel;
      if (key==='start'){
        const w = 96;
        box(158, y-2, w, 15, {border: on?'#f2b632':'#6a5a48', bg: on?'rgba(90,40,20,0.9)':'rgba(20,12,16,0.85)'});
        T('✦ START! ✦', 206, y+1, 7, on?'#ffe9b0':'#b8a88e','center');
        continue;
      }
      const o = CC_OPTS[key];
      if (on) R(104, y-3, 198, 15, 'rgba(242,182,50,0.12)');
      T(o.label, 106, y, 5.2, on?'#f2b632':'#8a7c6a');
      arrowGlyph(154, y+1, 'L', on?'#f2b632':'#6a5a48');
      arrowGlyph(291, y+1, 'R', on?'#f2b632':'#6a5a48');
      if (o.swatch){
        const v = o.vals[this.idx[key]];
        R(170, y-1, 11, 11, '#2b1a26'); R(171, y, 9, 9, v);
        T(o.names[this.idx[key]], 188, y+1, 6, on?'#ffe9b0':'#cfc0a8');
      } else {
        T(o.names[this.idx[key]], 170, y+1, 6.4, on?'#ffe9b0':'#cfc0a8');
      }
    }
    T('click the arrows to change a row  ·  or use the ARROW KEYS  ·  then START!', LW/2, 166, 5.2, '#9a8c78','center');
    drawFade();
  }
};
/* draw a chibi at an integer zoom, anchored at feet center */
function drawPersonZoomed(x, y, o, t, z){
  const dir = o.dir||'down';
  let frame = 0;
  if (o.walk){ const ph = Math.floor(t*6)%2; frame = ph; }
  const spr = chibiSprite(o, dir, frame);
  cx.fillStyle='rgba(20,8,16,0.3)';
  cx.fillRect((x-6*z)*P, (y-2)*P, 12*z*P, 3*P);
  cx.imageSmoothingEnabled = false;
  cx.drawImage(spr, (x-8*z)*P, (y-20*z)*P, 16*z*P, 20*z*P);
}

function setStep(n){ G.step = n; saveGame(); }

/* ---------- house decorations per chapter ---------- */
function houseDecor(h){
  if (G.ch===1) return { couplets:G.step>3, fu:G.step>3, lanterns:true, lit:G.night>0.25 };

    items.push({y:p[1], f:()=>{
      R(p[0]-cam-1.5, p[1]-camY-26, 3, 26, '#6a4a34');

    }});
  });

    items.push({y:316, f:()=> drawBoat(700-cam, 310-camY, G.time, {seed:2})});
    items.push({y:302, f:()=> drawBoat(790-cam, 296-camY, G.time, {seed:5})});

        items.push({y:258, f:()=> drawMugwort(mx-cam, 258-camY, G.time)});

    if (G.step>=5){

    }});
    items.push({y:232, f:()=>{

      drawFish(520-cam, 222-camY, 1); drawDumpling(544-cam, 224-camY, 1); drawOrange(552-cam, 221-camY);

    items.push({y:99999, f:()=>{
      for(let x=396; x<=564; x+=28){

    }});
  }

  if (DLG.active || fade.a>0.05) return;

    G.flags.ch3intro = true;

/* ============================================================
   NIAN — top-down boss room, Binding-of-Isaac style
   8-way movement, dumplings as your shot, bullet-hell patterns,
   3 phases with rage transitions, ~2 minute fight.
   ============================================================ */

const NR = { x0:20, x1:300, y0:52, y1:166 };   // room bounds
function roarSfx(){ noiseHit(0.5, 0.5, true); tone(60, 0.5, 'sawtooth', 0.35); tone(45, 0.6, 'sine', 0.4); }
function emberSfx(){ noiseHit(0.12, 0.16); tone(320, 0.08, 'sawtooth', 0.1); }

function makeNianBattle(){
  const st = {
    usesDash:true,
    mode:'intro', t:0, evT:0, fightT:0,
    // player
    px:250, py:120, dir:'left', moving:false,
    dashT:0, dashCd:0, inv:0, throwCd:0, hearts:5, maxHearts:5, ghosts:[],
    // nian
    nx:90, ny:104, nvx:0, nvy:0, hp:72, maxHp:72, hurtT:0, invuln:false,
    face:1, flipCd:0,
    atk:null, atkCd:1.4, spiralA:0,
    // stuff
    dumps:[], embers:[], waves:[], imps:[], drops:[],
    msg:'', msgT:0, msgC:'#ffe9b0', shake:0, danger:false, fledT:-1, phase:1,
  };
  window.BOSS = st;
  const phaseOf = ()=> st.hp > 48 ? 1 : st.hp > 24 ? 2 : 3;
  function say2(m,c){ st.msg=m; st.msgT=1.2; st.msgC=c||'#ffe9b0'; }

  function ember(x, y, ang, spd, big){
    st.embers.push({ x, y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, r: big?4.2:3, t:0 });
  }
  function hurtPlayer(){
    if (st.inv>0 || st.mode!=='fight') return;
    st.hearts--; st.inv = 1.5; st.shake = 0.55;
    SFX.bad(); noiseHit(0.3,0.4,true);
    burst(st.px, st.py-8, ['#ff8a70','#ffffff'], 18, 60);
    if (st.hearts<=0){ st.deaths=(st.deaths||0)+1; st.mode='lose'; st.evT=0; }
  }
  function damageNian(n){
    if (st.invuln) return;
    st.hp -= n; st.hurtT = 0.25;
    SFX.splat(); burst(st.nx+rnd(-8,8), st.ny-18, ['#f6ecd8','#ffe98a'], 10, 45);
    const ph = phaseOf();
    if (ph !== st.phase && st.hp > 0){ st.phase = ph; startRage(); }
    if (st.hp <= 0){
      st.hp = 0; st.mode='win'; st.evT=0; st.fledT=-1;
      st.embers=[]; st.waves=[]; st.imps=[]; st.atk=null;
      playMusic(1); SFX.win();
    }
  }
  function startRage(){
    st.atk = { kind:'rage', ph:'go', t:0 };
    st.invuln = true; st.shake = 0.9; roarSfx(); SFX.gong();
    st.embers = [];                                   // clear the screen on a phase change
    st.drops.push({ x: clamp(st.px + rnd(-40,40), NR.x0+16, NR.x1-16),
                    y: clamp(st.py + rnd(-30,30), NR.y0+20, NR.y1-10), t:0 });
    say2(st.phase===2 ? 'NIAN IS FURIOUS!' : 'FINAL STAND!', '#ff8a70');
  }
  function pickAttack(){
    const ph = phaseOf();
    const pool = ph===1 ? ['ring','aimed','charge','summon','aimed']
               : ph===2 ? ['ring','aimed','charge','spiral','stomp','summon','charge']
               : ['charge','ring','aimed','stomp','charge','aimed','spiral','ring'];
    st.atk = { kind: pick(pool), ph:'warn', t:0, warn: ph===1?0.9 : ph===2?0.75 : 0.6 };
    if (st.atk.kind==='charge'){ st.atk.tx = st.px; st.atk.ty = st.py; }
  }

  return {
    usesDash:true, aim:true,
    enter(){ playMusic(4); },
    update(dt){
      st.t += dt; st.evT += dt;
      st.msgT=Math.max(0,st.msgT-dt); st.shake=Math.max(0,st.shake-dt);
      st.hurtT=Math.max(0,st.hurtT-dt); st.inv=Math.max(0,st.inv-dt);
      st.dashT=Math.max(0,st.dashT-dt); st.dashCd=Math.max(0,st.dashCd-dt);
      st.throwCd=Math.max(0,st.throwCd-dt);
      st.ghosts = st.ghosts.filter(g=> (g.t+=dt) < 0.25);
      updateParts(dt);

      if (st.mode==='intro'){ if (st.evT>2 || just.a){ st.mode='fight'; say2('SURVIVE THE NIGHT!'); } return; }
      if (st.mode==='lose'){
        if ((just.a || just.click) && st.evT>0.9){
          st.hp=st.maxHp; st.hearts=st.maxHearts; st.phase=1; st.invuln=false;
          st.px=250; st.py=120; st.nx=90; st.ny=104;
          st.embers=[]; st.waves=[]; st.imps=[]; st.dumps=[]; st.drops=[];
          st.atk=null; st.atkCd=1.4; st.mode='intro'; st.evT=0; st.fightT=0;
        }
        return;
      }
      if (st.mode==='win'){
        if (st.fledT<0) st.fledT = st.t;
        if (Math.random()<0.14) burst(rnd(40,280), rnd(50,130), ['#ff5838','#f2b632','#7ce87c','#cfe4f4'], 14, 60);
        if (st.evT>2.6){
          popScene();
          say([
            {who:'Elder Shan', port:port('elder'), text:"GUO NIAN! WE HAVE PASSED THE YEAR! Ha-HA! Did you SEE it run?!"},
            {who:'Mei', port:NPCS.mei.look, text:"My dumplings! My beautiful dumplings! …Worth it."},
            {who:'Lóng', port:LONG_PORTRAIT, text:"Fed, deafened and dazzled. The beast won't return for a whole year — and when it does, we'll be ready. We ALWAYS are."},
            {who:'Elder Shan', port:port('elder'), text:"Find me at the tea house, child. Dawn brings one more tradition — the sweetest one of all."},
          ], ()=> setStep(6));
        }
        return;
      }

      st.fightT += dt;

      /* ---------------- player ---------------- */
      let vx=0, vy=0;
      if (keys.left) vx=-1; else if (keys.right) vx=1;
      if (keys.up) vy=-1; else if (keys.down) vy=1;
      st.moving = !!(vx||vy);
      if (vx&&vy){ vx*=0.707; vy*=0.707; }
      if (vx<0) st.dir='left'; else if (vx>0) st.dir='right';
      else if (vy<0) st.dir='up'; else if (vy>0) st.dir='down';
      if (just.dash && st.dashCd<=0){ st.dashT=0.16; st.dashCd=0.62; st.inv=Math.max(st.inv,0.28); SFX.dash(); }
      const spd = st.dashT>0 ? 290 : 114;
      if (st.dashT>0 && !vx && !vy){
        vx = st.dir==='left'?-1: st.dir==='right'?1:0;
        vy = st.dir==='up'?-1: st.dir==='down'?1:0;
      }
      st.px = clamp(st.px + vx*spd*dt, NR.x0+8, NR.x1-8);
      st.py = clamp(st.py + vy*spd*dt, NR.y0+12, NR.y1-4);
      if (st.dashT>0) st.ghosts.push({x:st.px, y:st.py, t:0});

      // throw dumplings in the facing direction
      if ((just.a || just.click) && st.throwCd<=0){
        st.throwCd = 0.30;
        const aa = mouse.over ? aimAngle(st.px, st.py-8)
                 : (st.dir==='left'?Math.PI: st.dir==='right'?0: st.dir==='up'?-Math.PI/2:Math.PI/2);
        const ax = Math.cos(aa), ay = Math.sin(aa);
        if (Math.abs(ax) > Math.abs(ay)) st.dir = ax<0?'left':'right'; else st.dir = ay<0?'up':'down';
        st.dumps.push({ x:st.px+ax*8, y:st.py-8+ay*8, vx:ax*205, vy:ay*205 });
        noiseHit(0.05,0.1); tone(700,0.05,'sine',0.1);
      }
      for (const d of st.dumps){
        d.x += d.vx*dt; d.y += d.vy*dt;
        if (!st.invuln && dist(d.x, d.y, st.nx, st.ny-18) < 22){
          d.hit = true; damageNian(st.atk && st.atk.kind==='charge' && st.atk.ph==='recover' ? 2 : 1);
        }
        for (const im of st.imps){
          if (!im.dead && dist(d.x, d.y, im.x, im.y) < 9){
            d.hit = true; im.hp--; burst(im.x, im.y, ['#48962c','#7cc93e','#ede0bc'], 10, 40); noiseHit(0.12,0.2);
            if (im.hp<=0){
              im.dead = true;
              if (Math.random()<0.6) st.drops.push({x:im.x, y:im.y, t:0});
            }
          }
        }
        if (d.x<NR.x0||d.x>NR.x1||d.y<NR.y0||d.y>NR.y1) d.hit = true;
      }
      st.dumps = st.dumps.filter(d=>!d.hit);
      st.imps = st.imps.filter(im=>!im.dead);

      // pickups (red envelopes heal a heart)
      for (const dp of st.drops){
        dp.t += dt;
        if (dist(dp.x, dp.y, st.px, st.py-8) < 12 && st.hearts < st.maxHearts){
          dp.got = true; st.hearts++; SFX.sparkle(); say2('A red envelope! +1 lantern', '#7ce87c');
        }
      }
      st.drops = st.drops.filter(dp=> !dp.got && dp.t < 14);

      /* ---------------- Nian ---------------- */
      // he TURNS: face the player, or the way he is charging
      st.flipCd = Math.max(0, st.flipCd - dt);
      let wantF = st.px >= st.nx ? 1 : -1;
      if (st.atk && st.atk.kind==='charge' && st.atk.ph==='go' && Math.abs(st.nvx) > 8)
        wantF = st.nvx >= 0 ? 1 : -1;
      if (wantF !== st.face && st.flipCd <= 0){ st.face = wantF; st.flipCd = 0.35; }
      if (!st.atk){
        // stalk the player slowly
        const a = Math.atan2(st.py-8-st.ny, st.px-st.nx);
        const gap = dist(st.nx, st.ny-18, st.px, st.py-8);
        const push = gap > 96 ? 1 : gap < 58 ? -1.3 : 0;      // stalk, but never smother
        st.nvx += Math.cos(a)*34*push*dt; st.nvy += Math.sin(a)*26*push*dt;
        st.atkCd -= dt;
        if (st.atkCd<=0) pickAttack();
      }
      if (st.atk){
        const A = st.atk; A.t += dt;
        if (A.ph==='warn'){
          if (A.kind==='charge'){ A.tx = st.px; A.ty = st.py; }
          if (A.kind==='aimed' && Math.random() < dt*22){       // the inhale, drawn inward
            const ia = rnd(Math.PI*2), ir = rnd(14, 24);
            const mx = st.nx + st.face*15, my = st.ny - 23;
            spawnPart({ x:mx+Math.cos(ia)*ir, y:my+Math.sin(ia)*ir,
                        vx:-Math.cos(ia)*ir*3.2, vy:-Math.sin(ia)*ir*3.2,
                        g:0, life:0.3, t:0, c:pick(['#ff7030','#ffb050']), sz:1.4 });
          }
          if (A.t >= A.warn){
            A.ph='go'; A.t=0;
            const ph = phaseOf();
            if (A.kind==='ring'){
              const n = ph===1?8 : ph===2?10 : 11;
              const off = rnd(Math.PI*2);
              for (let i=0;i<n;i++) ember(st.nx, st.ny-18, off + i/n*Math.PI*2, 40+ph*4);
                      emberSfx(); st.atk=null; st.atkCd = ph===3?1.6:1.9;
            } else if (A.kind==='aimed'){
              // FIRE BREATH: a tracking stream from the open mouth
              A.ph='breathe'; A.t=0; A.shot=0; A.total = ph===1?4:6; A.next=0;
              roarSfx();
            } else if (A.kind==='stomp'){
              st.waves.push({x:st.nx, y:st.ny-14, r:8});
              mdrum(0,0.6); st.shake=0.5; st.atk=null; st.atkCd = ph===3?1.8:1.9;
            } else if (A.kind==='summon'){
              for (let i=0;i<3;i++) st.imps.push({ x:st.nx+rnd(-16,16), y:st.ny-18+rnd(-12,12), hp:2, dead:false });
              roarSfx(); st.atk=null; st.atkCd = 1.9;
            }
          }
        } else if (A.ph==='breathe'){
          A.next -= dt;
          const mx = st.nx + st.face*15, my = st.ny - 23;
          if (A.next <= 0 && A.shot < A.total){
            A.next = 0.13; A.shot++;
            const base = Math.atan2(st.py-8-my, st.px-mx);
            ember(mx, my, base + rnd(-0.08, 0.08), 74);
            emberSfx();
            st.nvx -= st.face*26*0.2;                       // recoil
            for (let k2=0;k2<3;k2++)
              spawnPart({ x:mx, y:my, vx:Math.cos(base)*rnd(30,70)+rnd(-10,10), vy:Math.sin(base)*rnd(30,70)+rnd(-10,10),
                          g:-14, life:rnd(0.25,0.5), t:0, c:pick(['#ff7030','#ffe98a','#ff5024']), sz:rnd(1.4,2.4) });
          }
          if (A.shot >= A.total && A.next <= -0.15){
            st.atk = null; st.atkCd = phaseOf()===3?1.45:1.7;
          }
        } else if (A.kind==='charge'){
          if (A.ph==='go'){
            const a = Math.atan2(A.ty-8-st.ny, A.tx-st.nx);
            st.nvx = Math.cos(a)*250; st.nvy = Math.sin(a)*250;
            if (A.t > 0.55 || st.nx<=NR.x0+22 || st.nx>=NR.x1-22 || st.ny<=NR.y0+30 || st.ny>=NR.y1-6){
              A.ph='recover'; A.t=0; st.nvx*=0.2; st.nvy*=0.2; st.shake=0.4; mdrum(0,0.5);
            }
          } else if (A.ph==='recover'){
            if (A.t > 0.9){ st.atk=null; st.atkCd = phaseOf()===3?1.5:1.7; }
          }
        } else if (A.kind==='spiral'){
          A.dur = (A.dur||0) + dt;
          st.spiralA += dt*2.6;
          if (Math.floor(A.dur*7) !== Math.floor((A.dur-dt)*7)){
            ember(st.nx, st.ny-18, st.spiralA, 58);
            ember(st.nx, st.ny-18, st.spiralA + Math.PI, 58);
                      }
          if (A.dur > 2.0){ st.atk=null; st.atkCd = 1.7; }
        } else if (A.kind==='rage'){
          st.spiralA += dt*4.6;
          if (Math.floor(A.t*8) !== Math.floor((A.t-dt)*8)){
            for (let k=0;k<3;k++) ember(st.nx, st.ny-18, st.spiralA + k*2.094, 62);
          }
          if (A.t > 2.2){ st.invuln=false; st.atk=null; st.atkCd=1.6; st.inv=Math.max(st.inv,0.9); }
        }
      }
      // move Nian
      st.nx += st.nvx*dt; st.ny += st.nvy*dt;
      st.nvx *= 0.94; st.nvy *= 0.94;
      st.nx = clamp(st.nx, NR.x0+22, NR.x1-22);
      st.ny = clamp(st.ny, NR.y0+30, NR.y1-4);
      // body contact
      if (dist(st.px, st.py-8, st.nx, st.ny-18) < 19 && st.dashT<=0) hurtPlayer();

      /* ---------------- projectiles ---------------- */
      for (const e of st.embers){
        e.t += dt; e.x += e.vx*dt; e.y += e.vy*dt;
        if (dist(e.x, e.y, st.px, st.py-8) < e.r+4 && st.dashT<=0){ e.gone=true; hurtPlayer(); }
        if (e.x<NR.x0-6||e.x>NR.x1+6||e.y<NR.y0-6||e.y>NR.y1+6||e.t>7) e.gone=true;
      }
      st.embers = st.embers.filter(e=>!e.gone);

      for (const w of st.waves){
        w.r += 118*dt;
        if (Math.abs(dist(st.px, st.py-8, w.x, w.y) - w.r) < 8 && st.dashT<=0) hurtPlayer();
        if (w.r > 320) w.gone = true;
      }
      st.waves = st.waves.filter(w=>!w.gone);

      for (const im of st.imps){
        const a = Math.atan2(st.py-8-im.y, st.px-im.x);
        im.x += Math.cos(a)*38*dt; im.y += Math.sin(a)*38*dt;
        if (dist(im.x, im.y, st.px, st.py-8) < 12 && st.dashT<=0) hurtPlayer();
      }

      /* danger flag for the auto-tester */
      st.danger = st.embers.some(e=> dist(e.x,e.y,st.px,st.py-8) < 34)
        || st.waves.some(w=> Math.abs(dist(st.px,st.py-8,w.x,w.y) - w.r) < 26)
        || (st.atk && st.atk.kind==='charge' && st.atk.ph==='go')
        || dist(st.px, st.py-8, st.nx, st.ny-18) < 42
        || st.imps.some(im=> dist(im.x,im.y,st.px,st.py-8) < 22);
    },

    render(){
      const shx = st.shake>0 ? Math.round(Math.sin(st.t*70)*st.shake*4) : 0;
      cx.save(); cx.translate(shx*P, 0);
      /* the plaza at night, top-down */
      R(0,0,LW,LH,'#0e0c1e');
      for(let i=0;i<26;i++){ const h=thash(i,5); R(h*LW, thash(i,11)*40, 1.2, 1.2, '#8a8ab4'); }
      R(NR.x0-8, NR.y0-10, NR.x1-NR.x0+16, NR.y1-NR.y0+18, '#241c30');
      for (let y=NR.y0-8; y<NR.y1+8; y+=16)
        for (let x=NR.x0-8; x<NR.x1+8; x+=16) cobbleTile(x, y, x/16, y/16, COB_S);
      cx.globalAlpha = 0.45; R(NR.x0-8, NR.y0-10, NR.x1-NR.x0+16, NR.y1-NR.y0+18, '#141030'); cx.globalAlpha = 1;
      // lantern posts in the corners
      for (const [lx,ly] of [[NR.x0+4,NR.y0+4],[NR.x1-4,NR.y0+4],[NR.x0+4,NR.y1-2],[NR.x1-4,NR.y1-2]]){
        drawLantern(lx, ly-12, 0.9, true, st.t+lx);
        glow(lx, ly-4, 22, '#ffaa50', 0.16);
      }
      // shockwaves
      for (const w of st.waves){
        for (let i=0;i<26;i++){
          const a = i/26*Math.PI*2;
          R(w.x+Math.cos(a)*w.r, w.y+Math.sin(a)*w.r*0.72, 2.4, 2.4, i%2?'#ff7030':'#f2b632');
        }
      }
      // drops
      for (const dp of st.drops){
        const bob = Math.sin(st.t*4+dp.x)*1.5;
        drawEnvelope(dp.x, dp.y+bob, 0.7, st.t, true);
      }
      // depth-sorted actors
      const items = [];
      for (const im of st.imps) items.push({y:im.y, f:()=> drawNianCub(im.x, im.y, st.t, im.hp<2)});
      items.push({y:st.ny, f:()=>{
        const A2 = st.atk;
        const pose = { face: st.face };
        if (A2){
          const k = Math.min(1, A2.t/(A2.warn||0.6));
          if (A2.ph==='warn'){
            if (A2.kind==='aimed'){ pose.rear = k; pose.mouth = 0.2+k*0.6; }
            else if (A2.kind==='charge'){ pose.rear = k*0.8; pose.mouth = 0.3; }
            else if (A2.kind==='stomp'){ pose.rear = k*0.6; }
            else if (A2.kind==='summon'){ pose.mouth = k; pose.rear = k*0.4; }
            else if (A2.kind==='ring'){ pose.mouth = k*0.8; }
          }
          else if (A2.ph==='breathe'){ pose.mouth = 1; pose.rear = 0.15; }
          else if (A2.kind==='charge' && A2.ph==='go'){ pose.lunge = 1; pose.mouth = 0.4; }
          else if (A2.kind==='rage'){ pose.mouth = 1; pose.rear = 0.5; }
          else if (A2.kind==='spiral'){ pose.mouth = 0.55; }
        }
        const shk = st.hurtT>0 ? Math.round(Math.sin(st.t*60)*1.5) : 0;
        drawNian(st.nx + shk, st.ny, st.t, pose);
        // the breath itself: a flickering cone of flame from the mouth
        if (A2 && A2.ph==='breathe'){
          const mx = st.nx + st.face*15, my = st.ny - 23;
          const a = Math.atan2(st.py-8-my, st.px-mx);
          const L = 26 + Math.sin(st.t*34)*4;
          const ca = Math.cos(a), sa = Math.sin(a), pa = -sa, pb = ca;
          const tx2 = mx + ca*L, ty2 = my + sa*L;
          tri(mx, my, tx2 + pa*10, ty2 + pb*10, tx2 - pa*10, ty2 - pb*10, '#a82810');
          tri(mx, my, tx2 - ca*4 + pa*7, ty2 - sa*4 + pb*7, tx2 - ca*4 - pa*7, ty2 - sa*4 - pb*7, '#ff7030');
          tri(mx, my, tx2 - ca*10 + pa*3.6, ty2 - sa*10 + pb*3.6, tx2 - ca*10 - pa*3.6, ty2 - sa*10 - pb*3.6, '#ffe98a');
          glow(mx + ca*12, my + sa*12, 16, '#ff7030', 0.3);
        }
        // charge speed-streaks
        if (A2 && A2.kind==='charge' && A2.ph==='go'){
          cx.globalAlpha = 0.4;
          for (let k2=1;k2<4;k2++) R(st.nx - st.face*(10+k2*7), st.ny - 16 - k2*2, 6, 2, '#7cc93e');
          cx.globalAlpha = 1;
        }
        if (st.hurtT>0) glow(st.nx+2, st.ny-20, 30, '#ffffff', 0.4*(st.hurtT/0.25));
        if (st.invuln) glow(st.nx+2, st.ny-20, 34, '#ff3820', 0.22);
      }});
      items.push({y:st.py, f:()=>{
        for (const g of st.ghosts){
          cx.globalAlpha = 0.3*(1-g.t/0.25);
          R(g.x-6, g.y-20, 12, 20, playerLook().top||'#e8b028');
          cx.globalAlpha = 1;
        }
        if (!(st.inv>0.3 && Math.sin(st.t*40)>0))
          drawPerson(st.px, st.py, {...playerLook(), dir:st.dir, walk:st.moving||st.dashT>0}, st.t);
      }});
      items.sort((a,b)=>a.y-b.y);
      for (const it of items) it.f();
      // charge telegraph
      if (st.atk && st.atk.kind==='charge' && st.atk.ph==='warn'){
        cx.globalAlpha = 0.5 + Math.sin(st.t*18)*0.2;
        const a = Math.atan2(st.atk.ty-8-st.ny, st.atk.tx-st.nx);
        for (let i=1;i<14;i++) R(st.nx+Math.cos(a)*i*14, st.ny-18+Math.sin(a)*i*14, 3, 3, '#ff3820');
        cx.globalAlpha = 1;
      }
      // projectiles on top
      for (const e of st.embers){
        const el = Math.hypot(e.vx, e.vy) || 1;
        const bx2 = e.x - e.vx/el*e.r*1.7, by2 = e.y - e.vy/el*e.r*1.7;
        circle(bx2, by2, e.r*0.62, '#a82810');
        circle(e.x, e.y, e.r + (Math.sin(st.t*40 + e.x)>0?0.5:0), '#ff7030');
        circle(e.x-0.8, e.y-0.8, e.r*0.52, '#ffe98a');
        glow(e.x, e.y, e.r*2.6, '#ff7030', 0.22);
      }
      for (const d of st.dumps) drawDumpling(d.x, d.y, 1);
      drawParts(0,0);
      cx.restore();

      /* HUD */
      mgHeader('NIAN AT THE GATES', 'survive the night');
      T('NIAN', 10, 30, 5.4, '#ff8a70');
      R(34, 30, 150, 7, 'rgba(20,12,16,0.85)');
      R(34, 30, 150, 1, '#6a5a48'); R(34, 36, 150, 1, '#6a5a48');
      R(35, 31, 148*clamp(st.hp/st.maxHp,0,1), 5, st.invuln ? '#ffe9b0' : '#e03c28');
      for (let i=0;i<st.maxHearts;i++) drawLantern(252+i*11, 27, 0.8, i < st.hearts, st.t);
      R(276, 44, 38, 4, 'rgba(20,12,16,0.85)');
      R(276, 44, 38*(1-st.dashCd/0.62), 4, st.dashCd<=0 ? '#7ce87c' : '#8a7c6a');
      T('DASH', 254, 43, 4.6, '#8a7c6a');
      const mm = Math.floor(st.fightT/60), ssx = Math.floor(st.fightT%60);
      T('PHASE '+st.phase+'/3   '+mm+':'+(ssx<10?'0':'')+ssx, 10, 42, 5, '#8a7c6a');

      if (st.mode==='intro'){
        box(30, 66, 260, 48);
        T('NIAN ATTACKS THE VILLAGE!', LW/2, 72, 8, '#ff8a70','center');
        T('ARROWS move · CLICK to throw at the cursor · SPACE dash', LW/2, 88, 5.6, '#ffe9b0','center');
        T('dashing makes you untouchable for a moment', LW/2, 99, 5, '#cfc0a8','center');
      } else if (st.mode==='win'){
        box(46,64,228,44);
        T('GUO NIAN!', LW/2, 70, 9, '#f2b632','center');
        T('You have passed over the year!', LW/2, 86, 6, '#f4e8d0','center');
      } else if (st.mode==='lose'){
        box(36,60,248,56);
        T('THE VILLAGE HIDES…', LW/2, 66, 8.4, '#ff8a70','center');
        T('Nian prowls until you stand again.', LW/2, 82, 5.8, '#f4e8d0','center');
        T('CLICK to stand again  (or Z)', LW/2, 96, 7, Math.sin(st.t*5)>0?'#ffe9b0':'#8a7c6a','center');
      }
      if (st.msgT>0 && st.mode==='fight') T(st.msg, LW/2, 126, 7, st.msgC, 'center');
    }
  };
}
/* ============================================================
   THE FIVE POISONS (五毒) — Dragon Boat Festival boss
   The 5th day of the 5th month is the "poison month": families hang
   mugwort and calamus to drive off snake, scorpion, centipede,
   toad and spider. Here you fight them with a mugwort bundle.
   ============================================================ */

const PR = { x0:20, x1:300, y0:54, y1:158 };
function hissSfx(){ noiseHit(0.26, 0.2); tone(210, 0.16, 'sawtooth', 0.12); }
function swingSfx(){ noiseHit(0.13, 0.18); tone(430, 0.07, 'triangle', 0.12); tone(300, 0.09, 'sine', 0.1, 0.03); }
function burstSfx(){ [520,660,830].forEach((f,i)=> tone(f, 0.22, 'triangle', 0.2, i*0.05)); noiseHit(0.3, 0.3); }

/* ---------------- art ---------------- */
function drawScorpion(x, y, t, hurt){
  const sway = Math.sin(t*6)*1.4;
  const B='#6a2a5a', B2='#8a3a72', B3='#a84a88', INKp='#1a1016';
  ell(x, y+4, 11, 3, 'rgba(0,0,0,0.25)');
  for (let i=0;i<4;i++){                                  // tail curling over the back
    const a = -1.5 + i*0.42, r = 12 + i*1.5;
    const sx = x - 9 + Math.cos(a)*r*0.5, sy = y - 6 - Math.sin(a)*r*0.55 + sway*0.4;
    circle(sx, sy, 3.4-i*0.4, INKp); circle(sx, sy, 2.6-i*0.4, i%2?B2:B);
  }
  const stx = x - 4 + sway, sty = y - 20;
  tri(stx-2.4, sty+2, stx, sty-4.6, stx+2.4, sty+2, INKp);
  tri(stx-1.6, sty+1.6, stx, sty-3.4, stx+1.6, sty+1.6, '#e8d24a');
  for (let i=0;i<4;i++){                                  // legs
    R(x-8+i*4, y+1, 1.6, 5, INKp); R(x-8+i*4+0.4, y+1, 1, 4, B);
  }
  ell(x, y-2, 10, 6.4, INKp); ell(x, y-2, 9, 5.4, B);
  ell(x-2, y-3.4, 5, 2.6, B2);
  R(x-9, y-3, 18, 1, B3);
  for (const s of [-1,1]){                                 // claws
    R(x+s*11-2, y-4, 4, 3.4, INKp);
    R(x+s*11-1.4, y-3.6, 2.8, 2.6, B2);
    R(x+s*13.4-1, y-6, 2, 3, INKp); R(x+s*13.4-0.6, y-5.6, 1.2, 2.2, B3);
  }
  R(x-4.4, y-4.4, 2.4, 1.8, '#ffe14a'); R(x+2, y-4.4, 2.4, 1.8, '#ffe14a');
  if (hurt>0) glow(x, y-2, 16, '#ffffff', 0.45*hurt);
}
function drawSnake(x, y, t, hurt){
  const G1='#2e7a3e', G2='#46a css', INKp='#1a1016';
  const g1='#2e7a3e', g2='#48a css';
  ell(x, y+4, 10, 3, 'rgba(0,0,0,0.25)');
  for (let i=7;i>=1;i--){                                  // coiling body
    const sx = x - i*4.4, sy = y + Math.sin(t*4 - i*0.8)*4;
    circle(sx, sy, 4.2, INKp); circle(sx, sy, 3.4, i%2 ? '#2e7a3e' : '#3f9450');
    if (i%2===0) R(sx-1.4, sy-1, 2.8, 1.2, '#d8e06a');
  }
  circle(x, y, 5.6, INKp); circle(x, y, 4.8, '#3f9450');
  circle(x-1.4, y-1.6, 2.4, '#54ad63');
  R(x+3, y-1.6, 4.4, 3.4, INKp); R(x+3, y-1.2, 3.6, 2.6, '#3f9450');
  R(x+1, y-2.6, 2, 2, '#ffd23a'); R(x+1, y-2.4, 1, 1, '#1a1016');
  const flick = Math.sin(t*9)>0 ? 3.4 : 2;
  R(x+7, y+0.4, flick, 1, '#e0403c');
  if (hurt>0) glow(x, y, 15, '#ffffff', 0.45*hurt);
}
function drawCentipedeSeg(x, y, t, i, head, hurt){
  const INKp='#1a1016';
  const legPhase = Math.sin(t*10 + i*0.9);
  R(x-5, y-1, 2, 4.4+legPhase, INKp); R(x+3, y-1, 2, 4.4-legPhase, INKp);
  R(x-5, y-4.4, 2, 3.4, INKp); R(x+3, y-4.4, 2, 3.4, INKp);
  circle(x, y, head?6.4:5, INKp);
  circle(x, y, head?5.6:4.2, i%2 ? '#a8481c' : '#c25a24');
  circle(x-1, y-1.2, head?2.8:2, '#d97a34');
  if (head){
    R(x+2.4, y-3.4, 3.4, 2, INKp); R(x-5.8, y-3.4, 3.4, 2, INKp);   // antennae
    R(x-2.6, y-1.6, 2, 2, '#ffd23a'); R(x+0.8, y-1.6, 2, 2, '#ffd23a');
    R(x-2.4, y+2.4, 5, 1.6, '#5a1a10');
    if (hurt>0) glow(x, y, 16, '#ffffff', 0.45*hurt);
  }
}
function drawToad(x, y, t, hurt, crouch){
  const INKp='#1a1016', T1='#5c7a2e', T2='#74963c', T3='#8fae4e';
  const sq = crouch ? 0.72 : 1;
  ell(x, y+4, 14, 3.4, 'rgba(0,0,0,0.25)');
  R(x-13, y-2, 5, 5, INKp); R(x+8, y-2, 5, 5, INKp);        // back feet
  R(x-12, y-1.4, 3.4, 3.6, T1); R(x+8.6, y-1.4, 3.4, 3.6, T1);
  ell(x, y-6*sq, 13, 9*sq, INKp); ell(x, y-6*sq, 12, 8*sq, T1);
  ell(x-2, y-8*sq, 8, 4.4*sq, T2);
  for (const [wx,wy] of [[-7,-4],[4,-6],[-1,-2],[7,-3],[-5,-9]])
    circle(x+wx, y-6*sq+wy*0.5, 1.4, T3);
  ell(x, y-2.4*sq, 8, 2.6, '#d8d09a');                      // pale belly
  for (const s of [-1,1]){                                   // bulging eyes
    circle(x+s*5.4, y-13*sq, 3.8, INKp); circle(x+s*5.4, y-13*sq, 3, '#ffd23a');
    circle(x+s*5.4, y-12.6*sq, 1.4, '#1a1016');
  }
  R(x-6, y-9.4*sq, 12, 1.6, '#3e5220');
  if (hurt>0) glow(x, y-6, 18, '#ffffff', 0.45*hurt);
}
/* squares marched along a line — keeps everything on the pixel grid */
function pixLine(x1, y1, x2, y2, sz, color){
  const d = Math.hypot(x2-x1, y2-y1), n = Math.max(2, Math.round(d/1.3));
  for (let i=0;i<=n;i++) R(x1 + (x2-x1)*i/n - sz/2, y1 + (y2-y1)*i/n - sz/2, sz, sz, color);
}
function drawSpider(x, y, t, hurt){
  const INKp='#1a1016', S1='#2a2438', S2='#463c5c';
  ell(x, y+3, 9, 2.6, 'rgba(0,0,0,0.25)');
  for (let i=0;i<4;i++){                                     // eight legs, alternating gait
    const k = Math.sin(t*11 + i*1.55)*1.8;                   // knee lift
    const step = Math.cos(t*11 + i*1.55)*1.3;                // foot reach
    for (const s of [-1,1]){
      const bx = x + s*4, by = y-1;
      const mx = bx + s*(6+i*0.6), my = by - 4 + i*1.6 + k*s;
      const ex = bx + s*(10+i) + step*s, ey = by + 2.6 + i*1.4 - k*s;
      pixLine(bx, by, mx, my, 1.4, INKp);
      pixLine(mx, my, ex, ey, 1.4, INKp);
      R(ex-0.9, ey-0.9, 1.8, 1.8, '#463c5c');               // little foot
    }
  }
  ell(x-1, y, 7, 6, INKp); ell(x-1, y, 6, 5, S1);
  ell(x-2, y-1.4, 3, 2.2, S2);
  R(x-3.4, y-1, 6, 1.2, '#c8443c');
  circle(x+5.4, y-1.4, 4, INKp); circle(x+5.4, y-1.4, 3.2, S1);
  for (const [ex,ey,r] of [[4.2,-2.8,1],[6.6,-2.8,1],[4.6,-0.6,0.8],[7,-0.6,0.8]])
    circle(x+ex, y+ey, r, '#e0403c');
  if (hurt>0) glow(x, y, 14, '#ffffff', 0.45*hurt);
}
function drawPoisonKing(x, y, t, hurt, rage){

    circle(hx2 - sgn*2, y-12+bob, 4.2, G2);

    R(hx2-5.4, y-1, 11, 3.2, INKp);

    R(px2-2.8, py2-2.2, 5.6, 4.6, INKp);
    R(px2-2.2, py2-1.6, 4.4, 3.4, i%2 ? '#b0502a' : '#8a3a1c');

  /* bright jade warts */
  for (const [wx,wy,wr] of [[-14,-13,2.2],[12,-11,2.4],[-6,-9,1.8],[7,-17,1.8],[16,-16,1.6],[-17,-18,1.6]]){
