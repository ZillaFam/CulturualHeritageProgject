<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Festival Quest</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body {
    background:#0c0a14;
    display:flex; align-items:center; justify-content:center;
    font-family:"Courier New", monospace;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
  }
  #wrap { position:relative; }
  canvas {
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#0c0a14;
    cursor:none;
  }
  /* touch controls */
  #touch { position:fixed; inset:0; pointer-events:none; display:none; z-index:5; }
  body.touchmode #touch { display:block; }
  .tbtn {
    position:absolute; pointer-events:auto;
    background:rgba(244,232,208,0.10);
    border:2px solid rgba(244,232,208,0.35);
    border-radius:12px;
    color:rgba(244,232,208,0.8);
    font-family:"Courier New",monospace; font-weight:bold; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .tbtn:active { background:rgba(242,182,50,0.35); }
  #t-up    { left:74px;  bottom:118px; width:56px; height:52px; }
  #t-down  { left:74px;  bottom:14px;  width:56px; height:52px; }
  #t-left  { left:14px;  bottom:62px;  width:56px; height:52px; }
  #t-right { left:134px; bottom:62px;  width:56px; height:52px; }
  #t-a { right:20px; bottom:64px; width:72px; height:72px; border-radius:50%; font-size:26px;
         background:rgba(224,60,40,0.25); border-color:rgba(224,60,40,0.6); }
  #t-b { right:104px; bottom:20px; width:58px; height:58px; border-radius:50%;
         background:rgba(74,144,194,0.2); border-color:rgba(74,144,194,0.55); }
  #t-j { right:20px; top:16px; width:52px; height:44px; font-size:22px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="touch">
  <div class="tbtn" id="t-up">▲</div>
  <div class="tbtn" id="t-down">▼</div>
  <div class="tbtn" id="t-left">◀</div>
  <div class="tbtn" id="t-right">▶</div>
  <div class="tbtn" id="t-a">✓</div>
  <div class="tbtn" id="t-b">✕</div>
  <div class="tbtn" id="t-j">📜</div>
</div>
<script>
'use strict';
/* ============================================================
   FESTIVAL QUEST — a Family Heritage Project game
   A journey through three traditional Chinese festivals:
   Lunar New Year, the Dragon Boat Festival, and Mid-Autumn.
   ============================================================ */

/* ---------- core constants ---------- */
const LW = 320, LH = 180;         // logical resolution
const P  = 3;                     // pixel scale (canvas is 960x540)
const cv = document.getElementById('game');
let cx = cv.getContext('2d');   // let: the portrait renderer briefly retargets drawing to an offscreen canvas
cx.imageSmoothingEnabled = false;

/* fit canvas to window, preserving 16:9 */
function fitCanvas(){
  const aw = window.innerWidth, ah = window.innerHeight;
  let w = aw, h = aw * (LH/LW);
  if (h > ah){ h = ah; w = ah * (LW/LH); }
  cv.style.width  = Math.floor(w) + 'px';
  cv.style.height = Math.floor(h) + 'px';
}
window.addEventListener('resize', fitCanvas); fitCanvas();

/* ---------- tiny utils ---------- */
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const lerp  = (a,b,t)=> a+(b-a)*t;
const dist  = (x1,y1,x2,y2)=> Math.hypot(x2-x1, y2-y1);
const rnd   = (a=1,b)=> b===undefined ? Math.random()*a : a+Math.random()*(b-a);
const irnd  = (a,b)=> Math.floor(rnd(a,b+1));
const pick  = arr => arr[Math.floor(Math.random()*arr.length)];

/* ---------- game state ---------- */
const G = {
  name: 'You',
  ch: 0,          // 0 = intro-home, 1..3 festivals, 4 = done
  step: 0,        // quest step within chapter
  scrolls: [],    // ids of collected wisdom scrolls
  flags: {},
  muted: false,
  time: 0,        // global animation clock (seconds)
  night: 0,       // 0 day .. 1 night (world tint)
};

function saveGame(){
  try{
    localStorage.setItem('festivalquest_save', JSON.stringify({
      name:G.name, ch:G.ch, step:G.step, scrolls:G.scrolls, muted:G.muted, look:G.look||null
    }));
  }catch(e){}
}
function loadGame(){
  try{
    const d = JSON.parse(localStorage.getItem('festivalquest_save'));
    if (d && typeof d.ch === 'number'){ return d; }
  }catch(e){}
  return null;
}
function clearSave(){ try{ localStorage.removeItem('festivalquest_save'); }catch(e){} }

/* ---------- input ---------- */
const keys = {};       // held
const just = {};       // pressed this frame
const KEYMAP = {
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  KeyZ:'a', Enter:'a', Space:'dash',
  KeyX:'b', Escape:'b',
  KeyE:'interact', KeyJ:'journal', KeyM:'mute'
};
window.addEventListener('keydown', e=>{
  const k = KEYMAP[e.code];
  audioUnlock();
  if (typingMode){ handleTyping(e); e.preventDefault(); return; }
  if (k){ if(!keys[k]) just[k]=true; keys[k]=true; e.preventDefault(); }
});
window.addEventListener('keyup', e=>{
  const k = KEYMAP[e.code];
  if (k){ keys[k]=false; e.preventDefault(); }
});
/* touch buttons */
function bindBtn(id, name){
  const el = document.getElementById(id);
  const on  = e=>{ e.preventDefault(); audioUnlock(); if(!keys[name]) just[name]=true; keys[name]=true; };
  const off = e=>{ e.preventDefault(); keys[name]=false; };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}
bindBtn('t-up','up'); bindBtn('t-down','down'); bindBtn('t-left','left');
bindBtn('t-right','right'); bindBtn('t-a','a'); bindBtn('t-b','b'); bindBtn('t-j','journal');
window.addEventListener('touchstart', ()=> document.body.classList.add('touchmode'), {passive:true});

/* ---------- mouse / pointer ---------- */
const mouse = { x: LW/2, y: LH/2, over:false, down:false };
let tapPos = null;
function toLogical(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*LW, y:(e.clientY-r.top)/r.height*LH };
}
cv.addEventListener('pointermove', e=>{
  const q = toLogical(e); mouse.x = q.x; mouse.y = q.y; mouse.over = true;
});
cv.addEventListener('pointerleave', ()=>{ mouse.over = false; mouse.down = false; });
cv.addEventListener('pointerdown', e=>{
  audioUnlock();
  const q = toLogical(e);
  mouse.x = q.x; mouse.y = q.y; mouse.over = true; mouse.down = true;
  tapPos = q; just.click = true;
});
window.addEventListener('pointerup', ()=>{ mouse.down = false; });
/* was this click inside a rect? (logical px) */
function clickIn(x, y, w, h){
  return just.click && mouse.x >= x && mouse.x <= x+w && mouse.y >= y && mouse.y <= y+h;
}
function hoverIn(x, y, w, h){
  const hit = mouse.over && mouse.x >= x && mouse.x <= x+w && mouse.y >= y && mouse.y <= y+h;
  if (hit) mouse.ui = true;                 // the cursor turns gold over clickable things
  return hit;
}
/* angle from the player's chest to the cursor — used for aimed attacks */
function aimAngle(px, py){ return Math.atan2(mouse.y - py, mouse.x - px); }
function drawCursor(){
  if (!mouse.over) return;
  const s = topScene();
  const x = Math.round(mouse.x), y = Math.round(mouse.y);
  if (s && s.aim){
    const t = G.time;
    const g = mouse.down ? '#ffe9b0' : '#f2b632';
    for (const d of [-1, 1]){
      R(x + d*3, y-0.5, d*4, 1.4, '#2b1a26');
      R(x-0.5, y + d*3, 1.4, d*4, '#2b1a26');
      R(x + d*3.4, y, d*3, 1, g);
      R(x, y + d*3.4, 1, d*3, g);
    }
    circle(x, y, 1.4, '#2b1a26'); circle(x, y, 0.8, g);
    const r = 7 + Math.sin(t*4)*0.8;
    for (let i=0;i<4;i++){
      const a = i/4*Math.PI*2 + t*1.4;
      R(x+Math.cos(a)*r, y+Math.sin(a)*r, 1.4, 1.4, g);
    }
  } else {
    // a full pixel arrow: X = outline, o = fill; tip is the hotspot
    const px2 = x + (mouse.down ? 1 : 0), py2 = y + (mouse.down ? 1 : 0);
    const fill = mouse.down ? '#ffe98a' : mouse.ui ? '#ffd964' : '#f6f2e6';
    for (let r2 = 0; r2 < CURSOR_MAP.length; r2++){
      const row = CURSOR_MAP[r2];
      for (let c2 = 0; c2 < row.length; c2++){
        const ch2 = row[c2];
        if (ch2 === '.') continue;
        R(px2 + c2, py2 + r2, 1, 1, ch2 === 'X' ? '#2b1a26' : fill);
      }
    }
  }
}
/* the arrow, one char per logical pixel */
const CURSOR_MAP = [
  'X.......',
  'XX......',
  'XoX.....',
  'XooX....',
  'XoooX...',
  'XooooX..',
  'XoooooX.',
  'XooooooX',
  'XoooXXXX',
  'XooX....',
  'XoX.....',
  'XX......',
  'X.......',
];

/* ---------- text helpers ---------- */
const FONT = '"Courier New", monospace';
function T(str, x, y, size=7, color='#f4e8d0', align='left', bold=true){
  cx.font = (bold?'bold ':'') + (size*P) + 'px ' + FONT;
  cx.textAlign = align; cx.textBaseline = 'top';
  cx.fillStyle = color;
  cx.fillText(str, x*P, y*P);
}
function Tsh(str, x, y, size=7, color='#f4e8d0', align='left', shadow='rgba(0,0,0,0.55)'){
  cx.font = 'bold ' + (size*P) + 'px ' + FONT;
  cx.textAlign = align; cx.textBaseline = 'top';
  cx.fillStyle = shadow; cx.fillText(str, x*P+P, y*P+P);
  cx.fillStyle = color;  cx.fillText(str, x*P, y*P);
}
function textW(str, size=7){
  cx.font = 'bold ' + (size*P) + 'px ' + FONT;
  return cx.measureText(str).width / P;
}
function wrap(str, maxW, size=7){
  const words = String(str).split(' ');
  const lines = []; let line = '';
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (textW(test, size) > maxW && line){ lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

/* ---------- rectangles & boxes ---------- */
/* every rect snaps to the LOGICAL pixel grid so everything reads as true pixel art */
function R(x,y,w,h,color){
  const rx = Math.round(x), ry = Math.round(y);
  let rw = Math.round(x+w) - rx, rh = Math.round(y+h) - ry;
  if (rw===0) rw = w>=0 ? 1 : -1;
  if (rh===0) rh = h>=0 ? 1 : -1;
  cx.fillStyle = color;
  cx.fillRect(rx*P, ry*P, rw*P, rh*P);
}
function box(x,y,w,h, opts={}){
  const bg = opts.bg || 'rgba(20,12,16,0.94)';
  const border = opts.border || '#f2b632';
  R(x-1,y-1,w+2,h+2, border);
  R(x,y,w,h, bg);
  // corner studs
  const c = opts.stud || '#e03c28';
  R(x-1,y-1,2,2,c); R(x+w-1,y-1,2,2,c); R(x-1,y+h-1,2,2,c); R(x+w-1,y+h-1,2,2,c);
}

/* ---------- particles ---------- */
let parts = [];
function spawnPart(p){ parts.push(p); if (parts.length>400) parts.splice(0, parts.length-400); }
function burst(x,y,colors,n=26,spd=60){
  for(let i=0;i<n;i++){
    const a = rnd(Math.PI*2), s = rnd(spd*0.3, spd);
    spawnPart({x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rnd(0.5,1.1), t:0,
      c:pick(colors), g:34, sz:rnd(1,2.4)});
  }
}
function updateParts(dt){
  for (const p of parts){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.g||0)*dt; }
  parts = parts.filter(p=> p.t < p.life);
}
function drawParts(camx=0, camy=0){
  for (const p of parts){
    cx.globalAlpha = clamp(1 - p.t/p.life, 0, 1);
    R(p.x-camx, p.y-camy, p.sz, p.sz, p.c);
  }
  cx.globalAlpha = 1;
}

/* ---------- audio (WebAudio, all generated) ---------- */
let AC = null, masterGain = null, musicGain = null, musicTimer = null, musicChapter = -1;
function audioUnlock(){
  if (!AC){
    try{
      AC = new (window.AudioContext||window.webkitAudioContext)();
      masterGain = AC.createGain(); masterGain.gain.value = G.muted?0:0.5; masterGain.connect(AC.destination);
      musicGain = AC.createGain(); musicGain.gain.value = 0.42; musicGain.connect(masterGain);
    }catch(e){}
  }
  if (AC && AC.state==='suspended') AC.resume();
}
function setMuted(m){ G.muted=m; if (masterGain) masterGain.gain.value = m?0:0.5; saveGame(); }
function tone(freq, dur=0.12, type='triangle', vol=0.5, when=0, dest){
  if (!AC) return;
  const t0 = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  o.connect(g); g.connect(dest||masterGain);
  o.start(t0); o.stop(t0+dur+0.02);
}
function noiseHit(dur=0.2, vol=0.5, low=false){
  if (!AC) return;
  const n = AC.sampleRate*dur, buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
  const s = AC.createBufferSource(); s.buffer = buf;
  const g = AC.createGain(); g.gain.value = vol;
  if (low){ const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=300; s.connect(f); f.connect(g); }
  else s.connect(g);
  g.connect(masterGain); s.start();
}
const SFX = {
  blip(){ tone(660,0.05,'square',0.12); },
  select(){ tone(523,0.07,'square',0.2); tone(784,0.09,'square',0.2,0.06); },
  back(){ tone(392,0.08,'square',0.15); },
  scroll(){ [523,659,784,1047].forEach((f,i)=> tone(f,0.14,'triangle',0.3,i*0.09)); },
  good(){ tone(659,0.09,'triangle',0.35); tone(988,0.14,'triangle',0.35,0.08); },
  bad(){ tone(196,0.2,'sawtooth',0.2); },
  boom(){ noiseHit(0.35,0.6); tone(80,0.3,'sine',0.5); },
  drum(){ noiseHit(0.12,0.35,true); tone(70,0.18,'sine',0.7); },
  gong(){ tone(196,1.6,'sine',0.5); tone(294,1.2,'sine',0.25,0.02); noiseHit(0.4,0.12); },
  sparkle(){ [1319,1568,2093].forEach((f,i)=> tone(f,0.1,'sine',0.2,i*0.05)); },
  win(){ [523,659,784,1047,1319].forEach((f,i)=> tone(f,0.22,'triangle',0.35,i*0.11)); },
};

/* looping pentatonic music — one melody per chapter, guzheng-ish plucks */
const MELODIES = [
  // intro/home & title: gentle D pentatonic
  { bpm:96,  bass:[147,110,131,110], notes:[587,659,880,784,659,587,440,523, 587,659,784,880,1047,880,784,659] },
  // ch1 New Year: festive
  { bpm:132, bass:[196,147,175,147], notes:[784,880,1047,880,784,659,587,659, 784,1047,1175,1047,880,784,659,587] },
  // ch2 Dragon Boat: driving
  { bpm:120, bass:[110,110,131,131], notes:[440,523,587,523,440,392,330,392, 440,587,659,587,523,440,392,330] },
  // ch3 Mid-Autumn: moonlit lullaby
  { bpm:76,  bass:[131,98,110,98],  notes:[523,587,659,784,659,587,523,440, 523,659,587,523,440,392,440,523] },
];
function playMusic(idx){
  if (musicChapter === idx) return;
  musicChapter = idx;
  if (musicTimer){ clearInterval(musicTimer); musicTimer = null; }
  if (idx < 0) return;
  let step = 0;
  const play = ()=>{
    if (!AC) return;
    const m = MELODIES[idx];
    const n = m.notes[step % m.notes.length];
    if (n) { tone(n, 0.34, 'triangle', 0.16, 0, musicGain); tone(n*2, 0.18, 'sine', 0.05, 0, musicGain); }
    if (step % 4 === 0){ tone(m.bass[(step/4) % m.bass.length], 0.5, 'sine', 0.1, 0, musicGain); }
    if (idx===2 && step%2===0){ tone(65,0.1,'sine',0.12,0,musicGain); } // boat drums
    step++;
  };
  const m = MELODIES[idx];
  musicTimer = setInterval(play, Math.round(60000 / m.bpm / 2));
}

/* ---------- scene manager ---------- */
const stack = [];
function pushScene(s){ stack.push(s); if (s.enter) s.enter(); }
function popScene(){ const s = stack.pop(); if (s && s.exit) s.exit(); }
function swapScene(s){ while(stack.length) popScene(); pushScene(s); }
function topScene(){ return stack[stack.length-1]; }

/* ---------- main loop ---------- */
let lastT = performance.now(), acc = 0, crashN = 0;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - lastT)/1000; lastT = now;
  if (dt > 0.25) dt = 0.25;
  G.time += dt;
  const s = topScene();
  try {
    if (s){
      // SPACE dashes only in scenes that use it; everywhere else it confirms
      if (just.dash && !s.usesDash) just.a = true;
      if (s.update) s.update(dt);
      // render from the lowest opaque scene upward (overlays draw on top)
      let start = stack.length-1;
      while (start>0 && stack[start].overlay) start--;
      for (let i=start;i<stack.length;i++) if (stack[i].render) stack[i].render();
      drawCursor();
    }
    crashN = 0;
  } catch(err){
    // one broken frame must never freeze the whole game on a black screen:
    // after repeated crashes, drop the broken scene (or fall back to the title)
    crashN++;
    try { console.error('scene crash:', err); } catch(e2){}
    if (crashN > 12){
      crashN = 0;
      try {
        typingMode = false;
        fade.a = 0; fade.target = 0; fade.cb = null;
        if (stack.length > 1) popScene();
        else swapScene(titleScene);
      } catch(e3){ stack.length = 0; try { pushScene(titleScene); } catch(e4){} }
    }
  }
  for (const k in just) just[k] = false;
  tapPos = null;
  mouse.ui = false;
  if (just.mute) {}
}
/* global mute key */
window.addEventListener('keydown', e=>{ if (e.code==='KeyM' && !typingMode) setMuted(!G.muted); });

/* fade transition helper */
let fade = { a:0, target:0, speed:2.5, cb:null };
function fadeOut(cb, speed=2.5){ fade.target = 1; fade.speed = speed; fade.cb = cb; }
function fadeIn(speed=2.5){ fade.target = 0; fade.speed = speed; fade.cb = null; }
function updateFade(dt){
  if (fade.a < fade.target){ fade.a = Math.min(fade.target, fade.a + fade.speed*dt);
    if (fade.a>=1 && fade.cb){ const c=fade.cb; fade.cb=null; c(); } }
  else if (fade.a > fade.target){ fade.a = Math.max(fade.target, fade.a - fade.speed*dt); }
}
function drawFade(){
  if (fade.a>0){ cx.globalAlpha = fade.a; R(0,0,LW,LH,'#0c0a14'); cx.globalAlpha = 1; }
}

/* typing mode (name entry) */
let typingMode = false;
let typedName = '';
function handleTyping(e){
  if (e.code === 'Backspace'){ typedName = typedName.slice(0,-1); SFX.blip(); return; }
  if (e.code === 'Enter'){ finishTyping(); return; }
  if (/^[a-zA-Z0-9]$/.test(e.key) && typedName.length < 8){ typedName += e.key; SFX.blip(); }
}
let finishTyping = ()=>{};
/* ============================================================
   SOUND II — traditional-style Chinese music + character voices
   guzheng (Karplus-Strong pluck), dizi flute, woodblock, gong;
   per-character voice babble + optional read-aloud (V to toggle)
   ============================================================ */

/* ---------- instruments ---------- */
const ksCache = {};
function pluckBuffer(freq){
  const key = Math.round(freq);
  if (ksCache[key]) return ksCache[key];
  const sr = AC.sampleRate, N = Math.max(2, Math.floor(sr/freq));
  const len = Math.floor(sr*1.4);
  const buf = AC.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  const ring = new Float32Array(N);
  for (let i=0;i<N;i++) ring[i] = Math.random()*2-1;
  let idx = 0;
  const damp = 0.995;
  for (let i=0;i<len;i++){
    d[i] = ring[idx];
    ring[idx] = (ring[idx] + ring[(idx+1)%N]) * 0.5 * damp;
    idx = (idx+1)%N;
  }
  ksCache[key] = buf;
  return buf;
}
function zheng(freq, vol=0.5, when=0, dur=1.2){
  if (!AC) return;
  const t0 = AC.currentTime + when;
  const src = AC.createBufferSource();
  src.buffer = pluckBuffer(freq);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  src.connect(g); g.connect(musicGain);
  src.start(t0); src.stop(t0+dur+0.05);
}
function dizi(freq, dur=0.5, vol=0.22, when=0){
  if (!AC) return;
  const t0 = AC.currentTime + when;
  const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
  const o2 = AC.createOscillator(); o2.type = 'triangle'; o2.frequency.value = freq*2; // breathy overtone
  const lfo = AC.createOscillator(); lfo.frequency.value = 5.2;
  const lfoG = AC.createGain(); lfoG.gain.value = freq*0.012;
  lfo.connect(lfoG); lfoG.connect(o.frequency);

function playMusic(idx){
  if (musicChapter === idx) return;
  musicChapter = idx;
  if (musicTimer){ clearInterval(musicTimer); musicTimer = null; }
  if (idx < 0 || !SONGS[idx]) return;
  const song = SONGS[idx];
  let st = 0;
  const stepDur = 60/song.bpm/2;
  const tick = ()=>{
    if (!AC) return;
    const m = song.mel[st % song.mel.length];
    if (m > 0){
      // measure how long the note holds
      let hold = 1;
      while (song.mel[(st+hold) % song.mel.length] === -1 && hold < 8) hold++;
      const dur = hold*stepDur;
      if (song.inst==='dizi') dizi(mf(m), dur+0.1, song.vol*0.75);
      else {
        // occasional grace note, guzheng style
        if (st % 16 === 0 && ((st*7)%3===0)) zheng(mf(m+2), song.vol*0.3, 0, 0.3);
        zheng(mf(m), song.vol, 0.02, Math.max(0.7, dur+0.4));
      }
    }
    const b = song.bass[st % song.bass.length];
    if (b > 0) zheng(mf(b), song.vol*0.55, 0, 1.6);
    song.perc(st);
    st++;
  };
  musicTimer = setInterval(tick, Math.round(stepDur*1000));
}

function voiceBlip(v, i, ahead){
  if (!AC || G.muted) return;
  const jitter = ((((i*2654435761)>>>0) % 100) / 100 - 0.5) * 0.8;   // ± ~0.4 semitone
  const semi = v.mel[i % v.mel.length] + jitter;
  const f = v.f * Math.pow(2, semi/12);
  // pitch contour: rise into "?", fall into "." or "!", else drift toward next melody note
  let dir = (v.mel[(i+1) % v.mel.length] - v.mel[i % v.mel.length]) * 0.4;
  if (ahead && ahead.indexOf('?') >= 0) dir = 3.4;
  else if (ahead && (ahead.indexOf('.') >= 0 || ahead.indexOf('!') >= 0)) dir = -3.2;
  const f2 = f * Math.pow(2, dir/12);
  const t0 = AC.currentTime, dur = v.len;
  const o = AC.createOscillator(); o.type = v.type;
  o.frequency.setValueAtTime(f, t0);
  o.frequency.linearRampToValueAtTime(f2, t0+dur);
  if (v.trem){                                    // aged warble
    const lfo = AC.createOscillator(); lfo.frequency.value = v.trem;
    const lg = AC.createGain(); lg.gain.value = f*0.035;
    lfo.connect(lg); lg.connect(o.frequency); lfo.start(t0); lfo.stop(t0+dur+0.02);
  }
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(v.vol, t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  if (v.lp){
    const flt = AC.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value = v.lp;
    o.connect(g); g.connect(flt); flt.connect(masterGain);
  } else { o.connect(g); g.connect(masterGain); }
  o.start(t0); o.stop(t0+dur+0.02);
  if (v.sub){                                     // dragon body
    const s2 = AC.createOscillator(); s2.type='sine';
    s2.frequency.setValueAtTime(f/2, t0);
    s2.frequency.linearRampToValueAtTime(f2/2, t0+dur*1.3);
    const g2 = AC.createGain(); g2.gain.setValueAtTime(0.28, t0);
    g2.gain.exponentialRampToValueAtTime(0.001, t0+dur*1.3);
    s2.connect(g2); g2.connect(masterGain); s2.start(t0); s2.stop(t0+dur*1.3+0.02);
  }
}

const CJK = '"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Microsoft YaHei","SimSun",serif';
function hanzi(str, x, y, size, color, align='center'){
  cx.font = (size*P)+'px '+CJK;
  cx.textAlign = align; cx.textBaseline = 'middle';
  cx.fillStyle = color; cx.fillText(str, x*P, y*P);
}

function glow(x,y,r,color,alpha=0.35){
  const gx = x*P, gy = y*P, gr = r*P;
  const g = cx.createRadialGradient(gx,gy,1,gx,gy,gr);
  g.addColorStop(0,color); g.addColorStop(1,'rgba(0,0,0,0)');
  cx.globalAlpha = alpha; cx.fillStyle = g;
  cx.fillRect(gx-gr,gy-gr,gr*2,gr*2);
  cx.globalAlpha = 1;
}
/* pixel-perfect circle: integer scanline runs, no anti-aliasing */
function circle(x,y,r,color){
  cx.fillStyle = color;
  const cxi = Math.round(x), cyi = Math.round(y), rr = Math.max(r, 0.5);
  const RY = Math.round(rr);
  for (let dy=-RY; dy<=RY; dy++){
    const t = rr*rr - dy*dy;
    if (t < 0) continue;
    const half = Math.round(Math.sqrt(t));
    cx.fillRect((cxi-half)*P, (cyi+dy)*P, (half*2+1)*P, P);
  }
}
/* pixel ellipse + upper-half dome */
function ell(x,y,rx,ry,color){
  cx.fillStyle = color;
  const cxi = Math.round(x), cyi = Math.round(y), RY = Math.max(1, Math.round(ry));
  for (let dy=-RY; dy<=RY; dy++){
    const f = 1 - (dy*dy)/(ry*ry || 1);
    if (f < 0) continue;
    const half = Math.round(rx*Math.sqrt(f));
    cx.fillRect((cxi-half)*P, (cyi+dy)*P, (half*2+1)*P, P);
  }
}
function dome(x,y,rx,ry,color){
  cx.fillStyle = color;
  const cxi = Math.round(x), cyi = Math.round(y), RY = Math.max(1, Math.round(ry));
  for (let dy=-RY; dy<=0; dy++){
    const f = 1 - (dy*dy)/(ry*ry || 1);
    if (f < 0) continue;
    const half = Math.round(rx*Math.sqrt(f));
    cx.fillRect((cxi-half)*P, (cyi+dy)*P, (half*2+1)*P, P);
  }
}

/* deterministic per-tile hash for texture specks */
function thash(a,b){ let h = (a*73856093) ^ (b*19349663); h = (h ^ (h>>13)) * 1274126177; return Math.abs(h % 1000)/1000; }

/* ---------- people (procedural pixel folk) ---------- */
/* anchor: x = center of feet, y = ground line */
function drawPerson(x, y, o, t=0){
  x = Math.round(x); y = Math.round(y);
  const walking = o.walk;
  const fr = walking ? Math.floor(t*9)%2 : 0;
  const child = o.child, elder = o.elder;
  const legH = child?3:4, torsoH = child?6:7, headH = child?8:7, headW = child?9:8;
  const bob = (walking && fr===1) ? 1 : 0;
  const top = o.top||'#c02c20', pants = o.pants||'#3a3a55',
        skin = o.skin||'#eac086', hair = o.hair||'#181418';
  // shadow
  cx.fillStyle='rgba(0,0,0,0.22)';
  cx.fillRect((x-5)*P,(y-1)*P,10*P,2*P);
  // legs
  const lys = y-legH, ll = fr===1?1:0, rl = fr===1?0:1;
  R(x-4, lys-(walking?ll:0), 3, legH+(walking?ll:0), pants);
  R(x+1, lys-(walking?rl:0), 3, legH+(walking?rl:0), pants);
  // torso
  const ty = y-legH-torsoH-bob;
  R(x-5, ty, 10, torsoH, top);
  // simple robe trim for elders
  if (elder) R(x-5, ty+torsoH-2, 10, 1, '#f2b632');
  // arms
  R(x-7, ty+1, 2, torsoH-2, top);
  R(x+5, ty+1, 2, torsoH-2, top);
  R(x-7, ty+torsoH-2, 2, 2, skin);
  R(x+5, ty+torsoH-2, 2, 2, skin);
  // head
  const hy = ty-headH+(elder?1:0);
  R(x-headW/2, hy, headW, headH, skin);
  // hair
  if (o.dir==='up'){
    R(x-headW/2, hy-1, headW, headH-2, hair);
  } else {
    R(x-headW/2, hy-1, headW, 3, hair);
    R(x-headW/2, hy+1, 2, 2, hair);
    R(x+headW/2-2, hy+1, 2, 2, hair);
    if (o.buns){ R(x-headW/2-2, hy-1, 3, 3, hair); R(x+headW/2-1, hy-1, 3, 3, hair); }
    if (o.bun){ R(x-1, hy-3, 3, 3, hair); }
    // eyes
    const eyeY = hy+3;
    if (o.dir==='left'){ R(x-3, eyeY, 2, 2, '#241a14'); }
    else if (o.dir==='right'){ R(x+1, eyeY, 2, 2, '#241a14'); }
    else { R(x-3, eyeY, 2, 2, '#241a14'); R(x+1, eyeY, 2, 2, '#241a14'); }
    if (o.beard){ R(x-2, hy+headH-1, 4, 2, '#e8e4dc'); }  // beard
    if (o.blush) { R(x-headW/2+1, eyeY+2, 1, 1, '#e8927c'); R(x+headW/2-2, eyeY+2, 1, 1, '#e8927c'); }
  }
  if (o.hat){ // straw hat
    R(x-headW/2-2, hy-1, headW+4, 2, '#c8a860');
    R(x-2, hy-3, 5, 2, '#c8a860');
  }
}

/* ---------- Lóng the paper dragon (follows the player) ---------- */
function drawLong(x, y, t, flip=false){
  const dirM = flip?-1:1;
  // body segments trail behind the head in a sine wave
  for (let i=5;i>=1;i--){
    const sx = x - dirM*i*5;
    const sy = y + Math.sin(t*3 + i*0.9)*2.5;
    circle(sx, sy, i===5?2:3.2, i%2? '#e03c28' : '#f2b632');
    if (i%2===0) circle(sx, sy-1, 1.2, '#f8e0a0');
  }
  const hy = y + Math.sin(t*3)*2.5;
  // head
  R(x-6, hy-4, 12, 8, '#f2b632');
  R(x-6+(flip?0:8), hy-2, 4, 4, '#f8e0a0');       // snout
  R(x-2, hy-6, 4, 2, '#e03c28');                   // brow
  R(x-6, hy-6, 2, 3, '#e03c28'); R(x+4, hy-6, 2, 3, '#e03c28'); // horns
  R(x+(flip?-4:2), hy-3, 2, 2, '#241a14');         // eye
  // whiskers
  R(x+(flip?-9:7), hy+1, 3, 1, '#e03c28');
  R(x+(flip?-8:6), hy+3, 2, 1, '#e03c28');
  glow(x, hy, 10, '#f2b632', 0.12);
}

  const d = (dir==='up') ? 'up' : (dir==='down') ? 'down' : 'side';
  return spec[d] || null;
}

/* shade helper: darken/lighten a hex color */
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  r = clamp(Math.round(r*f), 0, 255); g = clamp(Math.round(g*f), 0, 255); b = clamp(Math.round(b*f), 0, 255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function chibiPalette(look){
  const skin = look.skin||'#f2c896', hair = look.hair||'#241a1e',
        top  = look.top ||'#e03c28', legs = look.pants||'#3a4a8a';
  return {
    o:'#2b1a26',
    H:hair, h:shade(hair,1.6),
    S:skin, s:shade(skin,0.82),
    W:'#ffffff', E:'#241a20',
    T:top, t:shade(top,0.72),
    L:legs, F:shade(legs,0.55),
    G:'#e8b028', R:'#d43424', Y:'#d8b869', D:'#ece8e0', P:'#f2a08c',
  };
}
function composeRows(dir, frame, robe){
  const head = dir==='up'? HEAD_UP : dir==='down'? HEAD_DOWN : HEAD_SIDE;
  let body;
  if (robe) body = (dir==='up'||dir==='down') ? ROBE_DOWN : ROBE_SIDE;
  else if (dir==='up'||dir==='down') body = frame===1 ? BODY_DOWN_1 : BODY_DOWN_0;
  else body = frame===1 ? BODY_SIDE_1 : BODY_SIDE_0;
  return [PAD, ...head, ...body];
}
function paintRows(ctx2, rows, pal){
  for (let y=0;y<rows.length;y++){
    const row = rows[y];
    if (row.length !== 16) { console.error('BAD SPRITE ROW len '+row.length+': "'+row+'"'); }
    for (let x=0;x<row.length;x++){
      const ch = row[x];
      if (ch==='.') continue;
      const c = pal[ch];
      if (!c){ console.error('BAD SPRITE CHAR "'+ch+'" in "'+row+'"'); continue; }
      ctx2.fillStyle = c;
      ctx2.fillRect(x*P, y*P, P, P);
    }
  }
}
const chibiCache = {};
function chibiSprite(look, dir, frame){
  const key = [look.skin,look.hair,look.top,look.pants,look.hairstyle||'',look.elder?1:0,look.buns?1:0,
               look.bun?1:0,look.hat?1:0,look.beard?1:0,look.glasses?1:0,look.blush?1:0,look.band?1:0,
               dir,frame].join('|');
  if (chibiCache[key]) return chibiCache[key];
  const mirror = dir==='right';
  const d = mirror ? 'left' : dir;
  const c = document.createElement('canvas');
  c.width = 16*P; c.height = 20*P;
  const ctx2 = c.getContext('2d');
  const pal = chibiPalette(look);
  paintRows(ctx2, composeRows(d, frame, !!look.elder), pal);
  const applyOv = spec => { const m = ovFor(spec, d); if (m) paintRows(ctx2, m, pal); };
  if (look.hairstyle==='long') applyOv(OV_LONG);
  if (look.hairstyle==='pony') applyOv(OV_PONY);
  if (look.buns || look.hairstyle==='buns') applyOv(OV_BUNS);
  if (look.bun) applyOv(OV_BUN);
  if (look.hat) applyOv(OV_HAT);
  if (look.band) applyOv(OV_BAND);
  if (look.beard) applyOv(OV_BEARD);
  if (look.glasses) applyOv(OV_GLASSES);
  if (look.blush || look.buns) applyOv(OV_BLUSH);
  if (mirror){
    const m = document.createElement('canvas');
    m.width = c.width; m.height = c.height;
    const mc = m.getContext('2d');
    mc.translate(c.width, 0); mc.scale(-1,1); mc.drawImage(c, 0, 0);
    chibiCache[key] = m; return m;
  }
  chibiCache[key] = c;
  return c;
}

/* replaces the old rectangle people */
function drawPerson(x, y, o, t=0){
  x = Math.round(x); y = Math.round(y);
  const dir = o.dir || 'down';
  let frame = 0, bob = 0;
  if (o.walk){
    const ph = Math.floor(t*8)%4;
    if (dir==='left'||dir==='right'){ frame = (ph%2===0)?1:0; }
    else { frame = ph===1?1: ph===3?2:0; }
    bob = (ph%2===1)?-1:0;
  }
  cx.fillStyle='rgba(20,8,16,0.25)';
  cx.fillRect((x-5)*P,(y-2)*P,10*P,3*P);
  if (frame===2){   // mirrored step for down/up
    const spr = chibiSprite(o, dir, 1);
    cx.save();
    cx.translate(x*P, 0); cx.scale(-1,1);
    cx.drawImage(spr, -8*P, (y-20+bob)*P);

  }
  const spr = chibiSprite(o, dir, frame);
  cx.drawImage(spr, (x-8)*P, (y-20+bob)*P);

   CREATURES — Lóng & Nian, hero-sprite quality
   deep outlines, 3-4 tone ramps, top-left light

/* pixel-perfect triangle: integer scanline runs, no anti-aliasing */
function tri(x1,y1,x2,y2,x3,y3,c){
  cx.fillStyle = c;
  const pts = [[Math.round(x1),Math.round(y1)],[Math.round(x2),Math.round(y2)],[Math.round(x3),Math.round(y3)]]
    .sort((a,b)=>a[1]-b[1]);
  const A = pts[0], B = pts[1], C = pts[2];
  const xAt = (p,q,y)=> p[1]===q[1] ? p[0] : p[0] + (q[0]-p[0])*(y-p[1])/(q[1]-p[1]);
  for (let y=A[1]; y<=C[1]; y++){
    const xa = xAt(A, C, y);
    const xb = y < B[1] ? xAt(A, B, y) : xAt(B, C, y);
    const lo = Math.round(Math.min(xa,xb)), hi = Math.round(Math.max(xa,xb));
    cx.fillRect(lo*P, y*P, (hi-lo+1)*P, P);
  }
}
const INK = '#1a1016';

/* gold-shaded blob (dragon) */
function gblob(x, y, r){
  circle(x, y, r+0.9, INK);
  circle(x, y, r, '#c07c1c');
  circle(x-r*0.12, y-r*0.22, r*0.82, '#f2b632');
  circle(x-r*0.32, y-r*0.42, r*0.42, '#ffe27a');
}
/* green-shaded blob (nian) */
function nblob(x, y, r, hi){
  circle(x, y, r+0.9, INK);
  circle(x, y, r, '#2a6620');
  circle(x-r*0.12, y-r*0.22, r*0.82, '#48962c');
  if (hi!==false) circle(x-r*0.32, y-r*0.42, r*0.42, '#7cc93e');
}

/* ---------- LÓNG the dragon ---------- */
function drawLong(hx, hy, t, flip=false, sc=1){
  cx.save();
  cx.imageSmoothingEnabled = false;
  cx.translate(hx*P, hy*P); cx.scale(sc, sc); cx.translate(-hx*P, -hy*P);
  const D = flip ? -1 : 1;
  const N = 11, SP = 5.2, RR = 5;
  const bx = i => hx - D*(8 + i*SP);
  const by = i => hy + 5.5 + Math.sin(t*2.6 + i*0.55)*3.4;
  // tail fan (behind everything)
  const tx2 = bx(N+0.6), ty2 = by(N+0.6);
  tri(tx2+D*3, ty2, tx2-D*7, ty2-7, tx2-D*9, ty2, INK);
  tri(tx2+D*3, ty2, tx2-D*9, ty2, tx2-D*7, ty2+7, INK);
  tri(tx2+D*2, ty2-0.4, tx2-D*6, ty2-5.6, tx2-D*7.6, ty2-0.4, '#d43424');
  tri(tx2+D*2, ty2+0.4, tx2-D*7.6, ty2+0.4, tx2-D*6, ty2+5.6, '#8a1c14');
  tri(tx2+D*1.4, ty2-0.6, tx2-D*4, ty2-3.4, tx2-D*5, ty2-0.6, '#ff8656');
  // dorsal fins (every other segment, drawn before the tube so they poke out the top)
  for (let i=N;i>=0;i-=2){
    const sx = bx(i), sy = by(i);
    tri(sx-3.6, sy-2.6, sx-D*1, sy-9.8, sx+3.6, sy-2.6, INK);
    tri(sx-2.6, sy-3, sx-D*1, sy-8.6, sx+2.6, sy-3, '#d43424');
    tri(sx-1.8, sy-3.2, sx-D*1.2, sy-7.6, sx+0.2, sy-3.2, '#ff8656');
  }
  // continuous tube body: outline pass, base pass, light pass
  for (let i=N;i>=0;i--) circle(bx(i), by(i), RR+0.9, INK);
  for (let i=N;i>=0;i--) circle(bx(i), by(i), RR, '#c07c1c');
  for (let i=N;i>=0;i--) circle(bx(i)-0.6, by(i)-1.2, RR*0.78, '#f2b632');
  for (let i=N;i>=0;i--) circle(bx(i)-1.4, by(i)-2, RR*0.4, '#ffe27a');
  // belly plates
  for (let i=N;i>=0;i--){
    const sx = bx(i), sy = by(i);
    R(sx-2.8, sy+1.6, 5.6, 2, '#f0d898');
    R(sx-2, sy+3.6, 4, 1, '#f0d898');
    R(sx-2, sy+2.6, 4, 1, '#c8a05c');
  }
  // scale ticks
  for (let i=N-1;i>=1;i-=2){
    R(bx(i)+D*2.6, by(i)-2.4, 1, 3, '#9c6114');
    R(bx(i)+D*3.4, by(i)-1, 1, 2, '#9c6114');
  }
  // little clawed legs
  for (const i of [3, 8]){
    const sx = bx(i), sy = by(i);
    R(sx-1.4, sy+3.8, 3, 4.8, INK); R(sx-0.8, sy+4.2, 1.8, 3.8, '#c07c1c'); R(sx-0.8, sy+4.2, 1, 2, '#f2b632');
    R(sx-3, sy+8, 6, 2.2, INK);
    R(sx-2.5, sy+8.3, 1.5, 1.5, '#e8d8b8'); R(sx-0.3, sy+8.3, 1.5, 1.5, '#e8d8b8'); R(sx+1.6, sy+8.3, 1.2, 1.5, '#e8d8b8');
  }
  /* ----- head (chunky, facing D) ----- */
  // mane: layered spikes anchored to the back of the skull
  const MSP = [[-2,-6,-11,-10],[-3,-3,-13,-4],[-3,1,-13,3],[-2,4,-11,8]];
  for (const [ax1, ay1, ax2, ay2] of MSP){
    tri(hx+D*ax1, hy+ay1-2, hx+D*ax2, hy+ay2, hx+D*ax1, hy+ay1+2.6, INK);
  }
  MSP.forEach(([ax1, ay1, ax2, ay2], k)=>{
    tri(hx+D*(ax1+0.6), hy+ay1-1.4, hx+D*(ax2+1.6), hy+ay2, hx+D*(ax1+0.6), hy+ay1+2, k%2 ? '#d43424' : '#8a1c14');
    if (k%2===0) tri(hx+D*(ax1+0.6), hy+ay1-0.8, hx+D*((ax1+ax2)/2), hy+(ay1+ay2)/2, hx+D*(ax1+0.6), hy+ay1+1, '#ff8656');
  });
  // whiskers: dotted pixel strands trailing back
  for (const [y0, amp, ph] of [[3, 1.6, 0], [5, 2, 1.3]]){
    for (let k=0;k<9;k++){
      const wx = hx + D*(8 - k*2.3);
      const wy = hy + y0 + k*0.55 + Math.sin(t*2.6 + ph + k*0.5)*amp*(k/9);
      R(wx, wy, 1, 1, k<2 ? '#f2b632' : '#e8b028');
    }
  }
  // antlers: stepped beams sweeping up and BACK, deer-style, with a fork
  for (const ox of [1, 4.6]){
    const ax = hx + D*ox;
    for (let k=0;k<4;k++) R(ax - D*(k*1.5+1.3), hy-6.6-k*2, D*3, 3, INK);
    R(ax - D*9.2, hy-14.6, D*3.2, 2.8, INK);
    for (let k=0;k<4;k++) R(ax - D*(k*1.5+0.9), hy-6.2-k*2, D*2, 2.2, k<2 ? '#b08c5c' : '#e8d8b8');
    R(ax - D*8.8, hy-14.2, D*2.4, 1.8, '#e8d8b8');
  }
  // ear fin
  tri(hx-D*4, hy-4.5, hx-D*8.5, hy-7.5, hx-D*4, hy-1, INK);
  tri(hx-D*4, hy-4, hx-D*7.4, hy-6.4, hx-D*4, hy-1.4, '#d43424');
  // skull
  gblob(hx, hy-1, 6.6);
  // snout: broad, stepped
  R(hx+D*3, hy-3.4, D*10.6, 7, INK);
  R(hx+D*3, hy-2.6, D*9.8, 5.4, '#f2b632');
  R(hx+D*3, hy-2.6, D*9, 1.6, '#ffe27a');
  circle(hx+D*12.6, hy+0.2, 2.6, INK); circle(hx+D*12.2, hy, 2.1, '#f2b632');
  // nostril + bump
  R(hx+D*11.2, hy-2.2, D*1.6, 1.4, INK);
  R(hx+D*9.6, hy-3.6, D*2.6, 1.2, '#ffe27a');
  // brow ridge
  R(hx+D*0.6, hy-5.6, D*7, 2.4, INK);
  R(hx+D*1.2, hy-5, D*5.6, 1.4, '#c07c1c');
  // eye: big, glinty
  R(hx+D*1.6, hy-3.4, D*4, 3.6, INK);
  R(hx+D*2, hy-3, D*3.2, 2.8, '#ffffff');
  R(hx+D*3.6, hy-2.8, D*1.6, 2.4, '#18100e');
  R(hx+D*3.8, hy-2.6, D*0.8, 0.8, '#ffffff');
  // mouth: open with teeth + red inside
  R(hx+D*4, hy+3.2, D*9, 1.6, '#8a1c14');
  tri(hx+D*5, hy+3.2, hx+D*5.8, hy+4.6, hx+D*6.6, hy+3.2, '#fff3d0');
  tri(hx+D*8, hy+3.2, hx+D*8.8, hy+4.6, hx+D*9.6, hy+3.2, '#fff3d0');
  // lower jaw
  R(hx+D*3.6, hy+4.6, D*8.6, 2.6, INK);
  R(hx+D*4, hy+4.8, D*7.6, 1.8, '#c07c1c');
  tri(hx+D*11, hy+4.8, hx+D*11.8, hy+3.4, hx+D*12.6, hy+4.8, '#fff3d0');
  // chin barbel
  circle(hx+D*4.6, hy+8, 1.4, INK); circle(hx+D*4.4, hy+7.8, 0.9, '#f2b632');
  glow(hx, hy, 13, '#f2b632', 0.13);
  cx.restore();
}

/* ---------- NIAN the beast ---------- */
/* horizontal capsule: one solid mass, no bubble seams */
function capO(x1, x2, y, r, c){
  circle(x1, y, r, c); circle(x2, y, r, c);
  R(Math.min(x1,x2), y-r, Math.abs(x2-x1), r*2+1, c);
}
function drawNian(x, y, t, pose){

const PORT_W = 46, PORT_H = 54;
const portCache = {};

function portraitSprite(look){
  const key = JSON.stringify([look.skin,look.hair,look.top,look.pstyle,look.hairstyle,look.collar,
    look.elder?1:0,look.beard?1:0,look.goatee?1:0,look.bun?1:0,look.buns?1:0,look.hat?1:0,
    look.glasses?1:0,look.blush?1:0,look.band?1:0,look.jewel?1:0,look.mouth,look.face,look.eyes,look.dragon?1:0,look.nian?1:0]);
  if (portCache[key]) return portCache[key];
  const cnv = document.createElement('canvas');
  cnv.width = PORT_W*P; cnv.height = PORT_H*P;
  const old = cx; cx = cnv.getContext('2d');
  cx.imageSmoothingEnabled = false;
  paintPortrait(look);
  cx = old;
  portCache[key] = cnv;
  return cnv;
}
function drawPortraitCard(x, y, look){

  if (lk.dragon){ paintDragonPortrait(); return; }

  const skin = lk.skin||'#f2c896', S=skin, s=shade(skin,0.84), w2=shade(skin,1.1);

  const collar = lk.collar || (lk.elder?'hanfu':'jacket');
  const mouth = lk.mouth || 'smile';

  const FACES = {

    oval:{rx:9.2,  ry:11.8, chin:5.8, cheek:0.85, jaw:false},

  /* elder wrinkles */

/* Lóng's own portrait — fierce, flame-maned, reference style */
function paintDragonPortrait(){
  // night backdrop instead of parchment: Lóng is magic
  R(3,3,PORT_W-6,PORT_H-6,'#100c1e');
  for(let i=0;i<12;i++){ const h=thash(i,31); R(4+(h*89)%38, 4+(h*53)%46, 1, 1, '#3a3456'); }
  glow(24, 25, 20, '#f2b632', 0.15);
  const CXH = 21, CYH = 24;               // skull center
  // ---- flame mane: back arc only (behind the head) ----
  const flame = (ang, len, wdt, c) => {
    const bx1 = CXH + Math.cos(ang-wdt)*8.2, by1 = CYH + Math.sin(ang-wdt)*8.2;
    const bx2 = CXH + Math.cos(ang+wdt)*8.2, by2 = CYH + Math.sin(ang+wdt)*8.2;
    const tx3 = CXH + Math.cos(ang+0.18)*len, ty3 = CYH + Math.sin(ang+0.18)*len;
    tri(bx1, by1, tx3, ty3, bx2, by2, c);
  };
  for (let k=0;k<7;k++) flame(1.9 + k*0.38, 17+((k%3)*3), 0.21, '#5a1010');   // deep layer
  for (let k=0;k<6;k++) flame(2.02 + k*0.4, 13.5+((k%2)*3), 0.17, '#8a1c14');
  for (let k=0;k<5;k++) flame(2.14 + k*0.42, 11+((k%2)*2), 0.14, '#d43424');
  for (let k=0;k<3;k++) flame(2.5 + k*0.5, 9, 0.1, '#ff8656');
  // ---- horns sweeping back over the mane ----
  for (const [ox, oy, n] of [[19, 14, 4], [25, 13, 3]]){
    for (let k=0;k<n;k++) R(ox-k*2.2-1.2, oy-k*2.4-1.4, 3.4, 3.6, '#2b1a26');
    for (let k=0;k<n;k++) R(ox-k*2.2-0.8, oy-k*2.4-1, 2.2, 2.6, k<1?'#b08c5c':'#e8d8b8');
  }
  // ---- skull ----
  circle(CXH, CYH, 9, '#2b1a26');
  circle(CXH, CYH, 8.2, '#c07c1c');
  circle(CXH-1.4, CYH-1.8, 6.2, '#f2b632');
  circle(CXH-2.8, CYH-3.4, 3.2, '#ffe27a');
  // ---- snout: one long clean wedge ----
  R(26, 18.4, 15.6, 8.4, '#2b1a26');
  R(26, 19.2, 14.4, 6.8, '#f2b632');
  R(26, 19.2, 13.6, 2, '#ffe27a');
  dome(31, 19, 2.6, 1.8, '#ffe27a'); dome(37, 18.6, 2.4, 1.8, '#ffe27a');
  R(39.4, 21, 1.8, 1.8, '#2b1a26');                        // flared nostril
  R(40.6, 22.4, 1.4, 3, '#f2b632');                        // snout tip
  // ---- heavy brow + deep-set fierce eye ----
  R(22, 15, 12.6, 3.4, '#2b1a26');
  R(22.8, 15.6, 11, 2, '#c07c1c');
  R(22.8, 15.6, 11, 0.9, '#ffe27a');
  R(25, 18.2, 8.8, 5.2, '#2b1a26');                        // socket
  R(25.8, 19, 7.2, 3.6, '#ff9a2c');                        // amber eye
  R(28.8, 19, 1.8, 3.6, '#180c06');                        // slit pupil
  R(26.4, 19.6, 1.2, 1, '#fff3d0');                        // glint
  // ---- open jaws ----
  R(25, 26.8, 16.6, 4.4, '#5a0e0c');                        // mouth interior
  R(25, 26, 16.6, 1.2, '#2b1a26');                          // upper lip
  for (const [fx, fl] of [[28.4, 3.8], [33, 2.8], [37.6, 4.2]]){
    tri(fx-1.6, 27, fx, 27+fl, fx+1.6, 27, '#2b1a26');
    tri(fx-1.1, 27, fx, 26.8+fl, fx+1.1, 27, '#fff3d0');
  }
  R(27, 29.4, 8.6, 1.8, '#e0483a');                         // tongue
  tri(35.6, 29.4, 38.4, 30.2, 35.6, 31.2, '#e0483a');
  R(24.4, 31.2, 17.2, 3.6, '#2b1a26');                      // lower jaw
  R(25, 31.8, 16, 2.4, '#c07c1c');
  R(25, 31.8, 16, 1, '#f2b632');
  for (const fx of [30.4, 36.2]){
    tri(fx-1.5, 31.8, fx, 28.6, fx+1.5, 31.8, '#2b1a26');
    tri(fx-1, 31.8, fx, 29.2, fx+1, 31.8, '#fff3d0');
  }
  // chin fin
  tri(24.6, 34.2, 19.6, 39.6, 27, 35.6, '#2b1a26');
  tri(24.6, 34.2, 21.4, 38.4, 26.4, 35.2, '#d43424');
  // ---- whisker tendrils flowing back-down ----
  for (const [y0, ph] of [[33, 0], [35.6, 1.4]]){
    for (let k=0;k<10;k++){
      const wx = 39 - k*2.8;
      const wy = y0 + k*1.05 + Math.sin(ph + k*0.55)*2.2;
      R(wx, wy, 1.4, 1.4, k<3 ? '#ffe27a' : '#e8b028');
    }
  }
  // ---- chest coil in the corner ----
  circle(10, 47, 8, '#2b1a26'); circle(10, 47, 7.2, '#c07c1c');
  circle(8.6, 45.4, 4.4, '#f2b632');
  R(5, 48.6, 10, 1.6, '#f0d898'); R(6, 50.8, 8, 1.2, '#f0d898');
  R(13.6, 42.6, 1, 2.4, '#9c6114'); R(16, 45, 1, 2.4, '#9c6114');
}

/* ---------- the 15 Wisdom Scrolls ---------- */
const SCROLLS = {
  nian:      { ch:1, title:'The Legend of Nian',
    text:"Long ago, people told of Nian, a fierce beast that crept out of the sea every New Year's Eve to attack villages. Nian feared three things: the color red, bright light, and loud noise. That is why people still hang red decorations, light lanterns, and set off firecrackers today." },
  guonian:   { ch:1, title:'"Passing Over" the Year',
    text:"In Chinese, celebrating New Year is called Guo Nian, which can mean 'to pass over Nian.' Every family that makes it to morning has outlasted the beast for one more year." },
  sweep:     { ch:1, title:'Sweep Before, Never After',
    text:"Families clean the whole house BEFORE New Year's Day to sweep away last year's bad luck. But nobody sweeps ON New Year's Day itself. You might sweep the brand-new good luck right out the door!" },
  fu:        { ch:1, title:'The Upside-Down Fu',
    text:"The character Fu means good fortune. Many families paste it upside down on purpose: in Chinese, 'upside down' (dao) sounds just like 'to arrive' (dao). So an upside-down Fu announces that good fortune has arrived." },
  luckyfood: { ch:1, title:'Lucky Foods',
    text:"New Year foods are chosen for their meanings. Dumplings (jiaozi) are folded to look like ancient gold ingots, a wish for wealth. A whole fish (yu) sounds like the word for 'surplus,' so families say 'nian nian you yu': may every year have extra." },
  hongbao:   { ch:1, title:'Red Envelopes',
    text:"Elders give children red envelopes (hongbao) of lucky money called yasuiqian, 'money that presses down evil spirits.' The real gift is the blessing: the red paper carries wishes of luck and protection into the new year." },
  fifteen:   { ch:1, title:'Fifteen Days of New Year',
    text:"Lunar New Year begins on the first new moon of the lunar calendar and the festivities last about fifteen days, ending at the Lantern Festival on the first full moon, with lion and dragon dances, parades, and glowing lanterns." },
  quyuan:    { ch:2, title:'Qu Yuan the Poet',
    text:"Over 2,200 years ago, in the Warring States period, Qu Yuan was a loyal poet and minister of the kingdom of Chu. He wrote the famous poem 'Li Sao.' When his beloved kingdom fell, he was so heartbroken that he drowned himself in the Miluo River." },
  race:      { ch:2, title:'Why the Boats Race',
    text:"Villagers who loved Qu Yuan paddled out fast, beating drums and splashing their oars to keep the fish away from him. Dragon boat races today re-create that rescue dash: long painted boats, pounding drums, flying paddles." },
  zongzi:    { ch:2, title:'Zongzi',
    text:"People threw rice into the river so the fish would eat it instead of Qu Yuan. That grew into zongzi: sticky rice wrapped in bamboo or reed leaves. In northern China they are often sweet with dates; in the south, savory with pork or salted egg yolk." },
  unesco:    { ch:2, title:'A World Treasure',
    text:"In 2009, the Dragon Boat Festival became the first Chinese festival added to UNESCO's list of the Intangible Cultural Heritage of Humanity. The whole world now helps protect its story." },
  herbs:     { ch:2, title:'The Poison Month',
    text:"The festival falls on the 5th day of the 5th lunar month, the start of hot weather — when venomous creatures like snakes, scorpions and centipedes become active. For centuries, families in China have hung mugwort and calamus herbs at the door and worn fragrant sachets to guard against the 'five poisons.'" },
  change:    { ch:3, title:"Chang'e Flies to the Moon",
    text:"The hero Hou Yi shot down nine of ten burning suns and was given an elixir of immortality. When a thief tried to steal it, Hou Yi's wife Chang'e drank it to keep it safe and floated up to the moon, where she lives with the Jade Rabbit. Hou Yi set out her favorite foods under the full moon every year." },
  mooncake:  { ch:3, title:'Mooncakes Mean Reunion',
    text:"Mooncakes are round like the full moon, a symbol of family reunion (tuanyuan). One cake is cut so everyone shares a slice. Tang dynasty emperors gifted them to scholars, and by the Song dynasty they appear in festival records. One legend even says rebels once hid secret messages inside them!" },
  midautumn: { ch:3, title:'Three Thousand Years of Moonlight',

/* ---------- dialogue system ---------- */
const DLG = { active:false, queue:[], line:null, chars:0, onDone:null, choice:null, sel:0 };
function say(entries, onDone){
  DLG.queue = entries.slice(); DLG.onDone = onDone || null;
  DLG.active = true; DLG.choice = null;
  if (typeof duckMusic==='function') duckMusic(true);
  dlgNext();
}
function dlgNext(){
  const e = DLG.queue.shift();
  if (!e){
    DLG.active = false; DLG.line = null;
    if (typeof duckMusic==='function') duckMusic(false);
    const cb = DLG.onDone; DLG.onDone = null;
    if (cb) cb();
    return;
  }
  if (e.choice){ DLG.choice = e; DLG.sel = 0; DLG.line = null; SFX.blip(); return; }
  DLG.line = e; DLG.chars = 0; DLG.blipT = 0; DLG.blipI = 0;
}
/* where the choice rows sit on screen — one source of truth */
function dlgChoiceGeom(){
  const c = DLG.choice;
  const lines = wrap(c.q || '', 270, 6.4);
  const h = lines.length*8 + c.choice.length*11 + 12;
  return { lines, h, y0: 172-h + lines.length*8 + 3 };
}
function dlgUpdate(dt){
  if (DLG.choice){
    if (just.dash || just.interact) just.a = true;   // SPACE / E confirm the highlighted choice
    const n = DLG.choice.choice.length;
    const g = dlgChoiceGeom();
    for (let i=0;i<n;i++){                      // point at a choice, click it
      const ry = g.y0 + i*11 - 1;
      if (hoverIn(26, ry, 268, 10) && DLG.sel !== i){ DLG.sel = i; SFX.blip(); }
      if (clickIn(26, ry, 268, 10)){ DLG.sel = i; just.a = true; }
    }
    if (just.up)   { DLG.sel = (DLG.sel+n-1)%n; SFX.blip(); }
    if (just.down) { DLG.sel = (DLG.sel+1)%n; SFX.blip(); }
    if (just.a){
      const c = DLG.choice; DLG.choice = null;
      SFX.select();
      if (c.cb) c.cb(DLG.sel);
      else dlgNext();
      return;
    }
    return;
  }
  if (just.dash || just.click || just.interact) just.a = true;   // SPACE / E / a click advance dialogue
  if (!DLG.line) return;
  DLG.chars += dt*50;
  // Celeste-style voice blips while the text types out
  if (DLG.chars < DLG.line.text.length){
    const v = voiceFor(DLG.line.who||'');
    DLG.blipT = (DLG.blipT||0) + dt;
    if (DLG.blipT >= (v.gap||0.06)){
      const idx = Math.floor(DLG.chars);
      const ch2 = DLG.line.text[idx] || ' ';
      if (',.!?…'.indexOf(ch2) >= 0){ DLG.blipT = -0.09; }          // breath pause
      else if (ch2 !== ' '){
        DLG.blipT = 0;
        voiceBlip(v, DLG.blipI = (DLG.blipI||0)+1, DLG.line.text.slice(idx+1, idx+4));
      } else DLG.blipT = 0;
    }
  }
  if (just.a){
    if (DLG.chars < DLG.line.text.length){ DLG.chars = DLG.line.text.length; }
    else { SFX.blip(); dlgNext(); }
  }
}
function dlgRender(){
  if (DLG.choice){
    const c = DLG.choice;
    const g = dlgChoiceGeom();
    box(20, 168-g.h, 280, g.h);
    let yy = 172-g.h;
    for (const ln of g.lines){ T(ln, 28, yy, 6.4, '#f4e8d0'); yy += 8; }
    c.choice.forEach((opt,i)=>{

      T(opt, 40, ry, 6.4, i===DLG.sel?'#ffd964':'#cfc0a8');
    });
    return;

/* ---------- where the current task lives, in world coords ---------- */
function questTarget(){
  const c = G.ch, st = G.step;
  const npc = id => { const p = npcPos(id); return p ? { x:p[0], y:p[1] } : null; };
  const PEDESTAL = { x:480, y:200 };
  const LONGSPOT = () => ({ x: world.lx, y: world.ly });
  if (c===1){
    if (st===0) return { x: world.lx, y: world.ly };          // follow Lóng
    if (st===1 || st===6) return npc('elder');
    if (st===2) return npc('hua');
    if (st===3) return npc('bo');
    if (st===4) return npc('mei');
    if (st===7) return LONGSPOT();
    return null;                                              // nightfall handles itself
  }
  if (c===2){
    if (st===0 || st===5) return npc('yu');
    if (st===1) return npc('wen');
    if (st===2 || st===4) return npc('zhu');
    if (st===3) return { x: clamp(world.px, 80, 920), y: 262 };  // the river's edge
    if (st===6) return LONGSPOT();
  }
  if (c===3){
    if (st===0 || st===1) return npc('mei');
    if (st===2) return npc('fang');
    if (st===3){                                              // nearest unlit lantern pole
      let best = null, bd = 1e9;
      POLES.forEach((p,i)=>{ if (!G.flags['pole'+i]){
        const d = Math.hypot(p[0]-world.px, p[1]-world.py);
        if (d < bd){ bd = d; best = { x:p[0], y:p[1] }; } } });
      return best;
    }
    if (st===4) return { x:468, y:184 };                      // the feast
    if (st===5 || st===6) return LONGSPOT();
  }
  return null;
}

/* the guiding arrow: hovers over the goal, or points at it from the screen edge */
function questArrowRender(){
  if (DLG.active) return;
  const t = questTarget(); if (!t) return;
  if (Math.hypot(t.x - world.px, t.y - world.py) < 36) return;   // you have arrived
  const sx = t.x - world.cam, sy = t.y - world.camY;
  const bob = Math.sin(G.time*5)*2;
  if (sx > 16 && sx < LW-16 && sy > 34 && sy < LH-6){
    const ay = sy - 30 + bob;                                    // bouncing marker above the goal
    glow(sx, ay+5, 9, '#f2b632', 0.22);
    tri(sx, ay+10, sx-6.5, ay, sx+6.5, ay, '#2b1a26');
    tri(sx, ay+8, sx-4.5, ay+1, sx+4.5, ay+1, '#f2b632');
    tri(sx, ay+5.5, sx-2.5, ay+1.6, sx+2.5, ay+1.6, '#ffe98a');
  } else {
    const pxs = world.px - world.cam, pys = world.py - 8 - world.camY;
    const a = Math.atan2(t.y - world.py, t.x - world.px);
    const pulse = Math.sin(G.time*5)*2;
    const ex = clamp(pxs + Math.cos(a)*150, 16, LW-16);
    const ey = clamp(pys + Math.sin(a)*150, 34, LH-14);
    const ca = Math.cos(a), sa = Math.sin(a), pa = -sa, pb = ca;
    const tx = ex + ca*(9+pulse), ty = ey + sa*(9+pulse);        // apex, breathing outward
    const bx = ex - ca*3, by = ey - sa*3;
    glow(ex, ey, 9, '#f2b632', 0.2);
    tri(tx + ca*1.6, ty + sa*1.6, bx + pa*7 - ca*1.2, by + pb*7 - sa*1.2, bx - pa*7 - ca*1.2, by - pb*7 - sa*1.2, '#2b1a26');
    tri(tx, ty, bx + pa*5, by + pb*5, bx - pa*5, by - pb*5, '#f2b632');
    tri(tx - ca*2, ty - sa*2, bx + pa*2.4 + ca*1.4, by + pb*2.4 + sa*1.4, bx - pa*2.4 + ca*1.4, by - pb*2.4 + sa*1.4, '#ffe98a');
  }
}

    for (const qx of [0, 8]){
      const hh = thash(tx*2 + qx/8, ty*2 + qy/8 + 9);
      const w = 6 + (hh > 0.5 ? 1 : 0);
      const stone = ramp[1 + Math.floor(hh*3)%3];
      R(sx+qx+1, sy+qy+1, w, 6, stone);
      R(sx+qx+1, sy+qy+1, w, 1, ramp[0]);
      R(sx+qx+1, sy+qy+6, w, 1, ramp[4]);
    }
  }
}
function grassTile(sx, sy, tx, ty, pal, base){
  R(sx, sy, TILE, TILE, base);
  for (let k=0;k<4;k++){
    const h1 = thash(tx*7 + k*13, ty*11 + k*17);
    if (h1 > 0.6) continue;
    const bx2 = 1 + Math.floor(h1*97)%14, by2 = 1 + Math.floor(h1*61)%13;
    R(sx+bx2, sy+by2, 1, 2, k%2 ? pal.blade1 : pal.blade2);
  }
  const h = thash(tx, ty);
  if (h < 0.13){          // grass tuft
    const ox = 2 + Math.floor(h*80)%10, oy = 3 + Math.floor(h*50)%9;
    R(sx+ox, sy+oy, 1, 3, pal.blade2);
    R(sx+ox-1, sy+oy+1, 1, 2, pal.blade1);
    R(sx+ox+1, sy+oy+1, 1, 2, pal.blade1);
  }
  if (pal.snow && h > 0.55){   // winter snow patches
    const ox = Math.floor(h*70)%9, oy = Math.floor(h*45)%9;
    R(sx+ox, sy+oy+1, 6, 2, pal.snow);
    R(sx+ox+1, sy+oy, 4, 1, pal.snow);
    R(sx+ox+1, sy+oy+3, 4, 1, pal.snowsh);
  }
  if (pal.flower && h > 0.965){  // spring blossoms
    const ox = 3 + Math.floor(h*90)%10, oy = 3 + Math.floor(h*57)%10;
    R(sx+ox-1, sy+oy, 3, 1, pal.flower); R(sx+ox, sy+oy-1, 1, 3, pal.flower);
    R(sx+ox, sy+oy, 1, 1, '#f2b632');
  }
  if (pal.leaf && h > 0.9){      // fallen autumn leaves
    const ox = 2 + Math.floor(h*90)%11, oy = 2 + Math.floor(h*57)%11;
    R(sx+ox, sy+oy, 2, 1, pal.leaf); R(sx+ox+1, sy+oy+1, 1, 1, '#8a4f22');
  }
}
function drawTiles(cam, camY){
  const pal = PALS[clamp(G.ch,1,3)] || PALS[1];
  const x0 = Math.floor(cam/TILE), x1 = Math.min(MAPW-1, Math.ceil((cam+LW)/TILE));
  const y0 = Math.floor(camY/TILE), y1 = Math.min(MAPH-1, Math.ceil((camY+LH)/TILE));
  for (let ty=y0; ty<=y1; ty++){
    for (let tx=x0; tx<=x1; tx++){
      const c = map[ty][tx];
      const sx = tx*TILE-cam, sy = ty*TILE-camY;
      const h = thash(tx,ty);
      if (c==='G' || c==='R'){
        grassTile(sx, sy, tx, ty, pal, pal.grass);
        if (c==='R'){
          R(sx+3, sy+6, 1, 10, '#7a9a4e'); R(sx+4, sy+5, 1, 2, '#8aa85a');
          R(sx+9, sy+4, 1, 12, '#8aa85a'); R(sx+10, sy+3, 1, 2, '#9ab868');
          R(sx+13, sy+8, 1, 8, '#7a9a4e');
        }
      } else if (c==='P'){
        cobbleTile(sx, sy, tx, ty, COB_P);
      } else if (c==='S'){
        cobbleTile(sx, sy, tx, ty, COB_S);
      } else if (c==='W'){
        R(sx,sy,TILE,TILE, pal.water1);
        const wv = Math.sin(G.time*1.4 + tx*0.9 + ty*1.7);
        if (wv>0.2) R(sx+2, sy+5+wv*2, 9, 1.4, pal.water2);
        if (h<0.12 && Math.sin(G.time*2.5+h*40)>0.6) R(sx+7, sy+9, 2, 1.4, '#cfe4f4');
      } else if (c==='D'){
        R(sx,sy,TILE,TILE, '#8a6844');
        R(sx,sy,TILE,1.4,'#6a4c30'); R(sx,sy+8,TILE,1.4,'#6a4c30');
        R(sx+((tx%2)*8), sy, 1.4, TILE, '#6a4c30');
        R(sx+2, sy+2, 5, 1, '#a07c50'); R(sx+9, sy+10, 5, 1, '#a07c50');
      } else if (c==='H'){
        grassTile(sx, sy, tx, ty, pal, pal.hill);
        if (map[ty][tx-1] && map[ty][tx-1]!=='H') R(sx,sy,2,TILE,'rgba(90,70,40,0.35)');
        if (map[ty+1] && map[ty+1][tx]!=='H') R(sx,sy+TILE-2,TILE,2,'rgba(90,70,40,0.35)');
      }
    }
  }
}

/* ---------- collision ---------- */
function tileAt(x,y){
  const tx = Math.floor(x/TILE), ty = Math.floor(y/TILE);
  if (tx<0||tx>=MAPW||ty<0||ty>=MAPH) return 'X';
  return map[ty][tx];
}
function blockedAt(x,y){
  // feet box
  for (const [ox,oy] of [[-4,-1],[4,-1],[-4,-4],[4,-4]]){
    const t = tileAt(x+ox, y+oy);
    if (t==='X' || t==='W') return true;
  }
  for (const r of SOLIDS){
    if (x+4>r[0] && x-4<r[0]+r[2] && y>r[1] && y-5<r[1]+r[3]) return true;
  }
  return false;
}

function npcMoved(id, x, y, dir){ NPC_OVERRIDE[id] = [x,y,dir]; }
const NPC_OVERRIDE = {};
/* send an NPC walking: down to the plaza band first, then to the seat */
const NPC_WALKS = {};
function npcWalk(id, tx, ty, dir, delay){
  const p = npcPos(id);
  NPC_OVERRIDE[id] = [p[0], p[1], p[2] || 'down'];
  NPC_WALKS[id] = { path: [[p[0], Math.max(p[1], 200)], [tx, ty]], dir,
                    spd: 40 + Math.random()*14, delay: delay || 0 };
}
function npcWalksTick(dt){
  for (const id in NPC_WALKS){
    const w = NPC_WALKS[id], o = NPC_OVERRIDE[id];
    if (w.delay > 0){ w.delay -= dt; continue; }
    const t2 = w.path[0];
    const dx = t2[0] - o[0], dy = t2[1] - o[1];
    const d = Math.hypot(dx, dy);
    if (d < 2){
      w.path.shift();
      if (!w.path.length){ o[0] = t2[0]; o[1] = t2[1]; o[2] = w.dir; o[3] = false; delete NPC_WALKS[id]; }
      continue;
    }
    const step = Math.min(d, w.spd*dt);
    o[0] += dx/d*step; o[1] += dy/d*step;
    o[2] = Math.abs(dx) > Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
    o[3] = true;                                   // mid-stride
  }
}
function npcPos(id){
  if (NPC_OVERRIDE[id]) return NPC_OVERRIDE[id];
  const n = NPCS[id];
  return n.pos[clamp(G.ch,1,3)];

/* ---------- SEQUENCE (dumplings, zongzi) ---------- */
function makeSequence(cfg, onDone){
  const dirs = ['up','down','left','right'];
  let round = 0, seq = [], idx = 0, flash = 0, doneT = 0, state = 'play';
  function roll(){ seq = []; for(let i=0;i<cfg.lens[round];i++) seq.push(pick(dirs)); idx = 0; }
  roll();
  return {
    update(dt){
      flash = Math.max(0, flash-dt);
      updateParts(dt);
      if (state==='alldone'){
        doneT += dt;
        if (just.a && doneT>0.6){ popScene(); onDone(); }
        return;
      }
      if (state==='rounddone'){
        doneT += dt;
        if (doneT > 0.9){ state='play'; roll(); }
        return;
      }
      for (const d of dirs){
        if (just[d]){
          if (d === seq[idx]){ idx++; SFX.blip();
            if (idx >= seq.length){
              round++;
              SFX.good();
              burst(160, 84, ['#f2b632','#ffe98a','#f6ecd8'], 18, 40);
              if (round >= cfg.lens.length){ state='alldone'; doneT=0; SFX.win(); }
              else { state='rounddone'; doneT=0; }
            }
          } else { flash = 0.35; idx = 0; SFX.bad(); }
          break;
        }
      }
    },
    render(){
      kitchenBG();
      drawParts(0,0);
      mgHeader(cfg.title, cfg.flavor);
      if (flash>0){ cx.globalAlpha=flash; R(0,0,LW,LH,'#a02818'); cx.globalAlpha=1; }
      // the food takes shape
      const cxx=160, cyy=88;
      if (cfg.icon==='dumpling'){
        if (round===0) circle(cxx,cyy,10,'#f6ecd8');
        else if (round===1){ circle(cxx,cyy,10,'#f6ecd8'); circle(cxx,cyy-2,4,'#c88a5a'); }
        else drawDumpling(cxx,cyy,2.2);
      } else {
        if (round===0){ R(cxx-12,cyy-8,24,16,'#3e8b4e'); }
        else if (round===1){ R(cxx-12,cyy-8,24,16,'#3e8b4e'); R(cxx-6,cyy-4,12,8,'#f6ecd8'); }
        else drawZongzi(cxx,cyy,2.2);
      }

/* ---------- TIMING (firecrackers vs Nian, mooncake press) ---------- */
function makeTiming(cfg, onDone){
  let round = 0, t = 0, state = 'play', msg = '', msgT = 0, doneT = 0;
  const speeds = cfg.speeds || [2.2, 2.8, 3.4];
  const zones  = cfg.zones  || [30, 24, 18];
  return {
    update(dt){
      t += dt; msgT = Math.max(0, msgT-dt);
      updateParts(dt);
      if (state==='done'){
        doneT += dt;
        if (just.a && doneT>0.6){ popScene(); onDone(); }
        return;
      }
      if (just.a){
        const pos = Math.sin(t*speeds[round])*100;   // -100..100
        if (Math.abs(pos) < zones[round]/2){
          round++;
          if (cfg.onHit) cfg.onHit(round);
          burst(160+pos*0.9, 118, ['#ff5838','#f2b632','#ffe98a'], 24, 60);
          if (round >= speeds.length){ state='done'; doneT=0; SFX.win(); }
          else { msg = pick(['GREAT!','NICE!','PERFECT!']); msgT = 0.8; }
        } else {
          msg = 'Missed! again…'; msgT = 0.8; SFX.bad();
        }
      }
    },
    render(){
      cfg.drawScene(round, t, state==='done');
      drawParts(0,0);
      mgHeader(cfg.title, cfg.flavor);
      if (state==='done'){
        box(40,58,240,46);
        T(cfg.doneTitle||'DONE!', LW/2, 66, 9, '#f2b632','center');
        T(cfg.doneLine, LW/2, 80, 6, '#f4e8d0','center');
        T('✓ to continue', LW/2, 92, 5.4, '#cfc0a8','center');
        return;
      }
      T(cfg.roundLabels[round], LW/2, 34, 6, '#ffe9b0','center');
      // the bar
      const pos = Math.sin(t*speeds[round])*100;
      R(52, 112, 216, 12, 'rgba(20,12,16,0.8)');
      R(52, 112, 216, 1.4, '#c8a860'); R(52, 122.6, 216, 1.4, '#c8a860');

      R(160 + pos*1.08 - 1.5, 108, 3, 20, '#ffffff');
      T('Press ✓ when the slider is in the RED zone!', LW/2, 130, 5.4, '#cfc0a8','center');

/* ---------- RHYTHM (dragon boat race) ---------- */
function makeRhythm(onDone){
  const GOAL = 100, BPM = 104, BEAT = 60/BPM;
  let me = 0, rival = 0, t = 0, lastSide = 'right', beatT = 0, beatN = 0;
  let msg='', msgT=0, state='race', doneT=0, scroll=0;
  function stroke(side){
    if (state!=='race') return;
    const near = Math.min(beatT, BEAT-beatT);
    if (side === lastSide){ msg='Alternate ◀ ▶!'; msgT=0.6; me += 0.15; SFX.bad(); return; }
    lastSide = side;
    if (near < BEAT*0.3){ me += 2.6; msg=pick(['STROKE!','GO GO!','ON BEAT!']); msgT=0.4; SFX.drum(); }
    else { me += 1.1; msg='off-beat… feel the drum'; msgT=0.5; noiseHit(0.06,0.15); }
    burst(70+me*1.7, 128, ['#cfe4f4','#ffffff'], 6, 30);
  }
  return {
    update(dt){
      t += dt; msgT = Math.max(0,msgT-dt);
      updateParts(dt);
      if (state!=='race'){
        doneT += dt;
        if (just.a && doneT>0.6){
          if (state==='win'){ popScene(); onDone(); }
          else { me=0; rival=0; state='race'; msg=''; lastSide='right'; }
        }
        return;
      }
      beatT += dt;
      if (beatT >= BEAT){ beatT -= BEAT; beatN++; SFX.drum(); }
      rival += dt * 6.2;
      if (just.left) stroke('left');
      if (just.right) stroke('right');
      scroll += dt * (14 + me*0.1);
      if (me >= GOAL){ state='win'; doneT=0; SFX.win(); burst(240,80,['#f2b632','#ff5838','#7ce87c','#cfe4f4'],40,80); }
      else if (rival >= GOAL){ state='lose'; doneT=0; SFX.bad(); }
    },
    render(){
      // river scene
      R(0,0,LW,52,'#bfe0f0');
      R(0,30,LW,8,'#a8d0e4');
      // far bank
      R(0,44,LW,14,'#6fae4e');
      for(let i=0;i<7;i++){ const bx=(i*60 - (scroll*0.5)%60); drawTree(bx, 56, i%2?'round':'pine', 2); }
      R(0,58,LW,122,'#3a7ab2');
      for(let i=0;i<40;i++){
        const wx = (i*23 - (scroll*1.4)%23), wy = 66 + (i%7)*16;
        cx.globalAlpha=0.5; R(wx, wy + Math.sin(G.time*2+i)*1.5, 12, 1.6, '#5c94c8'); cx.globalAlpha=1;
      }
      // crowd on near bank
      R(0,168,LW,12,'#6fae4e');
      // rival boat (top lane) & player boat
      drawBoat(40 + rival*2.2, 92, G.time, {crew:true, seed:3, fast:false});
      drawBoat(40 + me*2.2, 132, G.time, {crew:true, seed:1, fast:true});
      T('YOU', 40+me*2.2-30, 124, 5.4, '#ffe9b0');
      // finish line
      const fx = 40 + GOAL*2.2 + 14;
      for(let i=0;i<14;i++) R(fx, 62+i*8, 3, 5, i%2?'#f2b632':'#e03c28');
      drawParts(0,0);
      mgHeader('DRAGON BOAT RACE', 'Paddle ◀ ▶ alternating — on the DRUM beat!');
      // drum pulse
      const pu = 1 - clamp(beatT/BEAT,0,1);
      drawDrum(24, 174, 1 + pu*0.35);
      glow(24, 168, 10+pu*8, '#f2b632', 0.25*pu);
      if (msgT>0) T(msg, LW/2, 40, 6.6, msg[0]==='S'||msg[0]==='G'||msg[0]==='O'?'#7ce87c':'#ffd0a0', 'center');
      if (state==='win'){
        box(46,58,228,50);
        T('YOU WIN THE RACE!', LW/2, 66, 8.4, '#f2b632','center');
        T('The drums thunder like they did for Qu Yuan.', LW/2, 80, 5.6, '#f4e8d0','center');
        T('✓ to continue', LW/2, 94, 5.4, '#cfc0a8','center');
      } else if (state==='lose'){
        box(46,58,228,50);
        T('SO CLOSE!', LW/2, 66, 8.4, '#ff8a70','center');
        T('Stay with the drumbeat — alternate ◀ ▶.', LW/2, 80, 5.6, '#f4e8d0','center');
        T('✓ to race again', LW/2, 94, 5.4, '#cfc0a8','center');
      }
    }
  };
}

function makeQuiz(questions, opts, onDone){

      msgT += dt;
      if (state==='ask'){
        const n = questions[idx].a.length;

            state='right'; msgT=0; SFX.good();

          idx++; sel=0;

      for (const L of lanternsUp){ L.y -= dt*9; }

        T('▲▼ choose · ✓ answer', LW/2, 156, 5, '#9a8c78','center');

      T((idx+1)+' / '+questions.length, 300, 168, 5.4, '#9a8c78','center');

/* ---------- art ---------- */
function drawDust(x, y, r, t, seed, angry){
  const wob = Math.sin(t*7 + seed)*0.8;
  // fuzzy body: spiky outline then fill
  for (let i=0;i<9;i++){
    const a = i/9*Math.PI*2 + t*1.4 + seed;
    tri(x+Math.cos(a)*r*0.7, y+Math.sin(a)*r*0.7,
        x+Math.cos(a)*(r+2.2+wob), y+Math.sin(a)*(r+2.2+wob),
        x+Math.cos(a+0.6)*r*0.7, y+Math.sin(a+0.6)*r*0.7, '#6b665e');
  }
  circle(x, y+wob*0.4, r+0.9, '#4a453f');
  circle(x, y+wob*0.4, r, '#8f8880');
  circle(x-r*0.3, y-r*0.3+wob*0.4, r*0.5, '#aaa298');
  // googly eyes
  const ey = y - r*0.15 + wob*0.4;
  circle(x-r*0.38, ey, r*0.3, '#ffffff'); circle(x+r*0.38, ey, r*0.3, '#ffffff');
  const lx = Math.cos(t*3+seed)*r*0.09, ly = Math.sin(t*4+seed)*r*0.09;
  circle(x-r*0.38+lx, ey+ly, r*0.14, '#1a1016'); circle(x+r*0.38+lx, ey+ly, r*0.14, '#1a1016');
  if (angry){ R(x-r*0.62, ey-r*0.5, r*0.5, 1.2, '#1a1016'); R(x+r*0.12, ey-r*0.5, r*0.5, 1.2, '#1a1016'); }
  R(x-1, y+r*0.42+wob*0.4, 2.4, 1.2, '#4a453f');
}
function drawDustKing(x, y, t, hurtT){
  const bob = Math.sin(t*3)*1.6;
  const R0 = 15;
  cx.fillStyle='rgba(0,0,0,0.25)';
  ell(x, y+R0-1, R0*0.9, 3, 'rgba(0,0,0,0.25)');
  // shaggy dust mane
  for (let i=0;i<14;i++){
    const a = i/14*Math.PI*2 + t*0.9;
    const sp = R0 + 4 + Math.sin(t*6+i)*2;
    tri(x+Math.cos(a-0.22)*R0*0.85, y+bob+Math.sin(a-0.22)*R0*0.85,
        x+Math.cos(a)*sp, y+bob+Math.sin(a)*sp,
        x+Math.cos(a+0.22)*R0*0.85, y+bob+Math.sin(a+0.22)*R0*0.85,
        i%2 ? '#6b665e' : '#57534c');
  }
  circle(x, y+bob, R0+1, '#3a3630');
  circle(x, y+bob, R0, '#8f8880');
  circle(x-4, y+bob-5, R0*0.55, '#aaa298');
  if (hurtT>0 && Math.sin(t*40)>0){ circle(x, y+bob, R0, '#e8e2d6'); }
  // crooked crown: last year's torn calendar page

  R(-8, -7, 16, 8, '#c8362a');
  R(-8, -7, 16, 1.4, '#e8543c');
