  // grin + buck tooth
  R(x-5, ey+5, 10, 2.6, '#3a2018');
  R(x-1.4, ey+5, 3, 3.4, '#f6f2e6');
  // stubby arms
  R(x-R0-3, y+bob+2, 4, 2.4, '#6b665e'); R(x+R0-1, y+bob+2, 4, 2.4, '#6b665e');
}
function drawBroom(x, y, aim, k){
  // aim: radians toward the cursor. k: 0..1 through the sweep arc
  const a = aim + lerp(-0.85, 0.85, k);
  const hx = x + Math.cos(a)*7, hy = y + Math.sin(a)*7;
  const tx = x + Math.cos(a)*17, ty = y + Math.sin(a)*17;
  cx.strokeStyle = '#8a6a48'; cx.lineWidth = P*1.6;
  cx.beginPath(); cx.moveTo(hx*P, hy*P); cx.lineTo(tx*P, ty*P); cx.stroke();
  for (let i=-3;i<=3;i++){
    const bx2 = tx + Math.cos(a+Math.PI/2)*i*1.5, by2 = ty + Math.sin(a+Math.PI/2)*i*1.5;
    R(bx2-0.6, by2-0.6, 1.4, 1.4, i%2 ? '#d8b869' : '#c8a860');
  }
  cx.globalAlpha = 0.28*(1-Math.abs(k-0.5)*2);
  circle(tx, ty, 9, '#f4e8d0');
  cx.globalAlpha = 1;
}

/* ---------- the battle ---------- */
function makeSweepBattle(onDone){
  const st = {
    usesDash:true,
    mode:'intro', t:0, evT:0,
    px:60, py:110, dir:'right', moving:false,
    dashT:0, dashCd:0, sweepT:0, sweepCd:0, sweepDir:'right',
    dusts:[], puffs:[], king:null,
    swept:0, need:6, luck:100,
    msg:'', msgT:0, msgC:'#ffe9b0', shake:0, won:false,
  };
  window.SWEEP = st;

  function addDust(x, y, big){
    st.dusts.push({ x, y, vx:rnd(-18,18), vy:rnd(-18,18), r: big?7:5.2,
                    seed: rnd(6.28), wanderT: rnd(0.6), out:false });
  }
  function say2(m, c){ st.msg=m; st.msgT=1.1; st.msgC=c||'#ffe9b0'; }
  function spawnWave(n){ for (let i=0;i<n;i++) addDust(rnd(SW.x0+30, SW.x1-40), rnd(SW.y0+14, SW.y1-14)); }
  function loseLuck(amount){
    st.luck -= amount; st.shake = 0.35;
    if (st.luck <= 0){ st.luck = 0; st.mode='lose'; st.evT=0; SFX.bad(); }
  }
  function startKing(){
    st.mode='king'; st.evT=0;
    st.king = { x:120, y:110, vx:0, vy:0, pushes:0, needPushes:5, sneezeT:2.2, hurtT:0, out:false };
    kingLaugh(); st.shake=0.6;
    say2('HUÌ QÌ — THE DUST KING!', '#ff8a70');
  }
  spawnWave(6);

  return {
    usesDash:true, aim:true,
    update(dt){
      st.t+=dt; st.evT+=dt;
      st.msgT=Math.max(0,st.msgT-dt); st.shake=Math.max(0,st.shake-dt);
      st.sweepT=Math.max(0,st.sweepT-dt); st.sweepCd=Math.max(0,st.sweepCd-dt);
      st.dashT=Math.max(0,st.dashT-dt); st.dashCd=Math.max(0,st.dashCd-dt);
      updateParts(dt);

      if (st.mode==='intro'){ if (st.evT>1.5 || just.a){ st.mode='play'; say2('Sweep them out the door!'); } return; }
      if (st.mode==='lose'){
        if ((just.a || just.click) && st.evT>0.7){
          st.dusts=[]; st.puffs=[]; st.king=null; st.swept=0; st.luck=100;
          st.px=60; st.py=110; st.mode='play'; st.evT=0; spawnWave(6);
        }
        if (just.b && st.evT>0.7){                  // step outside; Auntie Hua will restart you
          popScene();
          say([{who:'Auntie Hua', port:port('hua'), text:"Tt! The dust does not win forever. Catch your breath and come back — my broom isn't going anywhere."}]);
        }
        return;
      }
      if (st.mode==='win'){
        if (st.evT>2.4 || ((just.a || just.click) && st.evT>1)){ popScene(); onDone(); }
        return;
      }

      /* ---- player ---- */
      let vx=0, vy=0;
      if (keys.left) vx=-1; else if (keys.right) vx=1;
      if (keys.up) vy=-1; else if (keys.down) vy=1;
      st.moving = !!(vx||vy);
      if (vx&&vy){ vx*=0.707; vy*=0.707; }
      if (vx<0) st.dir='left'; else if (vx>0) st.dir='right';
      else if (vy<0) st.dir='up'; else if (vy>0) st.dir='down';
      if (just.dash && st.dashCd<=0){ st.dashT=0.15; st.dashCd=0.6; SFX.dash(); }
      const spd = st.dashT>0 ? 270 : 104;
      if (st.dashT>0 && !vx && !vy){
        vx = st.dir==='left'?-1: st.dir==='right'?1:0;
        vy = st.dir==='up'?-1: st.dir==='down'?1:0;
      }
      st.px = clamp(st.px + vx*spd*dt, SW.x0+8, SW.x1-8);
      st.py = clamp(st.py + vy*spd*dt, SW.y0+10, SW.y1-6);
      if (st.dashT>0) spawnPart({x:st.px, y:st.py-8, vx:0, vy:0, g:0, life:0.22, t:0, c:playerLook().top||'#e8b028', sz:3});

      /* ---- sweep ---- */
      if ((just.a || just.click) && st.sweepCd<=0){
        st.sweepT=0.26; st.sweepCd=0.34; sweepWhoosh();
        st.aimA = mouse.over ? aimAngle(st.px, st.py-8)
                : (st.dir==='left'?Math.PI: st.dir==='right'?0: st.dir==='up'?-Math.PI/2:Math.PI/2);
        const ax = Math.cos(st.aimA), ay = Math.sin(st.aimA);
        if (Math.abs(ax) > Math.abs(ay)) st.dir = ax<0?'left':'right'; else st.dir = ay<0?'up':'down';
        const cx0 = st.px + ax*13, cy0 = st.py - 8 + ay*13;
        for (const d of st.dusts){
          if (dist(d.x, d.y, cx0, cy0) < 21){
            const a = Math.atan2(d.y - st.py + 8, d.x - st.px);
            d.vx += Math.cos(a)*250 + ax*120;
            d.vy += Math.sin(a)*250 + ay*120;
            dustPoof(d.x, d.y);
          }
        }
        if (st.king && !st.king.out && dist(st.king.x, st.king.y, cx0, cy0) < 30){
          const k = st.king;
          const a = Math.atan2(k.y - st.py + 8, k.x - st.px);
          k.vx += Math.cos(a)*180 + ax*130; k.vy += Math.sin(a)*180 + ay*70;
          k.pushes++; k.hurtT = 0.3;
          dustPoof(k.x, k.y, true); SFX.good();
          say2(pick(['NYEHH!','my dust!','ACHOO— hey!','rude!']), '#ffe9b0');
        }
      }

      /* ---- dust sprites ---- */
      for (const d of st.dusts){
        d.wanderT -= dt;
        if (d.wanderT<=0){ d.wanderT = rnd(0.6,1.4); d.vx += rnd(-20,20); d.vy += rnd(-20,20); }
        // scurry away from the player a little (they're shy)
        const dd = dist(d.x,d.y,st.px,st.py-8);
        if (dd < 24){ const a = Math.atan2(d.y-st.py+8, d.x-st.px); d.vx += Math.cos(a)*210*dt; d.vy += Math.sin(a)*210*dt; }
        // shy of walls: drift back toward open floor so nothing pins in a corner
        if (d.y < SW.y0+16) d.vy += 70*dt;
        if (d.y > SW.y1-16) d.vy -= 70*dt;
        if (d.x < SW.x0+16) d.vx += 70*dt;
        d.x += d.vx*dt; d.y += d.vy*dt;
        d.vx *= 0.962; d.vy *= 0.962;
        // walls (door gap on the right)
        if (d.x < SW.x0+d.r){ d.x = SW.x0+d.r; d.vx = Math.abs(d.vx)*0.6; }
        if (d.y < SW.y0+d.r){ d.y = SW.y0+d.r; d.vy = Math.abs(d.vy)*0.6; }
        if (d.y > SW.y1-d.r){ d.y = SW.y1-d.r; d.vy = -Math.abs(d.vy)*0.6; }
        if (d.x > SW.x1-d.r){
          if (d.y > SW.doorY0 && d.y < SW.doorY1){
            if (d.x > SW.x1+6){ d.out = true; }
          } else { d.x = SW.x1-d.r; d.vx = -Math.abs(d.vx)*0.6; }
        }
        // bumping the player costs a little luck
        if (dd < 11 && st.dashT<=0 && !d.bumpCd){
          d.bumpCd = 0.9; loseLuck(5);
          spawnPart({x:st.px, y:st.py-12, vx:0, vy:-20, g:0, life:0.5, t:0, c:'#c8362a', sz:2});
        }
        if (d.bumpCd) d.bumpCd = Math.max(0, d.bumpCd - dt);
      }
      const before = st.dusts.length;
      st.dusts = st.dusts.filter(d=>{
        if (d.out){
          st.swept++;
          dustPoof(SW.x1+4, d.y, true); SFX.sparkle();
          if (st.luck < 100){                       // good sweeping brings the luck back
            st.luck = Math.min(100, st.luck + 12);
            burst(SW.x1-6, d.y, ['#7ce87c','#ffe98a'], 12, 40);
          }
          return false;
        }
        return true;
      });
      if (st.dusts.length !== before && st.mode==='play'){
        if (st.swept >= st.need && !st.king) startKing();
        else if (st.dusts.length===0 && st.swept < st.need) spawnWave(3);
        else say2(pick(['Out you go! +LUCK','Swept! +LUCK','That is ONE. +LUCK','bye bye bad luck +LUCK']), '#7ce87c');
      }

      /* ---- the Dust King ---- */
      if (st.king && !st.king.out){
        const k = st.king;
        k.hurtT = Math.max(0, k.hurtT-dt);
        k.x += k.vx*dt; k.y += k.vy*dt;
        k.vx *= 0.955; k.vy *= 0.955;
        // he waddles back toward the middle of the room, away from the door
        const home = 130;
        k.vx += (home - k.x) * 0.5 * dt;
        k.vy += (110 - k.y) * 0.4 * dt;
        if (k.x < SW.x0+16){ k.x = SW.x0+16; k.vx = Math.abs(k.vx)*0.5; }
        if (k.y < SW.y0+16){ k.y = SW.y0+16; k.vy = Math.abs(k.vy)*0.5; }
        if (k.y > SW.y1-14){ k.y = SW.y1-14; k.vy = -Math.abs(k.vy)*0.5; }
        if (k.x > SW.x1-14){
          if (k.y > SW.doorY0 && k.y < SW.doorY1 && k.pushes >= 3){
            if (k.x > SW.x1+10) k.out = true;
          } else { k.x = SW.x1-14; k.vx = -Math.abs(k.vx)*0.5; }
        }
        // sneeze attack: puffs toward the player
        k.sneezeT -= dt;
        if (k.sneezeT <= 0){
          k.sneezeT = 2.6;
          const a0 = Math.atan2(st.py-8-k.y, st.px-k.x);
          for (let i=-1;i<=1;i++){
            st.puffs.push({ x:k.x, y:k.y, vx:Math.cos(a0+i*0.32)*74, vy:Math.sin(a0+i*0.32)*74, t:0 });
          }
          noiseHit(0.3, 0.35); tone(150, 0.2, 'sawtooth', 0.2);
          say2('ACHOOO!', '#ffd0a0');
        }
        if (dist(k.x, k.y, st.px, st.py-8) < 20 && st.dashT<=0 && !k.bumpCd){
          k.bumpCd = 1; loseLuck(8);
        }
        if (k.bumpCd) k.bumpCd = Math.max(0, k.bumpCd-dt);
        // he keeps shedding little dust
        if (Math.random() < dt*0.7 && st.dusts.length < 7) addDust(k.x+rnd(-10,10), k.y+rnd(-8,8));
      }
      if (st.king && st.king.out && st.mode!=='win'){
        st.mode='win'; st.evT=0; st.won=true;
        SFX.win(); dustPoof(SW.x1+6, st.king.y, true);
        burst(SW.x1, st.king.y, ['#f2b632','#ffe98a','#7ce87c'], 40, 80);
      }
      // puffs
      for (const pf of st.puffs){
        pf.t += dt; pf.x += pf.vx*dt; pf.y += pf.vy*dt;
        if (dist(pf.x, pf.y, st.px, st.py-8) < 10 && st.dashT<=0 && !pf.hit){
          pf.hit = true; loseLuck(9); dustPoof(pf.x, pf.y);
        }
      }
      st.puffs = st.puffs.filter(pf=> !pf.hit && pf.t < 2.4 && pf.x>SW.x0 && pf.x<SW.x1+8 && pf.y>SW.y0 && pf.y<SW.y1);
    },

    render(){
      const shx = st.shake>0 ? Math.round(Math.sin(st.t*70)*st.shake*3) : 0;
      cx.save(); cx.translate(shx*P, 0);
      /* room */
      R(0,0,LW,LH,'#5a4432');
      R(SW.x0-8, SW.y0-14, SW.x1-SW.x0+16, 14, '#7a5a40');           // back wall
      for (let i=0;i<LW;i+=22) R(i, SW.y0-14, 1, 14, 'rgba(0,0,0,0.12)');
      R(SW.x0-8, SW.y0-2, SW.x1-SW.x0+16, 3, '#4a3424');
      R(SW.x0-8, SW.y0, SW.x1-SW.x0+16, SW.y1-SW.y0+8, '#9a7048');    // floor
      for (let i=SW.x0-8;i<SW.x1+8;i+=20) R(i, SW.y0, 1, SW.y1-SW.y0+8, 'rgba(0,0,0,0.1)');
      for (let j=SW.y0;j<SW.y1+8;j+=16) R(SW.x0-8, j, SW.x1-SW.x0+16, 1, 'rgba(0,0,0,0.08)');
      R(SW.x0+40, SW.y0+16, 120, 44, '#b04434'); R(SW.x0+44, SW.y0+20, 112, 36, '#c85440');   // rug
      // wall decor
      R(SW.x0+18, SW.y0-12, 10, 10, '#d43424'); hanzi('福', SW.x0+23, SW.y0-7, 6, '#f2b632');
      drawLantern(SW.x0+60, SW.y0-14, 0.7, true, st.t);
      drawLantern(SW.x1-60, SW.y0-14, 0.7, true, st.t+1.2);
      /* the open door on the right — the goal */
      R(SW.x1, SW.y0-2, 8, SW.y1-SW.y0+8, '#3a2a1e');
      R(SW.x1, SW.doorY0, 10, SW.doorY1-SW.doorY0, '#1b2a3c');
      const gl = 0.25 + Math.sin(st.t*3)*0.08;
      cx.globalAlpha = gl; R(SW.x1+1, SW.doorY0+2, 8, SW.doorY1-SW.doorY0-4, '#8ab4e0'); cx.globalAlpha = 1;
      R(SW.x1-2, SW.doorY0-3, 4, 3, '#5a3828'); R(SW.x1-2, SW.doorY1, 4, 3, '#5a3828');
      T('OUT →', SW.x1-30, (SW.doorY0+SW.doorY1)/2-3, 5.4, Math.sin(st.t*4)>0?'#ffe9b0':'#c8a860');
      // Auntie Hua watching from the corner
      drawPerson(SW.x0+8, SW.y1+4, {...NPCS.hua.look, dir:'right'}, st.t);
      /* dusts + king + player, sorted by y */
      const items = [];
      for (const d of st.dusts) items.push({y:d.y, f:()=> drawDust(d.x, d.y, d.r, st.t, d.seed, !!st.king)});
      if (st.king && !st.king.out) items.push({y:st.king.y, f:()=> drawDustKing(st.king.x, st.king.y, st.t, st.king.hurtT)});
      for (const pf of st.puffs) items.push({y:pf.y, f:()=>{ circle(pf.x, pf.y, 3.4, '#8f8880'); circle(pf.x-1, pf.y-1, 1.6, '#c4bcb0'); }});
      items.push({y:st.py+1, f:()=>{
        drawPerson(st.px, st.py, {...playerLook(), dir:st.dir, walk:st.moving||st.dashT>0}, st.t);
        if (st.sweepT>0) drawBroom(st.px, st.py-9, st.aimA||0, 1-st.sweepT/0.26);
        else { // broom at rest
          const ax = st.dir==='left'?-1:1;
          R(st.px+ax*7, st.py-16, 1.6, 15, '#8a6a48');
          R(st.px+ax*7-2, st.py-3, 5, 3, '#c8a860');
        }
      }});
      items.sort((a,b)=>a.y-b.y);
      for (const it of items) it.f();
      drawParts(0,0);
      cx.restore();

      /* HUD */
      mgHeader("AUNTIE HUA'S BIG SWEEP", 'out with the old luck!');
      // luck meter
      T('LUCK', 10, 30, 5.4, '#f2b632');
      R(34, 30, 84, 7, 'rgba(20,12,16,0.85)');
      R(34, 30, 84, 1, '#6a5a48'); R(34, 36, 84, 1, '#6a5a48');
      R(35, 31, 82*clamp(st.luck/100,0,1), 5, st.luck>40 ? '#e03c28' : '#ff8a70');
      // progress / king HP
      if (st.king && !st.king.out){
        T('DUST KING', 196, 30, 5.4, '#cfc0a8');
        R(246, 30, 66, 7, 'rgba(20,12,16,0.85)');
        for (let i=0;i<st.king.needPushes;i++)
          R(247.5+i*13, 31.2, 11.5, 4.6, i < st.king.pushes ? '#8f8880' : '#3a352f');
      } else {
        T('DUST SWEPT  '+Math.min(st.swept,st.need)+' / '+st.need, 312, 30, 5.4, '#cfc0a8', 'right');
      }
      // dash pip
      R(276, 42, 38, 4, 'rgba(20,12,16,0.85)');
      R(276, 42, 38*(1-st.dashCd/0.6), 4, st.dashCd<=0 ? '#7ce87c' : '#8a7c6a');
      T('DASH', 254, 41, 4.6, '#8a7c6a');

      if (st.mode==='intro'){
        box(26, 60, 268, 52);
        T('OUT WITH THE OLD LUCK!', LW/2, 66, 8, '#f2b632','center');
        T('Sweep every dust bunny out the door before the new year.', LW/2, 80, 5.6, '#f4e8d0','center');
        T('ARROWS move · CLICK to sweep at the cursor · SPACE dash', LW/2, 92, 5.6, '#ffe9b0','center');
        T('(and do NOT let them touch you)', LW/2, 102, 5, '#cfc0a8','center');
      } else if (st.mode==='lose'){
        box(40, 60, 240, 56);
        T('AI-YA! THE DUST WINS…', LW/2, 68, 7.4, '#ff8a70','center');
        T('Auntie Hua hands you the broom again.', LW/2, 82, 5.6, '#f4e8d0','center');
        T('CLICK to try again  (or Z)', LW/2, 94, 6.6, Math.sin(st.t*5)>0?'#ffe9b0':'#8a7c6a','center');
        T('✕ step outside', LW/2, 104, 5.2, '#cfc0a8','center');
      } else if (st.mode==='win'){
        box(34, 58, 252, 56);
        T('SPOTLESS!', LW/2, 64, 9, '#f2b632','center');
        T('Huì Qì the Dust King tumbles out the door,', LW/2, 79, 5.6, '#f4e8d0','center');
        T('taking last year’s bad luck with him.', LW/2, 88, 5.6, '#f4e8d0','center');
        T('CLICK', LW/2, 100, 5.6, '#cfc0a8','center');
      }
      if (st.msgT>0 && st.mode!=='win') T(st.msg, LW/2, 120, 6.6, st.msgC, 'center');
    }
  };
}
/* ============================================================
   KITCHEN GAMES — dumplings (jiǎozi) and zongzi
   Both run three real steps with a visible step tracker.
   ============================================================ */

function stepTracker(steps, cur, accent){
  const n = steps.length;
  const w = 84, x0 = LW/2 - (n*w)/2;
  for (let i=0;i<n;i++){
    const x = x0 + i*w, on = i===cur, done = i<cur;
    R(x+4, 28, w-8, 13, on ? 'rgba(242,182,50,0.22)' : 'rgba(20,12,16,0.7)');
    R(x+4, 28, w-8, 1, on ? accent : '#4a3a3e');
    circle(x+13, 34.5, 4.6, done ? '#7ce87c' : on ? accent : '#4a3a3e');
    T(done ? '✓' : String(i+1), x+13, 31.4, 5.4, '#2b1a26', 'center');
    T(steps[i], x+22, 31.4, 5.4, on ? '#ffe9b0' : done ? '#7ce87c' : '#7a6c60');
  }
}
function gradeOf(score){
  return score >= 0.85 ? ['PERFECT!', '#7ce87c'] :
         score >= 0.6  ? ['GOOD',     '#ffe9b0'] :
                         ['LUMPY…',   '#ff8a70'];
}

  for (let i=0;i<LW;i+=26) R(i,123,1,57,'rgba(0,0,0,0.10)');
  // steamer + steam
  R(20, 104, 38, 22, '#8a7458'); R(20, 104, 38, 2, '#a8926e');
  circle(39, 106, 16, '#a8926e'); circle(39, 106, 13, '#c8b696'); circle(39, 106, 10, '#e0d2b0');
  for (let i=0;i<6;i++) R(26+i*5, 96, 2, 8, '#b09a76');

  drawLantern(300, 62, 0.9, true, t);
  if (warm) glow(160, 120, 90, '#ffb050', 0.06);
}

/* ============================================================
   DUMPLINGS — roll the wrapper, spoon the filling, pleat the edge
   ============================================================ */
function makeDumplingGame(onDone){
  const st = {
    idx:0, total:3, stage:0, t:0, evT:0, done:false,
    zones:[1,1,1,1,1], pin:160, pinDir:1, lastPin:160,
    fill:0, filling:false, fillLocked:-1,
    pleats:[], crimp:0, crimpDir:1,
    scores:[], stageScore:[],
    msg:'', msgT:0, msgC:'#ffe9b0', shake:0, flash:0,
  };
  window.DUMP = st;
  const STEPS = ['ROLL', 'FILL', 'PLEAT'];
  function say2(m,c){ st.msg=m; st.msgT=1.1; st.msgC=c||'#ffe9b0'; }
  function resetDumpling(){
    st.zones=[1,1,1,1,1]; st.pin=160; st.fill=0; st.filling=false; st.fillLocked=-1;
    st.crimp=0; st.crimpDir=1; st.stageScore=[];
    const n = 5;
    st.pleats = [];
    for (let i=0;i<n;i++) st.pleats.push({ a: -1.3 + i*(2.6/(n-1)), hit:false });
    st.stage = 0;
  }
  resetDumpling();
  const speedUp = ()=> 1 + st.idx*0.35;

  return {
    aim:false,
    update(dt){
      st.t += dt; st.evT += dt;
      st.msgT = Math.max(0, st.msgT-dt);
      st.shake = Math.max(0, st.shake-dt);
      st.flash = Math.max(0, st.flash-dt);
      updateParts(dt);
      if (st.done){
        if (st.evT > 2.2 || ((just.a||just.click) && st.evT > 0.8)){ popScene(); onDone(); }
        return;
      }

      /* ---- 1. ROLL ---- */
      if (st.stage===0){
        st.lastPin = st.pin;
        if (keys.left)  st.pin -= 108*dt;
        if (keys.right) st.pin += 108*dt;
        st.pin = clamp(st.pin, 126, 194);
        const moved = Math.abs(st.pin - st.lastPin);
        if (moved > 0.05){
          const zi = clamp(Math.floor((st.pin-126)/13.6), 0, 4);
          st.zones[zi] = Math.max(-0.35, st.zones[zi] - moved*0.055);
          if (Math.random()<0.25) spawnPart({x:st.pin+rnd(-8,8), y:96+rnd(-4,4), vx:0, vy:-rnd(4,14), g:0, life:0.4, t:0, c:'#f6ecd8', sz:1.4});
        }
        const ok = st.zones.every(z=> z<=0.28 && z>=-0.2);
        const anyTorn = st.zones.some(z=> z < -0.2);
        if (ok || anyTorn){
          st.holdLock = true;
          const acc = anyTorn ? 0.45 : 1;
          st.stageScore.push(acc);
          st.stage = 1; st.evT = 0;
          say2(anyTorn ? 'A bit thin — keep going!' : 'Even and round!', anyTorn ? '#ff8a70' : '#7ce87c');
          SFX.good();
        }
      }
      /* ---- 2. FILL ---- */
      else if (st.stage===1){
        if (st.holdLock){ if (!(keys.a || mouse.down) && st.evT > 0.4) st.holdLock = false; return; }
        const held = keys.a || mouse.down;
        if (held){ st.filling = true; st.fill += (0.42*speedUp())*dt; }
        else if (st.filling){
          st.filling = false;
          const f = st.fill;
          // sweet spot 0.55 .. 0.8
          let acc = 0;
          if (f >= 0.55 && f <= 0.82){ acc = 1; say2('Just right!', '#7ce87c'); SFX.good(); }
          else if (f > 0.82){ acc = 0.35; say2('Too much — it will burst!', '#ff8a70'); SFX.bad(); st.shake=0.3; }
          else { acc = 0.5; say2('A little empty…', '#ffd0a0'); }
          st.fillLocked = f;
          st.stageScore.push(acc);
          st.stage = 2; st.evT = 0;
        }
        if (st.fill > 1.25){ st.filling=false; st.fillLocked=st.fill; st.stageScore.push(0.25);
          say2('It overflowed!', '#ff8a70'); SFX.bad(); st.stage=2; st.evT=0; }
      }
      /* ---- 3. PLEAT ---- */
      else if (st.stage===2){
        st.crimp += st.crimpDir * dt * (0.95*speedUp());
        if (st.crimp > 1){ st.crimp = 1; st.crimpDir = -1; }
        if (st.crimp < 0){ st.crimp = 0; st.crimpDir = 1; }
        if (just.a || just.click){
          const ca = -1.55 + st.crimp*3.1;
          let best = null, bd = 99;
          for (const p of st.pleats){ if (p.hit) continue;
            const d = Math.abs(p.a - ca); if (d < bd){ bd = d; best = p; } }
          if (best && bd < 0.3){
            best.hit = true; SFX.blip();
            const px2 = 160 + Math.sin(best.a)*26, py2 = 96 - Math.cos(best.a)*20;
            burst(px2, py2, ['#f6ecd8','#e8d8b8'], 6, 26);
            if (st.pleats.every(p=>p.hit)){
              st.stageScore.push(1);
              finishDumpling();
            }
          } else { SFX.bad(); st.shake = 0.2; say2('Missed the fold!', '#ff8a70'); st.misses = (st.misses||0)+1; }
        }
        if (st.evT > 15){                                 // don't stall forever
          const hits = st.pleats.filter(p=>p.hit).length;
          st.stageScore.push(hits/st.pleats.length);
          finishDumpling();
        }
      }
      function finishDumpling(){
        const acc = st.stageScore.reduce((a,b)=>a+b,0)/st.stageScore.length;
        st.scores.push(acc);
        const [g,c] = gradeOf(acc);
        say2(g, c); SFX.win(); st.flash = 0.4;
        burst(160, 96, ['#f2b632','#ffe98a','#f6ecd8'], 26, 60);
        st.idx++;
        if (st.idx >= st.total){ st.done = true; st.evT = 0; }
        else { resetDumpling(); st.evT = 0; }
      }
    },

    render(){
      const shx = st.shake>0 ? Math.round(Math.sin(st.t*60)*2) : 0;
      cx.save(); cx.translate(shx*P, 0);
      kitchenRoom(st.t, true);
      // finished dumplings on the tray
      R(206, 128, 92, 22, '#6a4c30'); R(206, 128, 92, 2, '#8a6444');
      st.scores.forEach((sc,i)=>{
        const [,c] = gradeOf(sc);
        drawDumpling(220+i*26, 140, 1.2);
        R(214+i*26, 146, 12, 1.6, c);
      });
      // the board + wrapper
      R(118, 78, 84, 46, '#c8a878'); R(118, 78, 84, 2, '#e0c898');
      const flat = 1 - (st.zones.reduce((a,b)=>a+b,0)/5);
      const rw = 20 + flat*10;
      if (st.stage===0){
        ell(160, 96, rw, rw*0.62, '#e8d8b8');
        ell(160, 95, rw-2, rw*0.55, '#f6ecd8');
        // thickness bars
        for (let i=0;i<5;i++){
          const z = st.zones[i], x = 130+i*13.6;
          const good = z<=0.28 && z>=-0.2, torn = z<-0.2;
          R(x, 112, 11, 7, 'rgba(20,12,16,0.7)');
          R(x+1, 113, 9*clamp(1-Math.max(z,0),0,1), 5, torn ? '#ff8a70' : good ? '#7ce87c' : '#c8a860');
        }
        // rolling pin
        R(st.pin-15, 84, 30, 6, '#8a6a48');
        R(st.pin-15, 84, 30, 2, '#a88054');
        R(st.pin-19, 85.5, 5, 3, '#6a4a34'); R(st.pin+14, 85.5, 5, 3, '#6a4a34');
      } else {
        ell(160, 96, 22, 14, '#e8d8b8');
        ell(160, 95, 20, 12, '#f6ecd8');
      }
      // filling
      if (st.stage>=1){
        const f = st.stage===1 ? st.fill : st.fillLocked;
        const m = clamp(f, 0, 1.1);
        if (m > 0.02){
          ell(160, 95, 5+m*10, 3+m*6, '#b06a3a');
          ell(159, 93, 3+m*7, 2+m*4, '#c88a5a');
          R(157, 92, 3, 1.4, '#8ab04c');
        }
      }
      if (st.stage===1){
        // fill gauge with the sweet spot marked
        R(108, 132, 104, 10, 'rgba(20,12,16,0.8)');
        R(108+0.55*104, 132, (0.82-0.55)*104, 10, 'rgba(124,232,124,0.35)');
        R(108, 132, 104*clamp(st.fill,0,1.2), 10, st.fill>0.82 ? '#ff8a70' : '#f2b632');
        R(108, 132, 104, 1, '#6a5a48'); R(108, 141, 104, 1, '#6a5a48');
        T('HOLD to spoon it in — let go inside the green', 160, 146, 5.2, '#cfc0a8', 'center');
      }
      // pleats
      if (st.stage===2){
        for (const p of st.pleats){
          const px2 = 160 + Math.sin(p.a)*30, py2 = 92 - Math.cos(p.a)*19;
          if (p.hit){
            R(px2-2.4, py2-5, 4.8, 9, '#c8b89a');
            R(px2-1.8, py2-4.4, 3.6, 8, '#f6ecd8');
            R(px2-1.8, py2-4.4, 3.6, 2, '#ffffff');
          } else {
            circle(px2, py2, 5, 'rgba(242,182,50,0.28)');
            circle(px2, py2, 3.4, '#8a6a3a'); circle(px2, py2, 2.4, '#f2b632');
          }
        }
        const ca = -1.55 + st.crimp*3.1;
        const cxp = 160 + Math.sin(ca)*30, cyp = 92 - Math.cos(ca)*19;
        glow(cxp, cyp, 11, '#ffe9b0', 0.3);
        R(cxp-4, cyp-13, 8, 11, '#a8845a'); R(cxp-3, cyp-12, 6, 9, '#f0d898');
        R(cxp-3, cyp-12, 6, 2, '#fff6e2');
        R(cxp-1.4, cyp-2.4, 3, 4, '#8a6a48');
        T('CLICK on each fold as the fingers pass', 160, 146, 5.2, '#cfc0a8', 'center');
      }
      if (st.stage===0) T('◀ ▶ roll the pin until every bar is green', 160, 146, 5.2, '#cfc0a8', 'center');
      drawParts(0,0);
      if (st.flash>0){ cx.globalAlpha = st.flash*0.5; R(0,0,LW,LH,'#ffe9b0'); cx.globalAlpha = 1; }
      cx.restore();

      mgHeader('DUMPLING KITCHEN', 'fold them like little gold ingots');
      stepTracker(STEPS, st.stage, '#f2b632');
      T('DUMPLING '+Math.min(st.idx+1, st.total)+' / '+st.total, 160, 44, 5.4, '#cfc0a8', 'center');
      if (st.msgT>0 && !st.done) T(st.msg, 160, 54, 6.6, st.msgC, 'center');
      if (st.done){
        const avg = st.scores.reduce((a,b)=>a+b,0)/st.scores.length;
        const [g,c] = gradeOf(avg);
        box(46, 58, 228, 52);
        T(g, LW/2, 64, 9, c, 'center');
        T('A whole steamer of golden-ingot dumplings!', LW/2, 80, 5.6, '#f4e8d0', 'center');
        T('CLICK', LW/2, 94, 5.6, '#cfc0a8', 'center');
      }
    }
  };
}

/* ============================================================
   ZONGZI — fold the leaf, pour the rice, tie the string
   ============================================================ */
function makeZongziGame(onDone){
  const st = {
    idx:0, total:3, stage:0, t:0, evT:0, done:false,
    fold:0, target:0, rice:0, pouring:false, riceLocked:-1,
    wraps:[], wrapPos:0, wrapDir:1,
    scores:[], stageScore:[],
    msg:'', msgT:0, msgC:'#ffe9b0', shake:0, flash:0,
  };
  window.ZONG = st;
  const STEPS = ['FOLD', 'FILL', 'TIE'];
  function say2(m,c){ st.msg=m; st.msgT=1.1; st.msgC=c||'#ffe9b0'; }
  function reset(){
    st.fold = 0; st.target = rnd(0.35, 0.8); st.rice = 0; st.pouring=false; st.riceLocked=-1;
    st.wrapPos = 0; st.wrapDir = 1; st.stageScore = [];
    st.wraps = [0.22, 0.45, 0.68, 0.88].map(p=>({p, hit:false}));
    st.stage = 0;
  }
  reset();
  const speedUp = ()=> 1 + st.idx*0.3;

  return {
    aim:false,
    update(dt){
      st.t += dt; st.evT += dt;
      st.msgT = Math.max(0, st.msgT-dt);
      st.shake = Math.max(0, st.shake-dt);
      st.flash = Math.max(0, st.flash-dt);
      updateParts(dt);
      if (st.done){
        if (st.evT > 2.2 || ((just.a||just.click) && st.evT > 0.8)){ popScene(); onDone(); }
        return;
      }
      /* 1. FOLD the leaf into a cone */
      if (st.stage===0){
        if (keys.left)  st.fold -= 0.55*dt;
        if (keys.right) st.fold += 0.55*dt;
        st.fold = clamp(st.fold, 0, 1);
        if (just.a || just.click){
          const off = Math.abs(st.fold - st.target);
          const acc = off < 0.05 ? 1 : off < 0.12 ? 0.7 : 0.4;
          st.stageScore.push(acc);
          say2(off<0.05 ? 'A perfect cone!' : off<0.12 ? 'Close enough.' : 'Loose — rice will leak!',
               off<0.05 ? '#7ce87c' : off<0.12 ? '#ffe9b0' : '#ff8a70');
          if (off<0.12) SFX.good(); else SFX.bad();
          st.stage = 1; st.evT = 0; st.holdLock = true;   // the fold click must not pour
        }
      }
      /* 2. POUR the rice */
      else if (st.stage===1){
        // wait for a FRESH press (and a beat) so the fold's click can't spill rice
        if (st.holdLock){
          if (!(keys.a || mouse.down) && st.evT > 0.5) st.holdLock = false;
          return;
        }
        const held = keys.a || mouse.down;
        if (held){ st.pouring = true; st.rice += (0.4*speedUp())*dt;
          if (Math.random()<0.6) spawnPart({x:160+rnd(-5,5), y:74, vx:rnd(-6,6), vy:rnd(30,50), g:60, life:0.5, t:0, c:'#f6ecd8', sz:1.4}); }
        else if (st.pouring){
          st.pouring = false;
          const f = st.rice;
          let acc = (f >= 0.6 && f <= 0.86) ? 1 : f > 0.86 ? 0.35 : 0.55;
          say2(acc===1 ? 'Filled to the line!' : f>0.86 ? 'Overfilled — it will split!' : 'Under-filled.',
               acc===1 ? '#7ce87c' : '#ff8a70');
          if (acc===1) SFX.good(); else { SFX.bad(); st.shake=0.25; }
          st.riceLocked = f; st.stageScore.push(acc);
          st.stage = 2; st.evT = 0;
        }
        if (st.rice > 1.15){ st.pouring=false; st.riceLocked=st.rice; st.stageScore.push(0.25);
          say2('It spilled everywhere!', '#ff8a70'); SFX.bad(); st.stage=2; st.evT=0; }
      }
      /* 3. TIE the string */
      else if (st.stage===2){
        st.wrapPos += st.wrapDir * dt * (0.85*speedUp());
        if (st.wrapPos > 1){ st.wrapPos = 1; st.wrapDir = -1; }
        if (st.wrapPos < 0){ st.wrapPos = 0; st.wrapDir = 1; }
        if (just.a || just.click){
          let best=null, bd=99;
          for (const w of st.wraps){ if (w.hit) continue;
            const d = Math.abs(w.p - st.wrapPos); if (d<bd){ bd=d; best=w; } }
          if (best && bd < 0.075){
            best.hit = true; SFX.blip();
            burst(160, 72 + best.p*34, ['#e8d8b8','#f6ecd8'], 6, 24);
            if (st.wraps.every(w=>w.hit)){ st.stageScore.push(1); finish(); }
          } else { SFX.bad(); st.shake=0.2; say2('The string slipped!', '#ff8a70'); }
        }
        if (st.evT > 15){
          const hits = st.wraps.filter(w=>w.hit).length;
          st.stageScore.push(hits/st.wraps.length); finish();
        }
      }
      function finish(){
        const acc = st.stageScore.reduce((a,b)=>a+b,0)/st.stageScore.length;
        st.scores.push(acc);
        const [g,c] = gradeOf(acc);
        say2(g, c); SFX.win(); st.flash = 0.4;
        burst(160, 86, ['#3e8b4e','#7ce87c','#e8d8b8'], 24, 60);
        st.idx++;
        if (st.idx >= st.total){ st.done = true; st.evT = 0; }
        else { reset(); st.evT = 0; }
      }
    },

    render(){
      const shx = st.shake>0 ? Math.round(Math.sin(st.t*60)*2) : 0;
      cx.save(); cx.translate(shx*P, 0);
      kitchenRoom(st.t, false);
      // a bowl of soaked rice and a stack of leaves
      circle(40, 138, 15, '#9a8a6a'); circle(40, 138, 12, '#f2ecd8');
      for (let i=0;i<5;i++) R(268+i*3, 128+i, 26, 4, i%2?'#2e7a3e':'#3f9450');
      // finished zongzi
      st.scores.forEach((sc,i)=>{
        const [,c] = gradeOf(sc);
        drawZongzi(216+i*26, 140, 1.3);
        R(210+i*26, 150, 12, 1.6, c);
      });
      /* the leaf cone */
      const f = st.fold;
      const spread = lerp(30, 8, f);
      const cxp = 160, cyp = 74;
      tri(cxp-spread, cyp, cxp+spread, cyp, cxp, cyp+40, '#1a3a1e');
      tri(cxp-spread+2, cyp+2, cxp+spread-2, cyp+2, cxp, cyp+37, '#2e7a3e');
      tri(cxp-spread+4, cyp+3, cxp-2, cyp+3, cxp-2, cyp+28, '#3f9450');
      R(cxp-spread, cyp-1, spread*2, 2, '#54ad63');
      if (st.stage===0){
        // ghost target cone
        const ts = lerp(30, 8, st.target);
        cx.globalAlpha = 0.35 + Math.sin(st.t*4)*0.12;
        tri(cxp-ts, cyp, cxp+ts, cyp, cxp, cyp+40, '#f2b632');
        cx.globalAlpha = 1;
        T('◀ ▶ fold to match the golden outline, then CLICK', 160, 146, 5.2, '#cfc0a8', 'center');
      }
      // rice inside
      if (st.stage>=1){
        const m = clamp(st.stage===1 ? st.rice : st.riceLocked, 0, 1.1);
        if (m>0.02){
          const top = cyp + 36 - m*30;
          tri(cxp-spread*0.8, top, cxp+spread*0.8, top, cxp, cyp+36, '#f6ecd8');
          R(cxp-spread*0.5, top, spread, 1.4, '#e8dcc0');
          if (m > 0.4){ R(cxp-3, top+6, 6, 4, '#b06a3a'); }
        }
      }
      if (st.stage===1){
        R(108, 132, 104, 10, 'rgba(20,12,16,0.8)');
        R(108+0.6*104, 132, (0.86-0.6)*104, 10, 'rgba(124,232,124,0.35)');
        R(108, 132, 104*clamp(st.rice,0,1.2), 10, st.rice>0.86 ? '#ff8a70' : '#f2b632');
        R(108, 132, 104, 1, '#6a5a48'); R(108, 141, 104, 1, '#6a5a48');
        T('HOLD to pour the sticky rice — stop in the green', 160, 146, 5.2, '#cfc0a8', 'center');
      }
      // string wraps
      if (st.stage===2){
        for (const w of st.wraps){
          const yy = cyp + 6 + w.p*30;
          const half = spread * (1 - w.p*0.7);
          if (w.hit){ R(cxp-half, yy, half*2, 1.6, '#e8d8b8'); R(cxp-half, yy+1.6, half*2, 1, '#c8b89a'); }
          else { cx.globalAlpha = 0.4; R(cxp-half, yy, half*2, 1.4, '#f2b632'); cx.globalAlpha = 1; }
        }
        const yy = cyp + 6 + st.wrapPos*30;
        const half = spread * (1 - st.wrapPos*0.7);
        R(cxp-half-4, yy-1, 4, 3, '#d8b869');
        R(cxp+half, yy-1, 4, 3, '#d8b869');
        T('CLICK as the string crosses each gold line', 160, 146, 5.2, '#cfc0a8', 'center');
      }
      drawParts(0,0);
      if (st.flash>0){ cx.globalAlpha = st.flash*0.5; R(0,0,LW,LH,'#d8f0c8'); cx.globalAlpha = 1; }
      cx.restore();

      mgHeader('ZONGZI WRAP-OFF', 'rice armour for a beloved poet');
      stepTracker(STEPS, st.stage, '#3f9450');
      T('ZONGZI '+Math.min(st.idx+1, st.total)+' / '+st.total, 160, 44, 5.4, '#cfc0a8', 'center');
      if (st.msgT>0 && !st.done) T(st.msg, 160, 54, 6.6, st.msgC, 'center');
      if (st.done){
        const avg = st.scores.reduce((a,b)=>a+b,0)/st.scores.length;
        const [g,c] = gradeOf(avg);
        box(46, 58, 228, 52);
        T(g, LW/2, 64, 9, c, 'center');
        T('A perfect pyramid of zongzi, tied tight!', LW/2, 80, 5.6, '#f4e8d0', 'center');
        T('CLICK', LW/2, 94, 5.6, '#cfc0a8', 'center');
      }
    }
  };
}
/* ============================================================
   DRAGON BOAT RACE — paddle on the drum, steer, dodge, surge
   ============================================================ */
const RACE_LEN = 1600;
const LANES = [76, 106, 136];

function drawRipple(x, y, w, a){
  cx.globalAlpha = a; R(x, y, w, 1.4, '#7fb4dc'); cx.globalAlpha = 1;
}
function drawRock(x, y, t){
  ell(x, y+6, 11, 3, 'rgba(0,0,0,0.25)');
  circle(x, y, 9, '#2b2a30'); circle(x, y, 7.6, '#5a5860');
  circle(x-2, y-2.4, 4, '#7c7a84');
  R(x-6, y+4, 12, 2, '#3a3840');
  const sp = Math.sin(t*4+x)*1.4;
  drawRipple(x-12, y+7+sp, 24, 0.5);
}
function drawLog(x, y, t){
  ell(x, y+6, 15, 3, 'rgba(0,0,0,0.25)');
  R(x-15, y-4, 30, 9, '#3a2418');
  R(x-15, y-4, 30, 2, '#6a4a30');
  R(x-15, y+3, 30, 2, '#2a1a10');
  for (let i=0;i<4;i++) R(x-11+i*7, y-2, 1.4, 6, '#4a3020');
  circle(x-15, y+0.5, 4.6, '#5a3c26'); circle(x-15, y+0.5, 3, '#7a5636');
  drawRipple(x-18, y+8+Math.sin(t*3+x)*1.2, 36, 0.45);
}
function drawWhirl(x, y, t){
  for (let i=0;i<3;i++){
    const r = 5 + i*3.6, a0 = t*(2.6-i*0.5);
    for (let k=0;k<8;k++){
      const a = a0 + k/8*6.283;
      R(x+Math.cos(a)*r, y+Math.sin(a)*r*0.62, 1.6, 1.6, i%2 ? '#2a5a86' : '#8fc4e4');
    }
  }
  circle(x, y, 2.6, '#16324e');
}
function drawFloatZongzi(x, y, t){
  const bob = Math.sin(t*4+x)*1.6;
  drawZongzi(x, y+bob, 1.15);
  drawRipple(x-8, y+7+bob, 16, 0.5);
  glow(x, y+bob, 11, '#7ce87c', 0.16);
}

function makeBoatRace(onDone){
  const BPM = 108, BEAT = 60/BPM;
  const st = {
    mode:'intro', t:0, evT:0,
    dist:0, spd:0, lane:1, laneY:LANES[1],
    rival:0, rivalLane:0, rivalWob:0,
    beatT:0, beatN:0, lastSide:null, scoredBeat:-1, strokeCd:0,
    stam:100, surge:0, combo:0, best:0,
    stuff:[], splash:0, msg:'', msgT:0, msgC:'#ffe9b0', shake:0,
    perfect:0, strokes:0,
  };
  window.RACE = st;
  function say2(m,c){ st.msg=m; st.msgT=0.7; st.msgC=c||'#ffe9b0'; }
  function build(){
    st.stuff = [];
    for (let d=150; d<RACE_LEN-60; d+=rnd(46, 78)){
      const r = Math.random();
      const kind = 'zongzi';                        // friendly waters: snacks only
      const lane = irnd(0,2);
      st.stuff.push({ d, lane, kind, gone:false });
      if (false){
        let l2 = (lane + 1 + irnd(0,1)) % 3;
        st.stuff.push({ d: d + rnd(-6,6), lane: l2, kind: Math.random()<0.5?'rock':'log', gone:false });
      }
    }
  }
  build();
  function reset(){
    st.dist=0; st.spd=0; st.lane=1; st.laneY=LANES[1]; st.rival=0;
    st.stam=100; st.surge=0; st.combo=0; st.lastSide=null;
    st.perfect=0; st.strokes=0; st.mode='race'; st.evT=0;
    for (const o of st.stuff) o.gone = false;
  }
  function stroke(side){
    if (st.mode!=='race') return;
    if (st.strokeCd > 0){ return; }                       // no mashing
    if (side === st.lastSide){
      say2('alternate ◀ ▶ !', '#ff8a70'); st.combo = 0; SFX.bad(); st.strokeCd = 0.12; return;
    }
    // which beat does this stroke belong to?
    const beatIdx = st.beatN + (st.beatT > BEAT/2 ? 1 : 0);
    if (beatIdx === st.scoredBeat){                        // already paddled this beat
      st.spd += 2; st.combo = 0; st.strokeCd = 0.1;
      say2('one stroke per beat!', '#ffd0a0'); noiseHit(0.04, 0.1);
      return;
    }
    st.scoredBeat = beatIdx;
    st.lastSide = side; st.strokes++; st.strokeCd = 0.16;
    const near = Math.min(st.beatT, BEAT - st.beatT);
    if (near < BEAT*0.20){
      st.spd += 25; st.combo++; st.perfect++;
      st.best = Math.max(st.best, st.combo);
      say2(st.combo>=6 ? 'ON FIRE! ×'+st.combo : 'PERFECT!', '#7ce87c');
      SFX.drum();
      st.stam = Math.min(100, st.stam + 3);
    } else if (near < BEAT*0.36){
      st.spd += 15; st.combo = 0; say2('good', '#ffe9b0'); noiseHit(0.07,0.2,true);
    } else {
      st.spd += 6; st.combo = 0; say2('off the beat…', '#ffd0a0'); noiseHit(0.05,0.14);
    }
    burst(74, st.laneY + (side==='left'?9:-9), ['#cfe4f4','#ffffff'], 5, 26);
  }

  return {
    aim:false,
    enter(){ playMusic(2); },
    update(dt){
      st.t += dt; st.evT += dt;
      st.msgT = Math.max(0, st.msgT-dt);
      st.shake = Math.max(0, st.shake-dt);
      st.splash = Math.max(0, st.splash-dt);
      updateParts(dt);

      if (st.mode==='intro'){ if (st.evT>1.8 || just.a || just.click){ reset(); say2('GO!','#7ce87c'); mdrum(0,0.7); } return; }
      if (st.mode==='win' || st.mode==='lose'){
        if ((just.a || just.click) && st.evT>0.8){
          if (st.mode==='win'){ popScene(); onDone(); }
          else { reset(); }
        }
        return;
      }

      /* drum */
      st.strokeCd = Math.max(0, st.strokeCd - dt);
      st.beatT += dt;
      if (st.beatT >= BEAT){ st.beatT -= BEAT; st.beatN++; mdrum(0, st.beatN%4===0?0.85:0.55, masterGain); }

      /* paddling */
      if (just.left)  stroke('left');
      if (just.right) stroke('right');

      /* steering */
      if (just.up   && st.lane > 0){ st.lane--; SFX.blip(); }
      if (just.down && st.lane < 2){ st.lane++; SFX.blip(); }
      st.laneY = lerp(st.laneY, LANES[st.lane], clamp(dt*9, 0, 1));

      /* surge */
      st.surge = Math.max(0, st.surge - dt);
      if (just.dash && st.stam >= 30 && st.surge<=0){
        st.stam -= 30; st.surge = 1.1; st.spd += 34;
        SFX.dash(); say2('SURGE! WOOSH!', '#cfe4f4');
        for (let k2=0;k2<10;k2++) spawnPart({x:70+rnd(-8,8), y:120+rnd(-10,10), vx:-rnd(40,90), vy:rnd(-16,16), g:0, life:rnd(0.3,0.6), t:0, c:pick(['#cfe4f4','#ffffff']), sz:rnd(1.4,2.4)});
      }
      st.stam = Math.min(100, st.stam + 5.5*dt);

      /* motion */
      st.spd = Math.max(0, st.spd - (st.spd*0.85 + 6)*dt);
      const boost = st.surge>0 ? 1.45 : 1;
      st.dist += st.spd * boost * dt;
      st.rivalWob += dt;
      st.rival += (23 + Math.sin(st.rivalWob*0.6)*5) * dt;

      /* obstacles & pickups */
      for (const o of st.stuff){
        if (o.gone) continue;
        const rel = o.d - st.dist;
        if (rel < -20){ o.gone = true; continue; }
        if (Math.abs(rel) < 7 && o.lane === st.lane){
          o.gone = true;
          if (o.kind === 'zongzi'){
            st.spd += 26; st.stam = Math.min(100, st.stam+18);
            SFX.sparkle(); say2('ZONGZI! +speed', '#7ce87c');
            burst(74, st.laneY, ['#3f9450','#7ce87c','#f6ecd8'], 16, 50);
          } else {
            st.spd *= o.kind==='whirl' ? 0.35 : 0.5;
            st.combo = 0; st.shake = 0.45; st.splash = 0.4;
            SFX.bad(); noiseHit(0.3, 0.4);
            say2(o.kind==='whirl' ? 'caught in the whirlpool!' : 'CRASH!', '#ff8a70');
            burst(74, st.laneY, ['#cfe4f4','#8fc4e4','#ffffff'], 22, 70);
          }
        }
      }

      /* finish */
      if (st.dist >= RACE_LEN){ st.mode='win'; st.evT=0; SFX.win(); playMusic(1); }
      else if (st.rival >= RACE_LEN){ st.mode='lose'; st.evT=0; SFX.bad(); }
    },

    render(){
      const shx = st.shake>0 ? Math.round(Math.sin(st.t*60)*st.shake*5) : 0;
      cx.save(); cx.translate(shx*P, 0);
      /* sky + far bank */
      R(0,0,LW,54,'#bfe0f0');
      R(0,30,LW,10,'#a8d0e4');
      R(0,44,LW,14,'#5da442');
      for (let i=0;i<8;i++){
        const bx = ((i*54 - (st.dist*0.32) % 54) + LW) % (LW+54) - 27;
        drawTree(bx, 56, i%2?'round':'pine', 2);
      }
      /* the river */
      R(0,56,LW,LH-56,'#2f6ea8');
      for (let i=0;i<44;i++){
        const wx = ((i*29 - (st.dist*1.05) % 29) + LW) % (LW+29) - 15;
        const wy = 62 + (i%9)*13;
        drawRipple(wx, wy + Math.sin(st.t*2+i)*1.4, 13, 0.35);
      }
      /* lane markers */
      for (const ly of LANES){
        for (let i=0;i<12;i++){
          const bx = ((i*30 - (st.dist*1.05) % 30) + LW) % (LW+30) - 15;
          R(bx, ly+13, 8, 1, 'rgba(255,255,255,0.10)');
        }
      }
      /* obstacles */
      for (const o of st.stuff){
        if (o.gone) continue;
        const sx = 74 + (o.d - st.dist) * 1.05;
        if (sx < -30 || sx > LW+30) continue;
        const y = LANES[o.lane];
        if (o.kind==='rock')   drawRock(sx, y, st.t);
        else if (o.kind==='log') drawLog(sx, y, st.t);
        else if (o.kind==='whirl') drawWhirl(sx, y, st.t);
        else drawFloatZongzi(sx, y, st.t);
      }
      /* finish line */
      const fx = 74 + (RACE_LEN - st.dist) * 1.05;
      if (fx < LW+40){
        for (let i=0;i<10;i++) R(fx, 58+i*12, 4, 8, i%2?'#f2b632':'#e03c28');
        R(fx-1, 56, 6, 2, '#2b1a26');
      }
      /* rival */
      const rx = 74 + (st.rival - st.dist) * 1.05;
      if (rx > -50 && rx < LW+50) drawBoat(rx, LANES[0]-4, st.t, {crew:true, seed:3});
      /* you */
      drawBoat(74, st.laneY, st.t, {crew:true, seed:1, fast:st.surge>0});
      if (st.surge>0){
        for (let i=0;i<4;i++) R(40-i*7, st.laneY+rnd(-4,4), 6, 1.6, '#cfe4f4');
        glow(74, st.laneY, 24, '#cfe4f4', 0.18);
      }
      if (st.splash>0){
        cx.globalAlpha = st.splash;
        for (let i=0;i<8;i++) circle(74+rnd(-16,16), st.laneY+rnd(-10,10), rnd(1,3), '#cfe4f4');
        cx.globalAlpha = 1;
      }
      drawParts(0,0);
      cx.restore();

      /* HUD */
      mgHeader('DRAGON BOAT RACE', 'row for Qu Yuan');
      // drum
      const pu = 1 - clamp(st.beatT/BEAT, 0, 1);
      drawDrum(20, 44, 0.85 + pu*0.3);
      glow(20, 38, 9+pu*7, '#f2b632', 0.22*pu);
      T('BEAT', 12, 48, 4.4, '#8a7c6a');
      // stamina — and exactly what it is FOR
      const canSurge = st.stam >= 30 && st.surge <= 0;
      T('STAMINA', 40, 30, 4.6, '#8a7c6a');
      R(40, 36, 60, 6, 'rgba(20,12,16,0.85)');
      R(40 + 60*0.3, 35, 1, 8, '#cfe4f4');                      // the surge cost line
      R(40, 36, 60*(st.stam/100), 6, canSurge ? '#7ce87c' : '#8a7c6a');
      if (st.surge > 0){
        T('SURGING!', 40, 45, 5.2, '#cfe4f4');
      } else if (canSurge){
        T('SPACE = SURGE!', 40, 45, 5.2, Math.sin(st.t*6)>0 ? '#ffe98a' : '#c8a860');
      } else {
        T('zongzi refill it', 40, 45, 4.2, '#6a5a48');
      }
      // combo
      if (st.combo>1) T('×'+st.combo+' COMBO', 108, 30, 5.4, '#ffe9b0');
      // progress bar: you vs rival
      R(112, 38, 196, 8, 'rgba(20,12,16,0.85)');
      R(112, 38, 196, 1, '#6a5a48'); R(112, 45, 196, 1, '#6a5a48');
      const pyou = clamp(st.dist/RACE_LEN, 0, 1), priv = clamp(st.rival/RACE_LEN, 0, 1);
      R(113 + priv*192, 39, 3, 6, '#8a8a92');
      R(113 + pyou*192, 39, 3, 6, '#e03c28');
      T('YOU', 112, 30, 4.4, '#e03c28'); T('FINISH', 308, 30, 4.4, '#f2b632', 'right');
      if (st.msgT>0) T(st.msg, LW/2, 60, 6.6, st.msgC, 'center');

      if (st.mode==='intro'){
        box(30, 66, 260, 54);
        T('ROW FOR QU YUAN!', LW/2, 72, 8, '#f2b632','center');
        T('◀ ▶ alternate paddles ON the drum · ▲ ▼ change lane', LW/2, 88, 5.2, '#f4e8d0','center');
        T('SPACE surges · grab zongzi · dodge rocks and logs', LW/2, 98, 5.2, '#f4e8d0','center');
        T('CLICK to start', LW/2, 110, 5.4, '#ffe9b0','center');
      } else if (st.mode==='win'){
        box(40, 62, 240, 54);
        T('FIRST PLACE!', LW/2, 68, 9, '#f2b632','center');
        T('Perfect strokes: '+st.perfect+' / '+st.strokes+'   best combo ×'+st.best, LW/2, 84, 5.4, '#f4e8d0','center');
        T('The drums thunder like they did for Qu Yuan.', LW/2, 94, 5.2, '#cfc0a8','center');
        T('CLICK', LW/2, 106, 5.6, '#cfc0a8','center');
      } else if (st.mode==='lose'){
        box(40, 62, 240, 50);
        T('THEY BEAT YOU TO IT!', LW/2, 68, 8, '#ff8a70','center');
        T('Stay with the drum — every beat is speed.', LW/2, 84, 5.4, '#f4e8d0','center');
        T('CLICK — RACE AGAIN', LW/2, 96, 7, Math.sin(st.t*5)>0?'#ffe9b0':'#8a7c6a','center');
      }
    }
  };
}
/* ============================================================
   MOONCAKE BAKERY — press the dough, fill it, stamp it, bake it.
   Four real stages, mouse + keys, with a step tracker like the
   other kitchen games.
   ============================================================ */

function drawOven(x, y, t, hot){
  R(x, y, 60, 50, '#5a4438'); R(x, y, 60, 3, '#7a5c48');
  R(x+2, y+2, 56, 46, '#4a382e');
  R(x+8, y+12, 44, 28, '#2a1a12');
  if (hot > 0){
    glow(x+30, y+26, 16, '#ff7030', 0.22 + hot*0.24 + Math.sin(t*7)*0.05);
    R(x+10, y+34, 40, 4, '#ff9040');
    for (let i=0;i<5;i++){
      const fy = y+34 - ((t*22 + i*7) % 20);
      R(x+13+i*8, fy, 2, 3, i%2 ? '#ffb050' : '#ff7030');
    }
  }
  R(x+6, y+8, 48, 2, '#8a6a50');            // door hinge line
  R(x+24, y+42, 14, 3, '#c8a860');          // handle
  R(x+4, y-6, 10, 6, '#3a2c24'); R(x+46, y-6, 10, 6, '#3a2c24');  // chimney stubs
}

/* one mooncake on the tray, drawn at whatever bake-tone it has */
function bakedCake(x, y, tone, patt){
  const pale  = ['#e8c88a','#d8b070','#c89858'];
  const gold  = ['#f2b632','#d89020','#b06c14'];
  const burnt = ['#7a4a20','#5a3414','#3a2008'];
  const mix = (a,b,k)=>{
    const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
    const r = Math.round((pa>>16)*(1-k) + (pb>>16)*k);
    const g = Math.round(((pa>>8)&255)*(1-k) + ((pb>>8)&255)*k);
    const bl= Math.round((pa&255)*(1-k) + ((pb)&255)*k);
    return '#' + ((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1);
  };
  let pal;
  if (tone < 0.5){ const k = tone/0.5; pal = pale.map((c,i)=> mix(c, gold[i], k)); }
  else { const k = (tone-0.5)/0.5; pal = gold.map((c,i)=> mix(c, burnt[i], k)); }
  ell(x, y+7, 13, 4, 'rgba(20,12,16,0.30)');
  ell(x, y, 13, 9, pal[2]);
  ell(x, y-1, 12, 8, pal[0]);
  ell(x, y-1, 9, 6, pal[1]);
  // pressed pattern
  if (patt){
    R(x-5, y-2, 10, 1, pal[2]); R(x-1, y-5, 1, 8, pal[2]);
    R(x-4, y-4, 1, 1, pal[2]); R(x+3, y-4, 1, 1, pal[2]);
    R(x-4, y+2, 1, 1, pal[2]); R(x+3, y+2, 1, 1, pal[2]);
  }
  if (tone > 0.86) for (let i=0;i<3;i++) R(x-6+i*5, y-4+((i*3)%5), 2, 1, '#2a1608');
}

/* the dough disc: filled scanline by scanline, each pixel coloured by how
   thick its wedge still is, so the shape stays hard-edged pixel art */
function doughDisc(px, py, rx, ry, sect){
  const SH = ['#c8a066','#dcb87e','#f0d8a4','#8a6a44'];
  const tone = th => th > 0.62 ? 0 : th > 0.26 ? 1 : th < -0.16 ? 3 : 2;
  const iry = Math.round(ry), irx = Math.round(rx);
  for (let yy = -iry; yy <= iry; yy++){
    const k = 1 - (yy*yy)/(ry*ry);
    if (k <= 0) continue;
    const half = Math.floor(rx*Math.sqrt(k));
    let runX = -half, runC = -1;
    for (let xx = -half; xx <= half+1; xx++){
      let c = -1;
      if (xx <= half){
        let a = Math.atan2(yy*(rx/ry), xx); if (a < 0) a += Math.PI*2;
        c = tone(clamp(sect[Math.floor(a/(Math.PI*2/6)) % 6], -0.4, 1));
      }
      if (c !== runC){
        if (runC >= 0) R(px+runX, py+yy, xx-runX, 1, SH[runC]);
        runX = xx; runC = c;
      }
    }
    // crust edge
    R(px-half, py+yy, 1, 1, '#c8a066'); R(px+half, py+yy, 1, 1, '#c8a066');
  }
  for (let xx = -irx; xx <= irx; xx++){
    const k = 1 - (xx*xx)/(rx*rx);
    if (k <= 0) continue;
    const h = Math.floor(ry*Math.sqrt(k));
    R(px+xx, py-h, 1, 1, '#f6ecd8');
    R(px+xx, py+h, 1, 1, '#a8845c');
  }
}

function makeMooncakeGame(onDone){
  const st = {
    idx:0, total:3, stage:0, t:0, evT:0, done:false,
    // press
    sect:[1,1,1,1,1,1], palmX:160, palmY:104, pressing:false,
    // fill
    sub:0, paste:0, pouring:false, yolkX:200, yolkY:78, yolkSet:false,
    // stamp
    moldY:40, moldRot:0, moldTarget:0, moldDrop:false, depth:0, stamped:false,
    // bake
    tone:0, wash:false, washCue:-1, pulled:false,
    cakes:[], scores:[], stageScore:[],
    msg:'', msgT:0, msgC:'#ffe9b0', shake:0, flash:0,
  };
  window.MOON = st;
  const STEPS = ['PRESS', 'FILL', 'STAMP'];
  /* the mould face has four identical spokes, so a quarter turn is the same
     pattern — measure how far off we are within one 90 degree sector */
  function moldSigned(){
    let d = ((st.moldRot - st.moldTarget) % 90 + 90) % 90;
    return d > 45 ? d - 90 : d;                      // -45 .. +45
  }
  function moldOff(){ return Math.abs(moldSigned()); }
  function say2(m,c){ st.msg=m; st.msgT=1.2; st.msgC=c||'#ffe9b0'; }

  function resetCake(){
    st.sect=[1,1,1,1,1,1]; st.palmX=160; st.palmY=104; st.pressing=false;
    st.sub=0; st.paste=0; st.pouring=false; st.yolkSet=false;
    st.yolkX=200; st.yolkY=78;
    st.moldY=68; st.moldRot=0; st.depth=0; st.moldDrop=false; st.stamped=false;
    st.moldTarget = [8, 26, 44, 62][Math.floor(Math.random()*4)];
    st.stageScore=[];
    st.stage=0;
  }
  resetCake();

  const CX0 = 160, CY0 = 116;             // dough centre on the table

  function finishStage(score){
    st.stageScore.push(clamp(score,0,1));
    st.stage++;
    st.holdLock = true; st.evT = 0;
    st.flash = 0.3;
    if (st.stage >= 3){
      const avg = st.stageScore.reduce((a,b)=>a+b,0) / st.stageScore.length;
      st.scores.push(avg);
      st.cakes.push({ q: avg });
      const [g,c] = gradeOf(avg);
      say2(g + '  mooncake ' + (st.idx+1) + ' done!', c);
      burst(CX0, CY0, ['#f2b632','#ffe98a','#ffd964'], 26, 66);
      SFX.win();
      st.idx++;
      if (st.idx >= st.total){ st.stage = 3; st.evT = 0; st.washCue = 0.9 + Math.random()*0.9; }
      else resetCake();
    } else {
      SFX.good();
    }
  }

  return {
    aim:false,
    update(dt){
      st.t += dt; st.evT += dt;
      st.msgT = Math.max(0, st.msgT-dt);
      st.shake = Math.max(0, st.shake-dt);
      st.flash = Math.max(0, st.flash-dt);
      updateParts(dt);
      if (st.done){
        if (st.evT > 2.2 || ((just.a||just.click) && st.evT > 0.8)){ popScene(); onDone(); }
        return;
      }

      /* ---------- 1. PRESS: flatten every wedge of dough ---------- */
      if (st.stage===0){
        if (mouse.over){ st.palmX = mouse.x; st.palmY = mouse.y; }
        else {
          if (keys.left)  st.palmX -= 92*dt;
          if (keys.right) st.palmX += 92*dt;
          if (keys.up)    st.palmY -= 92*dt;
          if (keys.down)  st.palmY += 92*dt;
        }
        st.palmX = clamp(st.palmX, CX0-34, CX0+34);
        st.palmY = clamp(st.palmY, CY0-30, CY0+30);
        st.pressing = keys.a || mouse.down;
        if (st.pressing){
          const dx = st.palmX-CX0, dy = (st.palmY-CY0)*1.5;
          const d = Math.hypot(dx, dy);
          if (d < 30){
            let a = Math.atan2(dy, dx); if (a < 0) a += Math.PI*2;
            const si = Math.floor(a / (Math.PI*2/6)) % 6;
            st.sect[si] = Math.max(-0.4, st.sect[si] - dt*1.35);
            if (Math.random()<0.3) spawnPart({x:st.palmX+rnd(-6,6), y:st.palmY+rnd(-3,3), vx:rnd(-8,8), vy:-rnd(4,16), g:20, life:0.45, t:0, c:'#f6ecd8', sz:1.4});
            if (Math.random()<0.09) SFX.blip();
          }
        }
        const flat = st.sect.every(s => s <= 0.26);
        if (flat){
          const over = st.sect.filter(s => s < -0.16).length;
          const evenness = 1 - (Math.max(...st.sect) - Math.min(...st.sect)) * 0.9;
          const sc = clamp(evenness - over*0.18, 0, 1);
          if (over >= 3) say2('a bit torn — patch it up', '#ff8a70');
          finishStage(sc);
        }
        return;
      }

      /* ---------- 2. FILL: pour lotus paste, then seat the yolk ---------- */
      if (st.stage===1){
        if (st.sub===0){
          if (st.holdLock){ if (!(keys.a || mouse.down) && st.evT > 0.4) st.holdLock = false; return; }
          st.pouring = keys.a || mouse.down;
          if (st.pouring){
            st.paste += dt*0.42;
            if (Math.random()<0.5) spawnPart({x:CX0+rnd(-4,4), y:96, vx:0, vy:34, g:120, life:0.34, t:0, c:'#d8a860', sz:1.6});
            if (Math.random()<0.11) SFX.blip();
          } else if (st.paste > 0.08){
            const sc = st.paste >= 0.62 && st.paste <= 0.86 ? 1 - Math.abs(st.paste-0.74)/0.16*0.35
                     : Math.max(0, 1 - Math.abs(st.paste-0.74)*2.4);
            st.stageScore.push(clamp(sc,0,1));
            if (st.paste < 0.62) say2('thin filling… still tasty', '#ff8a70');
            else if (st.paste > 0.86) say2('overstuffed! it may burst', '#ff8a70');
            else say2('just right — now the yolk', '#7ce87c');
            st.sub = 1; SFX.good();
          }
          if (st.paste > 1.25){ st.paste = 1.25; }
          return;
        }
        // sub 1: the salted egg yolk — the little full moon inside
        if (mouse.over){ st.yolkX = mouse.x; st.yolkY = mouse.y; }
        else {
          if (keys.left)  st.yolkX -= 88*dt;
          if (keys.right) st.yolkX += 88*dt;
          if (keys.up)    st.yolkY -= 88*dt;
          if (keys.down)  st.yolkY += 88*dt;
        }
        st.yolkX = clamp(st.yolkX, 30, 290); st.yolkY = clamp(st.yolkY, 60, 150);
        if (just.a || just.click){
          const d = Math.hypot(st.yolkX-CX0, (st.yolkY-(CY0-4))*1.4);
          const sc = clamp(1 - d/22, 0, 1);
          st.yolkSet = true;
          burst(st.yolkX, st.yolkY, ['#ffb030','#ffd964'], 14, 40);
          if (d < 6) say2('dead centre — a full moon inside!', '#7ce87c');
          else if (d < 16) say2('close enough', '#ffe9b0');
          else { say2('off to one side…', '#ff8a70'); st.shake = 0.2; }
          finishStage(sc);
        }
        return;
      }

      /* ---------- 3. STAMP: line up the mould, press to the right depth ---------- */
      if (st.stage===2){
        if (!st.moldDrop){
          if (keys.left)  st.moldRot -= 96*dt;
          if (keys.right) st.moldRot += 96*dt;
          st.moldRot = (st.moldRot + 360) % 360;
          st.moldY = 68 + Math.sin(st.t*2)*2;
          if (just.a || just.click){ st.moldDrop = true; SFX.blip(); }
          return;
        }
        // pressing down: depth climbs while held, springs back when let go
        const holding = keys.a || mouse.down;
        if (holding && !st.stamped){
          st.depth += dt*0.62;
          st.moldY = 68 + st.depth*38;
          if (Math.random()<0.2) spawnPart({x:CX0+rnd(-12,12), y:CY0-2, vx:rnd(-14,14), vy:-rnd(2,10), g:30, life:0.35, t:0, c:'#f6ecd8', sz:1.2});
          if (st.depth > 1.25){
            st.stamped = true;
            say2('SQUASHED! too hard', '#ff8a70'); st.shake = 0.3; SFX.bad();
            finishStage(0.2);
          }
        } else if (!holding && st.depth > 0.05 && !st.stamped){
          st.stamped = true;
          const da = moldOff();                            // 0 = perfectly lined up
          const dep = clamp(1 - Math.abs(st.depth-0.78)/0.4, 0, 1);
          const rot = clamp(1 - da/40, 0, 1);
          const sc = dep*0.55 + rot*0.45;
          burst(CX0, CY0-2, ['#f2b632','#ffe98a'], 20, 52);
          if (sc > 0.82) say2('a crisp, clean pattern!', '#7ce87c');
          else if (st.depth < 0.5) say2('too light — the pattern is faint', '#ff8a70');
          else if (rot < 0.4) say2('the pattern came out crooked', '#ff8a70');
          else say2('good enough for the tray', '#ffe9b0');
          SFX.good();
          finishStage(sc);
        }
        return;
      }

      /* ---------- 4. BAKE: brush the egg wash, pull at golden ---------- */
      if (st.stage===3){
        st.tone += dt*0.115;
        if (st.washCue > 0 && st.evT > st.washCue && !st.wash){
          if (just.a || just.click){
            st.wash = true; SFX.sparkle();
            say2('egg wash on — that is where the shine comes from', '#7ce87c');
            burst(160, 92, ['#ffd964','#ffe98a'], 16, 44);
          }
          if (st.evT > st.washCue + 3.0){
            st.washCue = -1;
            say2('missed the egg wash — they will look dull', '#ff8a70');
          }
        } else if (!st.pulled && st.evT > 0.7 && (just.a || just.click)){
          st.pulled = true;
          const sc = clamp(1 - Math.abs(st.tone-0.52)/0.34, 0, 1) * (st.wash ? 1 : 0.8);
          const avg = st.scores.reduce((a,b)=>a+b,0) / st.scores.length;
          st.final = clamp(avg*0.72 + sc*0.28, 0, 1);
          st.done = true; st.evT = 0;
          SFX.win();
          burst(160, 100, ['#f2b632','#ff5838','#ffe98a','#ffd964'], 46, 84);
        }
        if (st.tone > 1.06 && !st.pulled){
          st.pulled = true;
          const avg = st.scores.reduce((a,b)=>a+b,0) / st.scores.length;
          st.final = clamp(avg*0.72 + 0.06, 0, 1);
          st.tone = 1.06;
          st.done = true; st.evT = 0;
          say2('BURNT! Fang will never mention it again', '#ff8a70');
          SFX.bad();
        }
        return;
      }
    },

    render(){
      const sh = st.shake>0 ? Math.sin(st.t*60)*2 : 0;
      cx.save(); cx.translate(sh*P, 0);

      /* ---- bakery room ---- */
      R(0,0,LW,LH,'#4a3626');
      for (let i=0;i<LW;i+=24) R(i,0,1,LH,'rgba(0,0,0,0.14)');
      R(0,44,LW,10,'#6a4c34'); R(0,44,LW,2,'#8a6444');
      // flour sacks + rolling pins on the wall shelf
      R(232,58,58,3,'#8a6a48'); R(240,50,3,8,'#a88054'); R(272,50,3,8,'#a88054');
      R(0,124,LW,56,'#8a6844'); R(0,124,LW,3,'#a88054');
      for (let i=0;i<LW;i+=26) R(i,127,1,53,'rgba(0,0,0,0.10)');
      R(8,112,20,15,'#c8b696'); R(8,112,20,2,'#e0d2b0'); T('米',15,116,5,'#8a7458');
      R(292,114,18,13,'#b8a284'); R(292,114,18,2,'#c8b696');
      drawOven(20, 66, st.t, st.stage===3 ? 1 : 0.35);

      if (st.stage===0){
        // thickness dial around the dough
        for (let s=0;s<6;s++){

        // the palm
        const pr = st.pressing ? 9 : 7;
        ell(st.palmX, st.palmY, pr, pr*0.7, st.pressing ? 'rgba(242,182,50,0.35)' : 'rgba(244,232,208,0.20)');
        for (let a=0;a<Math.PI*2;a+=0.34) R(st.palmX+Math.cos(a)*pr, st.palmY+Math.sin(a)*pr*0.7, 1.4, 1.4, st.pressing ? '#ffe98a' : '#f4e8d0');

      if (st.stage===1){

          if (ph > 0.5){
            dome(CX0, CY0+1, 11+ph*0.45, ph+1, '#a87434');

          }
          if (ph > 2) dome(CX0, CY0-1, 7+ph*0.3, ph*0.7, '#e8bc78');
          const lx = st.pouring ? CX0 : CX0+30, ly = st.pouring ? 74 : 70;
          if (st.pouring){
            R(CX0-2, 82, 4, 14, '#d8a860'); R(CX0-1, 82, 2, 14, '#e8bc78');
          }
          dome(lx, ly+5, 9, 3, '#7a6a54');          // bowl underside
          ell(lx, ly+2, 9, 4, '#a89478');
          ell(lx, ly+1, 7, 3, st.pouring ? '#d8a860' : '#c8b696');
          R(lx+7, ly-14, 3, 17, '#8a6a48'); R(lx+7, ly-14, 3, 2, '#a88054');
          // fill gauge
          const gx = 96, gw = 128;
          R(gx, 150, gw, 9, 'rgba(20,12,16,0.85)');
          R(gx + gw*0.62/1.25, 149, gw*0.24/1.25, 11, 'rgba(124,232,124,0.30)');
          R(gx + gw*0.62/1.25, 149, 1, 11, '#7ce87c');
          R(gx + gw*0.86/1.25, 149, 1, 11, '#7ce87c');
          R(gx, 151, gw*clamp(st.paste,0,1.25)/1.25, 7, st.paste>0.86 ? '#ff8a70' : st.paste>=0.62 ? '#7ce87c' : '#f2b632');
          T('lotus paste', gx-2, 151, 5.2, '#cfc0a8','right');
          T('HOLD to pour — stop inside the green', 160, 162, 5.6, '#ffe9b0','center');
          T('let go when it looks right', 160, 171, 5, '#9a8c78','center');
        } else {
          const ph = clamp(st.paste,0,1.25)*11;
          dome(CX0, CY0+1, 11+ph*0.45, ph+1, '#a87434');
          dome(CX0, CY0, 10+ph*0.4, ph, '#d8a860');
          dome(CX0, CY0-1, 7+ph*0.3, ph*0.7, '#e8bc78');
          // target ring on the paste
          for (let a=0;a<Math.PI*2;a+=0.3) R(CX0+Math.cos(a)*9, (CY0-4)+Math.sin(a)*6, 1.4, 1.4, 'rgba(124,232,124,0.7)');
          R(CX0-1, CY0-5, 2, 2, '#7ce87c');
          // the yolk you are carrying
          circle(st.yolkX, st.yolkY, 5, '#c07818');
          circle(st.yolkX, st.yolkY-1, 4, '#ffb030');
          circle(st.yolkX-1, st.yolkY-2, 2, '#ffd964');
          T('drop the salted yolk in the CENTRE', 160, 158, 5.8, '#ffe9b0','center');
          T('move it  ·  click or ✓ to set it', 160, 168, 5.2, '#9a8c78','center');
        }
      }

      if (st.stage===2){
        const ph = clamp(st.paste,0,1.25)*10;
        dome(CX0, CY0+1, 13+ph*0.35, ph*0.9+1, '#a87434');
        dome(CX0, CY0, 12+ph*0.3, ph*0.8, '#d8a860');
        dome(CX0, CY0-1, 9+ph*0.25, ph*0.6, '#e8bc78');
        if (st.yolkSet){ circle(CX0, CY0-4, 3, '#c07818'); circle(CX0, CY0-5, 2, '#ffb030'); }
        // the mould: a round block with a pattern face, rotates
        const my = st.moldY, ra = st.moldRot*Math.PI/180;
        R(CX0-3, my-16, 6, 13, '#8a6a48'); R(CX0-6, my-20, 12, 5, '#a88054');
        ell(CX0, my, 16, 10, '#6a4c30'); ell(CX0, my-1, 15, 9, '#8a6a48');
        // pattern spokes show the rotation
        for (let k=0;k<4;k++){
          const a = ra + k*Math.PI/2;
          for (let r=3;r<12;r+=1.2) R(CX0+Math.cos(a)*r, (my-1)+Math.sin(a)*r*0.6, 1.4, 1.4, '#c8a860');
        }
        circle(CX0, my-1, 3, '#c8a860');
        // alignment guide on the dough
        const da = moldOff(), lined = da < 12;
        for (let k=0;k<4;k++){
          const a = st.moldTarget*Math.PI/180 + k*Math.PI/2;
          const gc = lined ? '#9cff9c' : '#4aba4a';
          for (let r=17;r<25;r+=1.4) R(CX0+Math.cos(a)*r, CY0+Math.sin(a)*r*0.62, 1.4, 1.4, gc);
          R(CX0+Math.cos(a)*26-1, CY0+Math.sin(a)*26*0.62-1, 3, 3, gc);
        }
        if (!st.moldDrop){
          T(lined ? 'LINED UP — now press!' : 'turn the mould onto the green guide', 160, 150, 6, lined ? '#7ce87c' : '#ffe9b0','center');
          T('◀ ▶ rotate  ·  click or ✓ to lower it', 160, 160, 5.2, '#9a8c78','center');
          const bx0 = 88, bw2 = 144, mid = bx0 + bw2/2, sc2 = (bw2/2)/45;
          R(bx0, 166, bw2, 7, 'rgba(20,12,16,0.85)');
          R(mid - 12*sc2, 165, 24*sc2, 9, 'rgba(124,232,124,0.30)');
          R(mid - 12*sc2, 165, 1, 9, '#7ce87c'); R(mid + 12*sc2, 165, 1, 9, '#7ce87c');
          R(mid + moldSigned()*sc2 - 1, 163, 2, 12, lined ? '#7ce87c' : '#f2b632');
        } else {
          // depth meter with the sweet band
          const dx0 = 246, dh = 76;
          R(dx0, 74, 11, dh, 'rgba(20,12,16,0.85)');
          R(dx0, 74 + dh*(1-0.98), 11, dh*0.40, 'rgba(255,138,112,0.25)');
          R(dx0, 74 + dh*(1-0.98), 11, dh*0.22, 'rgba(124,232,124,0.30)');
          R(dx0, 74 + dh*(1-0.98), 11, 1, '#7ce87c');
          R(dx0, 74 + dh*(1-0.58), 11, 1, '#7ce87c');
          const dy0 = 74 + dh*(1 - clamp(st.depth,0,1.25)/1.25);
          R(dx0-2, dy0-1, 15, 2, '#ffffff');
          T('DEPTH', dx0+5.5, 66, 5, '#cfc0a8','center');
          T('release inside the green', 160, 152, 6, '#ffe9b0','center');
          T('hold to press deeper  ·  let go to lift', 160, 162, 5.2, '#9a8c78','center');
        }
      }

      if (st.msgT>0 && st.stage!==3) T(st.msg, 160, 140, 6.2, st.msgC, 'center');
      if (st.flash>0){ cx.globalAlpha = st.flash*0.5; R(0,0,LW,LH,'#ffe98a'); cx.globalAlpha = 1; }
      cx.restore();
    }
  };
